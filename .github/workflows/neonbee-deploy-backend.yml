          # same binary check as a fresh install — otherwise it is discarded and npm ci
          # runs exactly as before. Repos with root install lifecycle scripts never use it.
          nb_nm_dir="${NB_NM_CACHE_DIR:-$HOME/.cache/neonbee-nm-cache}/${GITHUB_REPOSITORY//\//__}"
          nb_nm_bins_ok() {
            local b
            [ -f node_modules/.package-lock.json ] || return 1
            for b in $(node -e "const s=require('./package.json').scripts||{};const o=new Set();for(const k of ['test','build']){const m=String(s[k]||'').match(/\b(vitest|jest|vite|next|nest|tsc)\b/);if(m)o.add(m[1])}console.log([...o].join(' '))" 2>/dev/null); do
              [ -x "node_modules/.bin/$b" ] || return 1
              "node_modules/.bin/$b" --version >/dev/null 2>&1 || return 1
            done
            return 0
          }
          nb_nm_key() {
            [ -f package-lock.json ] || return 1
            node -e "const s=require('./package.json').scripts||{};process.exit(['preinstall','install','postinstall','prepare'].some(k=>s[k])?1:0)" 2>/dev/null || return 1
            NB_NM_FLAGS="$1" NB_NM_NPM="$(npm -v 2>/dev/null | cut -d. -f1)" node -e "const c=require('crypto'),fs=require('fs');const h=c.createHash('sha256');for(const f of ['package-lock.json','package.json','.npmrc'])if(fs.existsSync(f))h.update(f+'\0').update(fs.readFileSync(f));const env=Object.keys(process.env).filter(k=>/^(npm_config_(omit|include|production|only|legacy_peer_deps|ignore_scripts)|NODE_ENV)$/i.test(k)).sort().map(k=>k.toLowerCase()+'='+process.env[k]);h.update(['nm-v1',process.env.NB_NM_FLAGS,process.env.NB_NM_NPM,process.versions.node.split('.')[0],process.platform,process.arch,process.cwd().slice((process.env.GITHUB_WORKSPACE||'').length),...env].join('|'));console.log(h.digest('hex').slice(0,40))"
          }
          nb_nm_restore() {
            local f stage=".nb-nm-restore.$$"
            for f in "$nb_nm_dir/$1.tar.zst" "$nb_nm_dir/$1.tar.gz"; do
              [ -f "$f" ] || continue
              case "$f" in *.zst) command -v zstd >/dev/null 2>&1 || continue ;; esac
              rm -rf "$stage" node_modules && mkdir -p "$stage" || return 1
              if ( set -o pipefail; case "$f" in *.zst) zstd -dcq "$f" ;; *) gzip -dc "$f" ;; esac | tar -xf - -C "$stage" ) && [ -d "$stage/node_modules" ]; then
                mv "$stage/node_modules" node_modules && rm -rf "$stage"
                if nb_nm_bins_ok; then
                  touch "$f" 2>/dev/null || true
                  echo "node_modules restored from runner cache (${f##*/})"
                  return 0
                fi
                echo "::warning::cached node_modules failed the binary check — discarding it and running npm ci"
              else
                echo "::warning::cached node_modules archive unreadable — discarding it and running npm ci"
              fi
              rm -f "$f"; rm -rf "$stage" node_modules
            done
            return 1
          }
          nb_nm_save() {
            local ext tmp used root total old
            nb_nm_bins_ok || { echo "node_modules cache: fresh tree failed the binary check — not saving"; return 0; }
            used=$(df -P "$HOME" 2>/dev/null | awk 'NR==2{gsub("%","",$5);print $5}')
            [ "${used:-100}" -lt "${NB_NM_MAX_DISK_PCT:-85}" ] || { echo "::notice::node_modules cache: disk ${used:-?}% used — not saving"; return 0; }
            mkdir -p "$nb_nm_dir" || return 0
            if command -v zstd >/dev/null 2>&1; then ext=zst; else ext=gz; fi
            tmp="$nb_nm_dir/.$1.$$.$RANDOM.tmp"
            if ( set -o pipefail; tar -cf - node_modules | if [ "$ext" = zst ]; then zstd -q -3 -T4 -c; else gzip -1 -c; fi > "$tmp" ); then
              mv -f "$tmp" "$nb_nm_dir/$1.tar.$ext" && echo "node_modules saved to runner cache ($1.tar.$ext)"
            else
              rm -f "$tmp"; echo "::warning::node_modules cache save failed — ignored"
            fi
            # Bound the store: stale temps, >7 days, last 3 keys per repo, 10 GB total.
            find "$nb_nm_dir" -maxdepth 1 -name '.*.tmp' -mmin +120 -delete 2>/dev/null || true
            find "$nb_nm_dir" -maxdepth 1 -name '*.tar.*' -mtime +7 -delete 2>/dev/null || true
            ls -1t "$nb_nm_dir"/*.tar.* 2>/dev/null | tail -n +4 | while IFS= read -r old; do rm -f "$old"; done
            root="${nb_nm_dir%/*}"
            total=$(du -sk "$root" 2>/dev/null | cut -f1)
            while [ "${total:-0}" -gt 10485760 ]; do
              old=$(ls -1tr "$root"/*/*.tar.* 2>/dev/null | head -1)
              [ -n "$old" ] || break
              rm -f "$old"; total=$(du -sk "$root" 2>/dev/null | cut -f1)
            done
            return 0
          }
          nb_nm_install() {
            local key
            key=$(nb_nm_key "$1") || key=""
            if [ -n "$key" ] && nb_nm_restore "$key"; then return 0; fi
            npm_ci_retry || return 1
            if [ -n "$key" ]; then nb_nm_save "$key"; fi
            return 0
          }
          npm_ci_retry() {
            # The registry drops connections mid-tarball on this fleet:
            # ECONNRESET killed core integration-tests, crm contract-tests and
            # crm build-deploy on 2026-08-22 alone. NPM_CONFIG_FETCH_RETRIES
            # only covers fetches npm itself classifies as retryable, and a
            # socket reset during a tarball read is not always one of them.
            # Purge inside the loop so every attempt installs from clean —
            # warm slots keep node_modules between runs.
            local attempt rc
            for attempt in 1 2 3; do
              rm -rf node_modules
              npm ci --legacy-peer-deps --include=dev --prefer-offline --no-audit --no-fund && return 0
              rc=$?
              if [ $attempt -lt 3 ]; then
                echo "::warning::npm ci failed (exit $rc) on attempt $attempt — retrying after cache clean"
                npm cache clean --force >/dev/null 2>&1 || true
                sleep $((attempt * 15))
              fi
            done
            echo "::error::npm ci failed on every attempt — dependencies are NOT installed. Not continuing with a partial tree."
            return 1
          }
          nb_nm_install "--legacy-peer-deps --include=dev"
          npm run build

      - name: Setup SSH agent
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          echo "${{ secrets.CONTABO_SSH_KEY }}" | ssh-add -
          echo "${{ secrets.DIGITALOCEAN_SSH_KEY }}" | ssh-add - 2>/dev/null || true
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      # ── Dev ──────────────────────────────────────────────────────────────
      - name: Deploy to Dev
        if: github.ref == 'refs/heads/develop'
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}-dev
          PORT: ${{ inputs.port_dev }}
          HEALTH: ${{ inputs.health_path }}
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null
          # ── Dev database ─────────────────────────────────────────────────
          # There is no dev Supabase project: CI holds one set of credentials
          # and they are production's. Dev therefore runs against the SAME
          # database as prod (user decision, 2026-09-21) — SUPABASE_*_DEV
          # overrides it the moment those secrets exist. Say so on every deploy
          # so nobody discovers it from a support ticket.
          if [ -z "${{ secrets.SUPABASE_URL_DEV }}" ]; then
            echo "::warning title=Dev is on the PRODUCTION database::No SUPABASE_URL_DEV secret — ${{ inputs.service_name }} (dev) reads and writes production data. Anything you create while testing on dev is real."
            {
              echo "### ⚠️ Dev runs on the production database"
              echo ""
              echo "\`${{ inputs.service_name }}\` was deployed to dev against the **production**"
              echo "Supabase project, because no \`SUPABASE_URL_DEV\` secret exists."
              echo "Test data written on dev is production data."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # ── Directory isolation ──────────────────────────────────────────
          # The dev tier MUST NOT deploy into the prod tree. On the Contabo VM
          # /github/neonbee/so360-* is what the *-prod-ha PM2 apps serve from,
          # so an rsync --delete + .env rewrite there would hand production a
          # dev build (dev Supabase, SERVICE_PORT_BAND, CORS) at its next
          # restart. Remap every path into /github/neonbee-dev/ instead.
          case "$SERVICE_DIR" in
            /github/neonbee/*) SERVICE_DIR="/github/neonbee-dev/${SERVICE_DIR#/github/neonbee/}" ;;
            *)                 SERVICE_DIR="${SERVICE_DIR%/}-dev" ;;
          esac
          echo "dev deploy target: $SERVICE_DIR"

          CURRENT=$(ssh root@$SERVER_IP "cat '$SERVICE_DIR/.slot' 2>/dev/null || echo blue")
          NEW_SLOT=$([[ "$CURRENT" == "blue" ]] && echo green || echo blue)
          echo "Slot: $CURRENT → $NEW_SLOT"

          # Backup dist before overwriting (Blue/Green rollback target)
          ssh root@$SERVER_IP "
            mkdir -p '$SERVICE_DIR/dist-prev' '$SERVICE_DIR/dist'
            rsync -a --delete '$SERVICE_DIR/dist/' '$SERVICE_DIR/dist-prev/' 2>/dev/null || true
          "

          # Rsync dist/ only — source never touches target VM
          ssh root@$SERVER_IP "mkdir -p '$SERVICE_DIR/dist'"
          rsync -avz --delete dist/ "root@$SERVER_IP:$SERVICE_DIR/dist/"
          rsync -avz package.json package-lock.json "root@$SERVER_IP:$SERVICE_DIR/"

          ssh root@$SERVER_IP "SERVICE_DIR='$SERVICE_DIR' SERVICE_NAME='$SERVICE_NAME' PORT='$PORT' NEW_SLOT='$NEW_SLOT' bash -s" << 'DEPLOY_SCRIPT'
            set -e
            cd "$SERVICE_DIR"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22
            npm install --omit=dev --legacy-peer-deps --prefer-offline --no-audit --no-fund

            # ── Write CI-managed vars ────────────────────────────────────────
            {
              echo "NODE_ENV=development"
              echo "RELEASE_SHA=${{ github.sha }}"
              echo "SERVICE_PORT_BAND=6000"
              echo "PORT=$PORT"
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}"
              echo "SUPABASE_KEY=${{ secrets.SUPABASE_ANON_KEY_DEV || secrets.SUPABASE_ANON_KEY }}"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_DEV || secrets.SUPABASE_ANON_KEY }}"
              echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY_DEV || secrets.SUPABASE_SERVICE_KEY }}"
              echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_KEY_DEV || secrets.SUPABASE_SERVICE_KEY }}"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET_DEV || secrets.JWT_SECRET }}"
              echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}"
              echo "PAYROLL_ENCRYPTION_KEY=${{ secrets.PAYROLL_ENCRYPTION_KEY }}"
              echo "CORS_ORIGINS=${{ secrets.CORS_ORIGINS_DEV }}"
            } > .env.ci

            # ── Append optional secrets (only when the GitHub secret is set) ─
            [ -n "${{ secrets.STOREFRONT_JWT_SECRET }}" ]       && echo "STOREFRONT_JWT_SECRET=${{ secrets.STOREFRONT_JWT_SECRET }}"             >> .env.ci
            [ -n "${{ secrets.BUNNY_STORAGE_HOSTNAME }}" ]      && echo "BUNNY_STORAGE_HOSTNAME=${{ secrets.BUNNY_STORAGE_HOSTNAME }}"           >> .env.ci
            [ -n "${{ secrets.BUNNY_STORAGE_ZONE }}" ]          && echo "BUNNY_STORAGE_ZONE=${{ secrets.BUNNY_STORAGE_ZONE }}"                   >> .env.ci
            [ -n "${{ secrets.BUNNY_ACCESS_KEY }}" ]            && echo "BUNNY_ACCESS_KEY=${{ secrets.BUNNY_ACCESS_KEY }}"                       >> .env.ci
            [ -n "${{ secrets.BUNNY_PULL_ZONE_URL }}" ]         && echo "BUNNY_PULL_ZONE_URL=${{ secrets.BUNNY_PULL_ZONE_URL }}"                 >> .env.ci
            [ -n "${{ secrets.BUNNY_PREFIX }}" ]                && echo "BUNNY_PREFIX=${{ secrets.BUNNY_PREFIX }}"                               >> .env.ci
            [ -n "${{ secrets.CF_R2_ACCOUNT_ID }}" ]            && echo "CF_R2_ACCOUNT_ID=${{ secrets.CF_R2_ACCOUNT_ID }}"                       >> .env.ci
            [ -n "${{ secrets.CF_R2_ACCESS_KEY_ID }}" ]         && echo "CF_R2_ACCESS_KEY_ID=${{ secrets.CF_R2_ACCESS_KEY_ID }}"                 >> .env.ci
            [ -n "${{ secrets.CF_R2_SECRET_ACCESS_KEY }}" ]     && echo "CF_R2_SECRET_ACCESS_KEY=${{ secrets.CF_R2_SECRET_ACCESS_KEY }}"         >> .env.ci
            [ -n "${{ secrets.CF_R2_BUCKET }}" ]                && echo "CF_R2_BUCKET=${{ secrets.CF_R2_BUCKET }}"                               >> .env.ci
            [ -n "${{ secrets.CF_R2_PUBLIC_URL }}" ]            && echo "CF_R2_PUBLIC_URL=${{ secrets.CF_R2_PUBLIC_URL }}"                       >> .env.ci
            [ -n "${{ secrets.CF_R2_PREFIX }}" ]                && echo "CF_R2_PREFIX=${{ secrets.CF_R2_PREFIX }}"                               >> .env.ci
            [ -n "${{ secrets.INTERNAL_SERVICE_KEY }}" ]        && echo "INTERNAL_SERVICE_KEY=${{ secrets.INTERNAL_SERVICE_KEY }}"               >> .env.ci
            [ -n "${{ secrets.EMAIL_INTERNAL_KEY }}" ]          && echo "EMAIL_INTERNAL_KEY=${{ secrets.EMAIL_INTERNAL_KEY }}"                   >> .env.ci
            [ -n "${{ secrets.NOTIFICATION_INTERNAL_KEY }}" ]   && echo "NOTIFICATION_INTERNAL_KEY=${{ secrets.NOTIFICATION_INTERNAL_KEY }}"     >> .env.ci
            [ -n "${{ secrets.INBOX_SERVICE_KEY }}" ]           && echo "INBOX_SERVICE_KEY=${{ secrets.INBOX_SERVICE_KEY }}"                     >> .env.ci
            [ -n "${{ secrets.NEURA_INTERNAL_KEY }}" ]    && echo "NEURA_INTERNAL_KEY=${{ secrets.NEURA_INTERNAL_KEY }}"                      >> .env.ci
            [ -n "${{ secrets.NEURA_INTERNAL_KEY_2 }}" ]  && echo "NEURA_INTERNAL_KEY_2=${{ secrets.NEURA_INTERNAL_KEY_2 }}"                    >> .env.ci
            [ -n "${{ secrets.CONNECT_INTERNAL_KEY }}" ]  && echo "CONNECT_INTERNAL_KEY=${{ secrets.CONNECT_INTERNAL_KEY }}"                    >> .env.ci
            [ -n "${{ secrets.CONNECT_INTERNAL_KEYS }}" ] && echo "CONNECT_INTERNAL_KEYS=${{ secrets.CONNECT_INTERNAL_KEYS }}"                   >> .env.ci
            [ -n "${{ secrets.MARKETING_INTERNAL_KEY }}" ] && echo "MARKETING_INTERNAL_KEY=${{ secrets.MARKETING_INTERNAL_KEY }}"                  >> .env.ci
            [ -n "${{ secrets.MARKETING_TRACKING_SECRET }}" ] && echo "MARKETING_TRACKING_SECRET=${{ secrets.MARKETING_TRACKING_SECRET }}"               >> .env.ci
            [ -n "${{ secrets.GEMINI_API_KEY }}" ]              && echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"                           >> .env.ci
            [ -n "${{ secrets.OPENAI_API_KEY }}" ]              && echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"                           >> .env.ci
            [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]           && echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"                     >> .env.ci
            [ -n "${{ secrets.STOREFRONT_INTERNAL_OPS_KEY }}" ] && echo "STOREFRONT_INTERNAL_OPS_KEY=${{ secrets.STOREFRONT_INTERNAL_OPS_KEY }}" >> .env.ci
            [ -n "${{ secrets.MOBILITY_INTERNAL_KEY }}" ]       && echo "MOBILITY_INTERNAL_KEY=${{ secrets.MOBILITY_INTERNAL_KEY }}"             >> .env.ci
            [ -n "${{ secrets.CHAT_INTERNAL_KEY }}" ]           && echo "CHAT_INTERNAL_KEY=${{ secrets.CHAT_INTERNAL_KEY }}"                     >> .env.ci
            [ -n "${{ secrets.DOCS_INTERNAL_SERVICE_KEY }}" ]   && echo "DOCS_INTERNAL_SERVICE_KEY=${{ secrets.DOCS_INTERNAL_SERVICE_KEY }}"     >> .env.ci
            [ -n "${{ secrets.CRM_SYNC_INTERNAL_KEY }}" ]       && echo "CRM_SYNC_INTERNAL_KEY=${{ secrets.CRM_SYNC_INTERNAL_KEY }}"             >> .env.ci
            [ -n "${{ secrets.MAINTENANCE_INTERNAL_KEY }}" ]       && echo "MAINTENANCE_INTERNAL_KEY=${{ secrets.MAINTENANCE_INTERNAL_KEY }}"             >> .env.ci
            # Channel Program: HS256 secret Core signs partner delegated-access session tokens with. Absent = /access/session returns 503 and no partner can enter a client tenant.
            [ -n "${{ secrets.CHANNEL_DELEGATION_SECRET }}" ] && echo "CHANNEL_DELEGATION_SECRET=${{ secrets.CHANNEL_DELEGATION_SECRET }}" >> .env.ci
            # Channel Program: AES-256-GCM key Subscription encrypts channel payout bank details with. Absent = payout-profile writes are refused (fail-closed).
            [ -n "${{ secrets.COMPENSATION_ENCRYPTION_KEY }}" ] && echo "COMPENSATION_ENCRYPTION_KEY=${{ secrets.COMPENSATION_ENCRYPTION_KEY }}" >> .env.ci
            [ -n "${{ secrets.VENDOR_BANK_ENC_KEY }}" ] && echo "VENDOR_BANK_ENC_KEY=${{ secrets.VENDOR_BANK_ENC_KEY }}" >> .env.ci
            # AWS SES (Inbox email channel outbound + inbound S3 bodies). Mirrors the prod
            # workflow; dev/staging carried no AWS block at all until 2026-09-12, so a
            # SES-backed agent reply could not send there. Conditional like the rest.
            [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]          && echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"                     >> .env.ci
            [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]      && echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"             >> .env.ci
            [ -n "${{ secrets.AWS_REGION }}" ]                 && echo "AWS_REGION=${{ secrets.AWS_REGION }}"                                   >> .env.ci
            [ -n "${{ secrets.INBOX_EMAIL_S3_BUCKET }}" ]      && echo "INBOX_EMAIL_S3_BUCKET=${{ secrets.INBOX_EMAIL_S3_BUCKET }}"             >> .env.ci
            [ -n "${{ secrets.PLATFORM_OPS_INTERNAL_KEY }}" ] && echo "PLATFORM_OPS_INTERNAL_KEY=${{ secrets.PLATFORM_OPS_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.PROJECTS_INTERNAL_KEY }}" ]      && echo "PROJECTS_INTERNAL_KEY=${{ secrets.PROJECTS_INTERNAL_KEY }}"           >> .env.ci
            [ -n "${{ secrets.MANUFACTURING_INTERNAL_KEY }}" ] && echo "MANUFACTURING_INTERNAL_KEY=${{ secrets.MANUFACTURING_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.ACCOUNTING_INTERNAL_KEY }}" ]    && echo "ACCOUNTING_INTERNAL_KEY=${{ secrets.ACCOUNTING_INTERNAL_KEY }}"       >> .env.ci
            [ -n "${{ secrets.ACCOUNTING_INTERNAL_KEY_2 }}" ]  && echo "ACCOUNTING_INTERNAL_KEY_2=${{ secrets.ACCOUNTING_INTERNAL_KEY_2 }}"   >> .env.ci
            [ -n "${{ secrets.CORE_INTERNAL_KEY }}" ] && echo "CORE_INTERNAL_KEY=${{ secrets.CORE_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.CORE_PARTNER_INTERNAL_KEY }}" ] && echo "CORE_PARTNER_INTERNAL_KEY=${{ secrets.CORE_PARTNER_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.PARTNER_RESOLVE_INTERNAL_KEY }}" ] && echo "PARTNER_RESOLVE_INTERNAL_KEY=${{ secrets.PARTNER_RESOLVE_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.PEOPLE_INTERNAL_KEY }}" ]        && echo "PEOPLE_INTERNAL_KEY=${{ secrets.PEOPLE_INTERNAL_KEY }}"               >> .env.ci
            [ -n "${{ secrets.PEOPLE_INTERNAL_KEY_2 }}" ]      && echo "PEOPLE_INTERNAL_KEY_2=${{ secrets.PEOPLE_INTERNAL_KEY_2 }}"           >> .env.ci
            [ -n "${{ secrets.SUBSCRIPTION_INTERNAL_KEY }}" ]  && echo "SUBSCRIPTION_INTERNAL_KEY=${{ secrets.SUBSCRIPTION_INTERNAL_KEY }}"   >> .env.ci
            [ -n "${{ secrets.FLOW_INTERNAL_KEY }}" ]          && echo "FLOW_INTERNAL_KEY=${{ secrets.FLOW_INTERNAL_KEY }}"                   >> .env.ci
            [ -n "${{ secrets.VAPID_PUBLIC_KEY }}" ]            && echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}"                       >> .env.ci
            [ -n "${{ secrets.VAPID_PRIVATE_KEY }}" ]           && echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}"                     >> .env.ci
            [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]            && echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"                       >> .env.ci
            [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]        && echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"               >> .env.ci
            [ -n "${{ secrets.SLACK_CLIENT_ID }}" ] && echo "SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}" >> .env.ci
            [ -n "${{ secrets.SLACK_CLIENT_SECRET }}" ] && echo "SLACK_CLIENT_SECRET=${{ secrets.SLACK_CLIENT_SECRET }}" >> .env.ci
            [ -n "${{ secrets.SLACK_SIGNING_SECRET }}" ] && echo "SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}" >> .env.ci

            # ── Caller-supplied extra env vars for dev ────────────────────────
            EXTRA_ENV_DEV='${{ inputs.extra_env_dev }}'
            [ -n "$EXTRA_ENV_DEV" ] && printf '%s\n' "$EXTRA_ENV_DEV" >> .env.ci

            # Strip any KEY= lines where the secret wasn't set
            sed -i '/=$/d' .env.ci

            # ── PERMANENT FIX: Merge server-side secrets CI doesn't own ─────
            # Keys already on the server but absent from .env.ci are preserved.
            # This prevents future deployments from silently wiping secrets
            # that were added to the server after the workflow was last updated.
            if [ -f .env ]; then
              CI_KEYS=$(sed 's/=.*//' .env.ci | tr '\n' '|' | sed 's/|$//')
              [ -n "$CI_KEYS" ] && grep -vE "^(${CI_KEYS})=" .env >> .env.ci 2>/dev/null || true
            fi
            mv .env.ci .env

            pm2 stop "$SERVICE_NAME" 2>/dev/null || true
            pm2 delete "$SERVICE_NAME" 2>/dev/null || true
            sleep 3
            # Free the port, but never kill a PM2 daemon or PM2-managed process: in cluster mode the
            # God daemon holds the listen socket, and killing it takes every app on the VM down.
            SAFE_PIDS=" $(pgrep -f 'PM2 v.*God Daemon' | tr '\n' ' ') $(pm2 jlist 2>/dev/null | grep -oP '"pid":\K[0-9]+' | tr '\n' ' ') "
            for PID in $( { lsof -ti :"$PORT" 2>/dev/null; ss -Hlptn "sport = :$PORT" 2>/dev/null | grep -oP '(?<=pid=)\d+'; } | sort -u); do
              case "$SAFE_PIDS" in
                *" $PID "*) echo "Port $PORT held by PM2 pid $PID - not killing" ;;
                *) kill -9 "$PID" 2>/dev/null || true ;;
              esac
            done
            sleep 2
            MAIN_JS=$(find dist -name main.js | head -1)
            PORT=$PORT pm2 start "$MAIN_JS" --name "$SERVICE_NAME" --cwd "$SERVICE_DIR" --instances 1 --max-memory-restart 400M --update-env
            pm2 save
            HEALTH_PATH="${{ inputs.health_path }}"
            for i in {1..15}; do
              curl -fsS "http://127.0.0.1:$PORT${HEALTH_PATH}" >/dev/null 2>&1 && echo "Health check passed" && break
              [ "$i" -eq 15 ] && pm2 logs "$SERVICE_NAME" --lines 50 --nostream && exit 1
              sleep 2
            done
            echo "$NEW_SLOT" > .slot
            echo "Deployed $SERVICE_NAME on port $PORT (slot: $NEW_SLOT)"
          DEPLOY_SCRIPT

          # Push deploy metric to Pushgateway on Internal Tools VM (non-fatal)
          TOOLS=${{ secrets.INTERNAL_TOOLS_VM }}
          if [ -n "$TOOLS" ]; then
            ssh-keyscan -H $TOOLS >> ~/.ssh/known_hosts 2>/dev/null
            TS=$(date -u +%s)
            ssh root@$TOOLS "
              printf 'deploy_active_slot{service=\"${{ inputs.service_name }}\",slot=\"${NEW_SLOT}\",env=\"dev\",commit=\"${GITHUB_SHA:0:8}\"} 1\n' | \
                curl -s --data-binary @- http://localhost:9091/metrics/job/deploy/instance/${{ inputs.service_name }}-dev
              printf 'deploy_timestamp{service=\"${{ inputs.service_name }}\",slot=\"${NEW_SLOT}\",env=\"dev\",commit=\"${GITHUB_SHA:0:8}\"} ${TS}\n' | \
                curl -s --data-binary @- http://localhost:9091/metrics/job/deploy/instance/${{ inputs.service_name }}-dev
            " 2>/dev/null || true
          fi

      # ── Staging ──────────────────────────────────────────────────────────
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/qa'
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}-staging
          PORT: ${{ inputs.port_staging }}
          HEALTH: ${{ inputs.health_path }}
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null

          # ── Directory isolation ──────────────────────────────────────────
          # The staging tier MUST NOT deploy into the prod tree. On the Contabo VM
          # /github/neonbee/so360-* is what the *-prod-ha PM2 apps serve from,
          # so an rsync --delete + .env rewrite there would hand production a
          # staging build (dev Supabase, SERVICE_PORT_BAND, CORS) at its next
          # restart. Remap every path into /github/neonbee-staging/ instead.
          case "$SERVICE_DIR" in
            /github/neonbee/*) SERVICE_DIR="/github/neonbee-staging/${SERVICE_DIR#/github/neonbee/}" ;;
            *)                 SERVICE_DIR="${SERVICE_DIR%/}-staging" ;;
          esac
          echo "staging deploy target: $SERVICE_DIR"

          CURRENT=$(ssh root@$SERVER_IP "cat '$SERVICE_DIR/.slot' 2>/dev/null || echo blue")
          NEW_SLOT=$([[ "$CURRENT" == "blue" ]] && echo green || echo blue)

          ssh root@$SERVER_IP "
            mkdir -p '$SERVICE_DIR/dist-prev' '$SERVICE_DIR/dist'
            rsync -a --delete '$SERVICE_DIR/dist/' '$SERVICE_DIR/dist-prev/' 2>/dev/null || true
          "

          ssh root@$SERVER_IP "mkdir -p '$SERVICE_DIR/dist'"
          rsync -avz --delete dist/ "root@$SERVER_IP:$SERVICE_DIR/dist/"
          rsync -avz package.json package-lock.json "root@$SERVER_IP:$SERVICE_DIR/"

          ssh root@$SERVER_IP "SERVICE_DIR='$SERVICE_DIR' SERVICE_NAME='$SERVICE_NAME' PORT='$PORT' NEW_SLOT='$NEW_SLOT' bash -s" << 'DEPLOY_SCRIPT'
            set -e
            cd "$SERVICE_DIR"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22
            npm install --omit=dev --legacy-peer-deps --prefer-offline --no-audit --no-fund

            # ── Write CI-managed vars ────────────────────────────────────────
            {
              echo "NODE_ENV=staging"
              echo "RELEASE_SHA=${{ github.sha }}"
              echo "SERVICE_PORT_BAND=7000"
              echo "PORT=$PORT"
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_STAGING }}"
              echo "SUPABASE_KEY=${{ secrets.SUPABASE_ANON_KEY_STAGING }}"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_STAGING }}"
              echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY_STAGING }}"
              echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_KEY_STAGING }}"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET_STAGING }}"
              echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}"
              echo "PAYROLL_ENCRYPTION_KEY=${{ secrets.PAYROLL_ENCRYPTION_KEY }}"
              echo "CORS_ORIGINS=${{ secrets.CORS_ORIGINS_STAGING }}"
            } > .env.ci

            # ── Append optional secrets (only when the GitHub secret is set) ─
            [ -n "${{ secrets.STOREFRONT_JWT_SECRET_STAGING }}" ] && echo "STOREFRONT_JWT_SECRET=${{ secrets.STOREFRONT_JWT_SECRET_STAGING }}"   >> .env.ci
            [ -n "${{ secrets.BUNNY_STORAGE_HOSTNAME }}" ]      && echo "BUNNY_STORAGE_HOSTNAME=${{ secrets.BUNNY_STORAGE_HOSTNAME }}"           >> .env.ci
            [ -n "${{ secrets.BUNNY_STORAGE_ZONE }}" ]          && echo "BUNNY_STORAGE_ZONE=${{ secrets.BUNNY_STORAGE_ZONE }}"                   >> .env.ci
            [ -n "${{ secrets.BUNNY_ACCESS_KEY }}" ]            && echo "BUNNY_ACCESS_KEY=${{ secrets.BUNNY_ACCESS_KEY }}"                       >> .env.ci
            [ -n "${{ secrets.BUNNY_PULL_ZONE_URL }}" ]         && echo "BUNNY_PULL_ZONE_URL=${{ secrets.BUNNY_PULL_ZONE_URL }}"                 >> .env.ci
            [ -n "${{ secrets.BUNNY_PREFIX }}" ]                && echo "BUNNY_PREFIX=${{ secrets.BUNNY_PREFIX }}"                               >> .env.ci
            [ -n "${{ secrets.CF_R2_ACCOUNT_ID }}" ]            && echo "CF_R2_ACCOUNT_ID=${{ secrets.CF_R2_ACCOUNT_ID }}"                       >> .env.ci
            [ -n "${{ secrets.CF_R2_ACCESS_KEY_ID }}" ]         && echo "CF_R2_ACCESS_KEY_ID=${{ secrets.CF_R2_ACCESS_KEY_ID }}"                 >> .env.ci
            [ -n "${{ secrets.CF_R2_SECRET_ACCESS_KEY }}" ]     && echo "CF_R2_SECRET_ACCESS_KEY=${{ secrets.CF_R2_SECRET_ACCESS_KEY }}"         >> .env.ci
            [ -n "${{ secrets.CF_R2_BUCKET }}" ]                && echo "CF_R2_BUCKET=${{ secrets.CF_R2_BUCKET }}"                               >> .env.ci
            [ -n "${{ secrets.CF_R2_PUBLIC_URL }}" ]            && echo "CF_R2_PUBLIC_URL=${{ secrets.CF_R2_PUBLIC_URL }}"                       >> .env.ci
            [ -n "${{ secrets.CF_R2_PREFIX }}" ]                && echo "CF_R2_PREFIX=${{ secrets.CF_R2_PREFIX }}"                               >> .env.ci
            [ -n "${{ secrets.INTERNAL_SERVICE_KEY }}" ]        && echo "INTERNAL_SERVICE_KEY=${{ secrets.INTERNAL_SERVICE_KEY }}"               >> .env.ci
            [ -n "${{ secrets.EMAIL_INTERNAL_KEY }}" ]          && echo "EMAIL_INTERNAL_KEY=${{ secrets.EMAIL_INTERNAL_KEY }}"                   >> .env.ci
            [ -n "${{ secrets.NOTIFICATION_INTERNAL_KEY }}" ]   && echo "NOTIFICATION_INTERNAL_KEY=${{ secrets.NOTIFICATION_INTERNAL_KEY }}"     >> .env.ci
            [ -n "${{ secrets.INBOX_SERVICE_KEY }}" ]           && echo "INBOX_SERVICE_KEY=${{ secrets.INBOX_SERVICE_KEY }}"                     >> .env.ci
            [ -n "${{ secrets.NEURA_INTERNAL_KEY }}" ]    && echo "NEURA_INTERNAL_KEY=${{ secrets.NEURA_INTERNAL_KEY }}"                      >> .env.ci
            [ -n "${{ secrets.NEURA_INTERNAL_KEY_2 }}" ]  && echo "NEURA_INTERNAL_KEY_2=${{ secrets.NEURA_INTERNAL_KEY_2 }}"                    >> .env.ci
            [ -n "${{ secrets.CONNECT_INTERNAL_KEY }}" ]  && echo "CONNECT_INTERNAL_KEY=${{ secrets.CONNECT_INTERNAL_KEY }}"                    >> .env.ci
            [ -n "${{ secrets.CONNECT_INTERNAL_KEYS }}" ] && echo "CONNECT_INTERNAL_KEYS=${{ secrets.CONNECT_INTERNAL_KEYS }}"                   >> .env.ci
            [ -n "${{ secrets.MARKETING_INTERNAL_KEY }}" ] && echo "MARKETING_INTERNAL_KEY=${{ secrets.MARKETING_INTERNAL_KEY }}"                  >> .env.ci
            [ -n "${{ secrets.MARKETING_TRACKING_SECRET }}" ] && echo "MARKETING_TRACKING_SECRET=${{ secrets.MARKETING_TRACKING_SECRET }}"               >> .env.ci
            [ -n "${{ secrets.GEMINI_API_KEY }}" ]              && echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"                           >> .env.ci
            [ -n "${{ secrets.OPENAI_API_KEY }}" ]              && echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"                           >> .env.ci
            [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]           && echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"                     >> .env.ci
            [ -n "${{ secrets.STOREFRONT_INTERNAL_OPS_KEY }}" ] && echo "STOREFRONT_INTERNAL_OPS_KEY=${{ secrets.STOREFRONT_INTERNAL_OPS_KEY }}" >> .env.ci
            [ -n "${{ secrets.MOBILITY_INTERNAL_KEY }}" ]       && echo "MOBILITY_INTERNAL_KEY=${{ secrets.MOBILITY_INTERNAL_KEY }}"             >> .env.ci
            [ -n "${{ secrets.VAPID_PUBLIC_KEY }}" ]            && echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}"                       >> .env.ci
            [ -n "${{ secrets.VAPID_PRIVATE_KEY }}" ]           && echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}"                     >> .env.ci
            [ -n "${{ secrets.CRM_SYNC_INTERNAL_KEY }}" ]       && echo "CRM_SYNC_INTERNAL_KEY=${{ secrets.CRM_SYNC_INTERNAL_KEY }}"             >> .env.ci
            [ -n "${{ secrets.MAINTENANCE_INTERNAL_KEY }}" ]       && echo "MAINTENANCE_INTERNAL_KEY=${{ secrets.MAINTENANCE_INTERNAL_KEY }}"             >> .env.ci
            # Channel Program: HS256 secret Core signs partner delegated-access session tokens with. Absent = /access/session returns 503 and no partner can enter a client tenant.
            [ -n "${{ secrets.CHANNEL_DELEGATION_SECRET }}" ] && echo "CHANNEL_DELEGATION_SECRET=${{ secrets.CHANNEL_DELEGATION_SECRET }}" >> .env.ci
            # Channel Program: AES-256-GCM key Subscription encrypts channel payout bank details with. Absent = payout-profile writes are refused (fail-closed).
            [ -n "${{ secrets.COMPENSATION_ENCRYPTION_KEY }}" ] && echo "COMPENSATION_ENCRYPTION_KEY=${{ secrets.COMPENSATION_ENCRYPTION_KEY }}" >> .env.ci
            [ -n "${{ secrets.VENDOR_BANK_ENC_KEY }}" ] && echo "VENDOR_BANK_ENC_KEY=${{ secrets.VENDOR_BANK_ENC_KEY }}" >> .env.ci
            # AWS SES (Inbox email channel outbound + inbound S3 bodies). Mirrors the prod
            # workflow; dev/staging carried no AWS block at all until 2026-09-12, so a
            # SES-backed agent reply could not send there. Conditional like the rest.
            [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]          && echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"                     >> .env.ci
            [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]      && echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"             >> .env.ci
            [ -n "${{ secrets.AWS_REGION }}" ]                 && echo "AWS_REGION=${{ secrets.AWS_REGION }}"                                   >> .env.ci
            [ -n "${{ secrets.INBOX_EMAIL_S3_BUCKET }}" ]      && echo "INBOX_EMAIL_S3_BUCKET=${{ secrets.INBOX_EMAIL_S3_BUCKET }}"             >> .env.ci
            [ -n "${{ secrets.PLATFORM_OPS_INTERNAL_KEY }}" ] && echo "PLATFORM_OPS_INTERNAL_KEY=${{ secrets.PLATFORM_OPS_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.PROJECTS_INTERNAL_KEY }}" ]      && echo "PROJECTS_INTERNAL_KEY=${{ secrets.PROJECTS_INTERNAL_KEY }}"           >> .env.ci
            [ -n "${{ secrets.MANUFACTURING_INTERNAL_KEY }}" ] && echo "MANUFACTURING_INTERNAL_KEY=${{ secrets.MANUFACTURING_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.ACCOUNTING_INTERNAL_KEY }}" ]    && echo "ACCOUNTING_INTERNAL_KEY=${{ secrets.ACCOUNTING_INTERNAL_KEY }}"       >> .env.ci
            [ -n "${{ secrets.ACCOUNTING_INTERNAL_KEY_2 }}" ]  && echo "ACCOUNTING_INTERNAL_KEY_2=${{ secrets.ACCOUNTING_INTERNAL_KEY_2 }}"   >> .env.ci
            [ -n "${{ secrets.CORE_INTERNAL_KEY }}" ] && echo "CORE_INTERNAL_KEY=${{ secrets.CORE_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.CORE_PARTNER_INTERNAL_KEY }}" ] && echo "CORE_PARTNER_INTERNAL_KEY=${{ secrets.CORE_PARTNER_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.PARTNER_RESOLVE_INTERNAL_KEY }}" ] && echo "PARTNER_RESOLVE_INTERNAL_KEY=${{ secrets.PARTNER_RESOLVE_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.PEOPLE_INTERNAL_KEY }}" ]        && echo "PEOPLE_INTERNAL_KEY=${{ secrets.PEOPLE_INTERNAL_KEY }}"               >> .env.ci
            [ -n "${{ secrets.PEOPLE_INTERNAL_KEY_2 }}" ]      && echo "PEOPLE_INTERNAL_KEY_2=${{ secrets.PEOPLE_INTERNAL_KEY_2 }}"           >> .env.ci
            [ -n "${{ secrets.SUBSCRIPTION_INTERNAL_KEY }}" ]  && echo "SUBSCRIPTION_INTERNAL_KEY=${{ secrets.SUBSCRIPTION_INTERNAL_KEY }}"   >> .env.ci
            [ -n "${{ secrets.FLOW_INTERNAL_KEY }}" ]          && echo "FLOW_INTERNAL_KEY=${{ secrets.FLOW_INTERNAL_KEY }}"                   >> .env.ci
            [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]            && echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"                       >> .env.ci
            [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]        && echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"               >> .env.ci
            [ -n "${{ secrets.SLACK_CLIENT_ID }}" ] && echo "SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}" >> .env.ci
            [ -n "${{ secrets.SLACK_CLIENT_SECRET }}" ] && echo "SLACK_CLIENT_SECRET=${{ secrets.SLACK_CLIENT_SECRET }}" >> .env.ci
            [ -n "${{ secrets.SLACK_SIGNING_SECRET }}" ] && echo "SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}" >> .env.ci

            # ── Caller-supplied extra env vars for staging ────────────────────
            EXTRA_ENV_STAGING='${{ inputs.extra_env_staging }}'
            [ -n "$EXTRA_ENV_STAGING" ] && printf '%s\n' "$EXTRA_ENV_STAGING" >> .env.ci

            # Strip any KEY= lines where the secret wasn't set
            sed -i '/=$/d' .env.ci

            # ── PERMANENT FIX: Merge server-side secrets CI doesn't own ─────
            if [ -f .env ]; then
              CI_KEYS=$(sed 's/=.*//' .env.ci | tr '\n' '|' | sed 's/|$//')
              [ -n "$CI_KEYS" ] && grep -vE "^(${CI_KEYS})=" .env >> .env.ci 2>/dev/null || true
            fi
            mv .env.ci .env

            pm2 stop "$SERVICE_NAME" 2>/dev/null || true
            pm2 delete "$SERVICE_NAME" 2>/dev/null || true
            sleep 3
            # Free the port, but never kill a PM2 daemon or PM2-managed process: in cluster mode the
            # God daemon holds the listen socket, and killing it takes every app on the VM down.
            SAFE_PIDS=" $(pgrep -f 'PM2 v.*God Daemon' | tr '\n' ' ') $(pm2 jlist 2>/dev/null | grep -oP '"pid":\K[0-9]+' | tr '\n' ' ') "
            for PID in $( { lsof -ti :"$PORT" 2>/dev/null; ss -Hlptn "sport = :$PORT" 2>/dev/null | grep -oP '(?<=pid=)\d+'; } | sort -u); do
              case "$SAFE_PIDS" in
                *" $PID "*) echo "Port $PORT held by PM2 pid $PID - not killing" ;;
                *) kill -9 "$PID" 2>/dev/null || true ;;
              esac
            done
            sleep 2
            MAIN_JS=$(find dist -name main.js | head -1)
            PORT=$PORT pm2 start "$MAIN_JS" --name "$SERVICE_NAME" --cwd "$SERVICE_DIR" --instances 1 --max-memory-restart 400M --update-env
            pm2 save
            HEALTH_PATH="${{ inputs.health_path }}"
            for i in {1..15}; do
              curl -fsS "http://127.0.0.1:$PORT${HEALTH_PATH}" >/dev/null 2>&1 && echo "Health check passed" && break
              [ "$i" -eq 15 ] && pm2 logs "$SERVICE_NAME" --lines 50 --nostream && exit 1
              sleep 2
            done
            echo "$NEW_SLOT" > .slot
            echo "Deployed $SERVICE_NAME on port $PORT (slot: $NEW_SLOT)"
          DEPLOY_SCRIPT

          TOOLS=${{ secrets.INTERNAL_TOOLS_VM }}
          if [ -n "$TOOLS" ]; then
            ssh-keyscan -H $TOOLS >> ~/.ssh/known_hosts 2>/dev/null
            TS=$(date -u +%s)
            ssh root@$TOOLS "
              printf 'deploy_active_slot{service=\"${{ inputs.service_name }}\",slot=\"${NEW_SLOT}\",env=\"staging\",commit=\"${GITHUB_SHA:0:8}\"} 1\n' | \
                curl -s --data-binary @- http://localhost:9091/metrics/job/deploy/instance/${{ inputs.service_name }}-staging
              printf 'deploy_timestamp{service=\"${{ inputs.service_name }}\",slot=\"${NEW_SLOT}\",env=\"staging\",commit=\"${GITHUB_SHA:0:8}\"} ${TS}\n' | \
                curl -s --data-binary @- http://localhost:9091/metrics/job/deploy/instance/${{ inputs.service_name }}-staging
            " 2>/dev/null || true
          fi

      - name: Push build metrics
        if: always()
        continue-on-error: true
        run: |
          DURATION=$(( $(date +%s) - ${{ steps.timing.outputs.start }} ))
          STATUS="${{ job.status }}"
          TOOLS=${{ secrets.INTERNAL_TOOLS_VM }}
          ssh root@$TOOLS "
            printf 'ci_build_duration_seconds{service=\"${{ inputs.service_name }}\",env=\"${{ github.ref_name }}\",status=\"${STATUS}\"} ${DURATION}\n' | \
              curl -s --data-binary @- http://localhost:9091/metrics/job/ci/instance/${{ inputs.service_name }}
          " 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "Service: ${{ inputs.service_name }} | Branch: ${{ github.ref_name }} | Status: ${{ job.status }}"

  # ── Notify: Microsoft Teams webhook on completion ───────────────────────────
  # Additive only — does NOT change the gate → tests → build → deploy flow (Rule 0).
  # Runs after all jobs regardless of outcome, so gate/test failures are reported too.
  # No-ops silently when NOTIFY_WEBHOOK_URL is unset; never fails the pipeline.
  notify:
    name: Notify Teams
    needs: [gate, contract-tests, integration-tests, build-deploy]
    if: always()
    runs-on: [self-hosted, runner-vm]
    steps:
      - name: Post pipeline result to Teams
        env:
          HOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "NOTIFY_WEBHOOK_URL not set — skipping notification"; exit 0; fi
          if ${{ contains(needs.*.result, 'failure') }}; then
            STATUS="FAILURE"; COLOR="Attention"
          elif ${{ contains(needs.*.result, 'cancelled') }}; then
            STATUS="CANCELLED"; COLOR="Warning"
          else
            STATUS="SUCCESS"; COLOR="Good"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${GITHUB_SHA:0:8}"
          curl -sf -H 'Content-Type: application/json' --data @- "$HOOK" <<JSON || echo "Teams notify failed (non-fatal)"
          {
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  { "type": "TextBlock", "size": "Large", "weight": "Bolder", "color": "${COLOR}", "text": "${{ inputs.service_name }} — pipeline ${STATUS}", "wrap": true },
                  { "type": "TextBlock", "text": "${{ github.repository }} @ ${{ github.ref_name }}", "isSubtle": true, "spacing": "None", "wrap": true },
                  { "type": "FactSet", "facts": [
                    { "title": "Status", "value": "${STATUS}" },
                    { "title": "Branch", "value": "${{ github.ref_name }}" },
                    { "title": "Commit", "value": "${SHA}" },
                    { "title": "Trigger", "value": "${{ github.event_name }}" }
                  ] }
                ],
                "actions": [{ "type": "Action.OpenUrl", "title": "View run", "url": "${RUN_URL}" }]
              }
            }]
          }
          JSON
