# =============================================================================
# Neonbee — Reusable Next.js App Deploy Workflow
# =============================================================================
# Place in: neonbee-devops/.github/workflows/neonbee-deploy-nextjs.yml
#
# Used by: so360-storefront-web-fe, so360-command, so360-mobility-pwa
#
# Architecture (CLAUDE.md Rule 0 — NON-NEGOTIABLE):
#   Contabo runner: gate → build → rsync .next/ + public/
#   Target VM    : receives build output only → pm2 reload (no build on VM)
#
# Note: Next.js build output (.next/ + public/) is rsynced — not raw source.
#       node_modules are NOT rsynced. VM installs --omit=dev at runtime.
#
# Blue/Green additions (layered on top of live base pattern):
#   - .next-prev backup before overwrite (enables 30-sec rollback)
#   - .slot file tracks active slot
#   - Pushgateway metric pushed via SSH to Internal Tools VM
# =============================================================================

name: Deploy Next.js App (reusable)

on:
  workflow_call:
    inputs:
      test_max_workers:
        description: 'Worker cap for jest/vitest in the unit, contract and integration steps (jest --maxWorkers; vitest --maxWorkers, plus --minWorkers=1 on vitest < 4). Number or percent; 0 disables the cap. Empty = jest 2, vitest 4.'
        required: false
        type: string
        default: ''
      service_name:
        required: true
        type: string
      service_dir:
        required: true
        type: string
      port_dev:
        required: true
        type: number
      port_staging:
        required: true
        type: number
      node_version:
        required: false
        type: string
        default: '22'
      extra_env:
        description: 'Additional env lines written to .env.local before build'
        required: false
        type: string
        default: ''
    secrets:
      CONTABO_SSH_KEY:      { required: true }
      DIGITALOCEAN_SSH_KEY: { required: true }
      SERVER_IP:            { required: true }
      INTERNAL_TOOLS_VM:    { required: false }
      PAT_TOKEN:            { required: false }

env:
  # ── Test worker cap ──
  # The shared runner VM has 12 vCPU and runs 8 job slots. jest and vitest
  # default to (cores - 1) workers each, so concurrent jobs oversubscribed it
  # roughly 9x. TEST_WORKER_FLAGS_JS prints the flags for one npm script:
  #   jest          --maxWorkers=N
  #   vitest 1-3    --maxWorkers=N --minWorkers=1   (max alone conflicts with
  #                 the default minThreads: "options.minThreads and
  #                 options.maxThreads must not conflict")
  #   vitest >= 4   --maxWorkers=N                  (--minWorkers was removed
  #                 and is an "Unknown option" hard error)
  # Runner = the script text (vitest wins), else package.json deps (wrapper
  # scripts such as `bash scripts/test.sh`). Nothing is printed when the
  # script already pins workers or runs in band, or when the cap is 0.
  # Empty = per-runner default: jest 2, vitest 4. jsdom vitest suites are
  # far heavier per file; so360-command's gate hit its 20-min limit at 2.
  TEST_MAX_WORKERS: ${{ inputs.test_max_workers || '' }}
  TEST_WORKER_FLAGS_JS: |
    const fs = require('fs');
    const key = process.argv[1] || 'test';
    const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
    const s = (p.scripts || {})[key] || '';
    if (/--runInBand|(^|\s)-i(\s|$)|--maxWorkers|--minWorkers|--poolOptions|--no-file-parallelism/.test(s)) process.exit(0);
    const d = Object.assign({}, p.dependencies, p.devDependencies);
    let r = /vitest/.test(s) ? 'vitest' : /jest/.test(s) ? 'jest' : '';
    if (!r) r = d.vitest ? 'vitest' : d.jest ? 'jest' : '';
    const n = String(process.env.TEST_MAX_WORKERS || (r === 'vitest' ? '4' : '2')).trim();
    if (!/^[1-9][0-9]*%?$/.test(n)) process.exit(0);
    if (r === 'jest') console.log('--maxWorkers=' + n);
    if (r === 'vitest') {
      let major = parseInt(String(d.vitest || '3').replace(/^[^0-9]*/, ''), 10) || 3;
      try { major = parseInt(JSON.parse(fs.readFileSync('node_modules/vitest/package.json', 'utf8')).version, 10); } catch (e) {}
      console.log(major >= 4 ? '--maxWorkers=' + n : '--maxWorkers=' + n + ' --minWorkers=1');
    }
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  # Contabo slots intermittently drop npm registry connections (ECONNRESET,
  # three failures across runner-07/08 on 2026-08-20/21). Retry fetches inside
  # npm itself instead of burning a whole gate cycle per blip.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '2000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '30000'

jobs:

  # ── Gate: single merged job ────────────────────────────────────────────────
  gate:
    runs-on: [self-hosted, runner-vm]
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Isolate npm cache per job
        # runner.temp is step-only (not valid in job-level env), so set the
        # per-slot cache dir here — before npm ci — to keep the isolation that
        # stops shared _cacache races on Contabo hosts.
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4.3.0
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-v2-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-v2-${{ runner.os }}-
      - name: Install dependencies
        run: |
          # Warm runner slots keep node_modules between runs, so a bare
          # `npm ci` could reuse a stale or partial tree. The backend gate
          # already purges first; this one did not.
          rm -rf node_modules
          # node_modules reuse: a tree keyed on sha256(package-lock + package.json +
          # node/npm major + install flags + omit/include env) is stored per caller repo
          # in a host-local store shared by every runner slot. Writes go to a temp file
          # + atomic mv, so a reader only ever sees a complete archive; a restore is
          # extracted to a staging dir, moved in only when tar exits 0, and must pass the
          # same binary check as a fresh install — otherwise it is discarded and npm ci
          # runs exactly as before. Repos with root install lifecycle scripts never use it.
          nb_nm_dir="${NB_NM_CACHE_DIR:-$HOME/.cache/neonbee-nm-cache}/${GITHUB_REPOSITORY//\//__}"
          nb_nm_bins_ok() {
            local b
            [ -f node_modules/.package-lock.json ] || return 1
            for b in $(node -e "const s=require('./package.json').scripts||{};const o=new Set();for(const k of ['test','build']){const m=String(s[k]||'').match(/\b(vitest|jest|vite|next|nest|tsc)\b/);if(m)o.add(m[1])}console.log([...o].join(' '))" 2>/dev/null); do
              [ -x "node_modules/.bin/$b" ] || return 1
              "node_modules/.bin/$b" --version >/dev/null 2>&1 || return 1
            done
            return 0
          }
          nb_nm_key() {
            [ -f package-lock.json ] || return 1
            node -e "const s=require('./package.json').scripts||{};process.exit(['preinstall','install','postinstall','prepare'].some(k=>s[k])?1:0)" 2>/dev/null || return 1
            NB_NM_FLAGS="$1" NB_NM_NPM="$(npm -v 2>/dev/null | cut -d. -f1)" node -e "const c=require('crypto'),fs=require('fs');const h=c.createHash('sha256');for(const f of ['package-lock.json','package.json','.npmrc'])if(fs.existsSync(f))h.update(f+'\0').update(fs.readFileSync(f));const env=Object.keys(process.env).filter(k=>/^(npm_config_(omit|include|production|only|legacy_peer_deps|ignore_scripts)|NODE_ENV)$/i.test(k)).sort().map(k=>k.toLowerCase()+'='+process.env[k]);h.update(['nm-v1',process.env.NB_NM_FLAGS,process.env.NB_NM_NPM,process.versions.node.split('.')[0],process.platform,process.arch,process.cwd().slice((process.env.GITHUB_WORKSPACE||'').length),...env].join('|'));console.log(h.digest('hex').slice(0,40))"
          }
          nb_nm_restore() {
            local f stage=".nb-nm-restore.$$"
            for f in "$nb_nm_dir/$1.tar.zst" "$nb_nm_dir/$1.tar.gz"; do
              [ -f "$f" ] || continue
              case "$f" in *.zst) command -v zstd >/dev/null 2>&1 || continue ;; esac
              rm -rf "$stage" node_modules && mkdir -p "$stage" || return 1
              if ( set -o pipefail; case "$f" in *.zst) zstd -dcq "$f" ;; *) gzip -dc "$f" ;; esac | tar -xf - -C "$stage" ) && [ -d "$stage/node_modules" ]; then
                mv "$stage/node_modules" node_modules && rm -rf "$stage"
                if nb_nm_bins_ok; then
                  touch "$f" 2>/dev/null || true
                  echo "node_modules restored from runner cache (${f##*/})"
                  return 0
                fi
                echo "::warning::cached node_modules failed the binary check — discarding it and running npm ci"
              else
                echo "::warning::cached node_modules archive unreadable — discarding it and running npm ci"
              fi
              rm -f "$f"; rm -rf "$stage" node_modules
            done
            return 1
          }
          nb_nm_save() {
            local ext tmp used root total old
            nb_nm_bins_ok || { echo "node_modules cache: fresh tree failed the binary check — not saving"; return 0; }
            used=$(df -P "$HOME" 2>/dev/null | awk 'NR==2{gsub("%","",$5);print $5}')
            [ "${used:-100}" -lt "${NB_NM_MAX_DISK_PCT:-85}" ] || { echo "::notice::node_modules cache: disk ${used:-?}% used — not saving"; return 0; }
            mkdir -p "$nb_nm_dir" || return 0
            if command -v zstd >/dev/null 2>&1; then ext=zst; else ext=gz; fi
            tmp="$nb_nm_dir/.$1.$$.$RANDOM.tmp"
            if ( set -o pipefail; tar -cf - node_modules | if [ "$ext" = zst ]; then zstd -q -3 -T4 -c; else gzip -1 -c; fi > "$tmp" ); then
              mv -f "$tmp" "$nb_nm_dir/$1.tar.$ext" && echo "node_modules saved to runner cache ($1.tar.$ext)"
            else
              rm -f "$tmp"; echo "::warning::node_modules cache save failed — ignored"
            fi
            # Bound the store: stale temps, >7 days, last 3 keys per repo, 10 GB total.
            find "$nb_nm_dir" -maxdepth 1 -name '.*.tmp' -mmin +120 -delete 2>/dev/null || true
            find "$nb_nm_dir" -maxdepth 1 -name '*.tar.*' -mtime +7 -delete 2>/dev/null || true
            ls -1t "$nb_nm_dir"/*.tar.* 2>/dev/null | tail -n +4 | while IFS= read -r old; do rm -f "$old"; done
            root="${nb_nm_dir%/*}"
            total=$(du -sk "$root" 2>/dev/null | cut -f1)
            while [ "${total:-0}" -gt 10485760 ]; do
              old=$(ls -1tr "$root"/*/*.tar.* 2>/dev/null | head -1)
              [ -n "$old" ] || break
              rm -f "$old"; total=$(du -sk "$root" 2>/dev/null | cut -f1)
            done
            return 0
          }
          nb_nm_install() {
            local key
            key=$(nb_nm_key "$1") || key=""
            if [ -n "$key" ] && nb_nm_restore "$key"; then return 0; fi
            npm_ci_retry || return 1
            if [ -n "$key" ]; then nb_nm_save "$key"; fi
            return 0
          }
          npm_ci_retry() {
            # The registry drops connections mid-tarball on this fleet:
            # ECONNRESET killed core integration-tests, crm contract-tests and
            # crm build-deploy on 2026-08-22 alone. NPM_CONFIG_FETCH_RETRIES
            # only covers fetches npm itself classifies as retryable, and a
            # socket reset during a tarball read is not always one of them.
            # Purge inside the loop so every attempt installs from clean —
            # warm slots keep node_modules between runs.
            local attempt rc
            for attempt in 1 2 3; do
              rm -rf node_modules
              npm ci --legacy-peer-deps --include=dev --prefer-offline --no-audit --no-fund && return 0
              rc=$?
              if [ $attempt -lt 3 ]; then
                echo "::warning::npm ci failed (exit $rc) on attempt $attempt — retrying after cache clean"
                npm cache clean --force >/dev/null 2>&1 || true
                sleep $((attempt * 15))
              fi
            done
            echo "::error::npm ci failed on every attempt — dependencies are NOT installed. Not continuing with a partial tree."
            return 1
          }
          nb_nm_install "--legacy-peer-deps --include=dev"
          # `npm ci` can exit 0 on a corrupted ~/.npm cache (tar TAR_ENTRY_ERROR
          # warnings only) and still leave the test runner unusable. A missing
          # binary exits 127 and a half-installed one exits 1 — both read as
          # "unit tests failed" with no output. Verify by running it.
          TEST_BIN=$(node -e "const s=require('./package.json').scripts?.test||''; console.log(/vitest/.test(s)?'vitest':/jest/.test(s)?'jest':'')" 2>/dev/null || echo "")
          runner_ok() {
            [ -z "$TEST_BIN" ] && return 0
            [ -x "node_modules/.bin/$TEST_BIN" ] || return 1
            "node_modules/.bin/$TEST_BIN" --version >/dev/null 2>&1
          }
          if ! runner_ok; then
            echo "::warning::$TEST_BIN cannot run after npm ci — purging npm cache and reinstalling clean"
            npm cache clean --force
            rm -rf node_modules
            npm_ci_retry() {
            # The registry drops connections mid-tarball on this fleet:
            # ECONNRESET killed core integration-tests, crm contract-tests and
            # crm build-deploy on 2026-08-22 alone. NPM_CONFIG_FETCH_RETRIES
            # only covers fetches npm itself classifies as retryable, and a
            # socket reset during a tarball read is not always one of them.
            # Purge inside the loop so every attempt installs from clean —
            # warm slots keep node_modules between runs.
            local attempt rc
            for attempt in 1 2 3; do
              rm -rf node_modules
              npm ci --legacy-peer-deps --include=dev --prefer-offline --no-audit --no-fund && return 0
              rc=$?
              if [ $attempt -lt 3 ]; then
                echo "::warning::npm ci failed (exit $rc) on attempt $attempt — retrying after cache clean"
                npm cache clean --force >/dev/null 2>&1 || true
                sleep $((attempt * 15))
              fi
            done
            echo "::error::npm ci failed on every attempt — dependencies are NOT installed. Not continuing with a partial tree."
            return 1
          }
          npm_ci_retry
          fi
          if ! runner_ok; then
            echo "::error::$TEST_BIN still cannot run after a clean reinstall — this runner slot cannot run the gate"
            exit 1
          fi
      - name: Run unit tests
        env:
          CI: 'true'
        run: |
          # `--passWithNoTests` makes an empty or mis-globbed suite exit 0.
          # Assert a floor first so "0 tests" fails loudly with a name attached
          # instead of reading as a pass.
          SPEC_COUNT=$( { git ls-files '*.spec.ts' '*.spec.tsx' '*.test.ts' '*.test.tsx' 2>/dev/null || true; } | wc -l | tr -d ' ')
          echo "Tracked spec files: $SPEC_COUNT"
          if [ "$SPEC_COUNT" -eq 0 ]; then
            echo "::error::No tracked spec files found — the unit tier is not enforced for this repo."
            exit 1
          fi
          WORKER_FLAGS=$(node -e "$TEST_WORKER_FLAGS_JS" test 2>/dev/null || true); echo "Test worker cap (test): ${WORKER_FLAGS:-none}"
          npm test -- --passWithNoTests $WORKER_FLAGS
      - name: Security audit
        env:
          NB_EVENT: ${{ github.event_name }}
          NB_REF: ${{ github.ref }}
          NB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Only re-audit when dependencies changed vs the PR base / previous
          # push. Pushes to main, other events, a new branch (before=000…) or
          # any git error always run the full audit. A skip exits 0, so the
          # gate job — which the UT + security requirement reads — stays green.
          if [ "$NB_REF" != "refs/heads/main" ] \
             && { [ "$NB_EVENT" = pull_request ] || [ "$NB_EVENT" = pull_request_target ] || [ "$NB_EVENT" = push ]; } \
             && [ -n "$NB_BASE_SHA" ] && ! echo "$NB_BASE_SHA" | grep -qE '^0+$' \
             && { git cat-file -e "$NB_BASE_SHA^{commit}" 2>/dev/null || git fetch -q --depth=1 origin "$NB_BASE_SHA" 2>/dev/null; } \
             && git diff --quiet "$NB_BASE_SHA" HEAD -- ':(glob)**/package.json' ':(glob)**/package-lock.json' 2>/dev/null; then
            echo "::notice title=Security audit::package.json / package-lock.json unchanged vs ${NB_BASE_SHA:0:12} — npm audit skipped (full audit runs on main pushes and on any dependency change)"
            exit 0
          fi
          # `X=$(cmd); RC=$?` under the runner's `bash -e` exits on the
          # assignment itself, so a critical advisory killed the step before
          # anything was printed. Capture the status with `||` instead.
          AUDIT_EXIT=0
          AUDIT_OUT=$(npm audit --audit-level=critical --omit=dev 2>&1) || AUDIT_EXIT=$?
          echo "$AUDIT_OUT"
          if [ $AUDIT_EXIT -ne 0 ] && echo "$AUDIT_OUT" | grep -q "audit endpoint returned an error"; then
            echo "::warning::npm audit endpoint unavailable (registry-side) — skipping, not treated as failure"
            exit 0
          fi
          if [ $AUDIT_EXIT -ne 0 ]; then
            echo "::error title=Security audit::critical advisory in production dependencies (npm audit exit $AUDIT_EXIT) - summary:"
            echo "$AUDIT_OUT" | tail -40
          fi
          exit $AUDIT_EXIT
      - name: Check dependency licenses
        run: >-
          npx license-checker
          --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0"
          --excludePrivatePackages
      - name: Scan for secrets
        run: |
          rm -rf .next/ out/
          GITLEAKS_VERSION="8.30.1"
          # gitleaks loads the full history into memory. With several repos
          # gating at once on a 3-slot Mac Mini it gets OOM-killed (SIGKILL,
          # exit 137) — three repos hit this simultaneously on 2026-08-20 after
          # the new tiers took each backend deploy from 3 jobs to 5.
          #
          # A killed scan has found nothing, so it must never read as a pass.
          # Retry with a backoff, and fail loudly if it is still being killed.
          run_gitleaks() {
            local bin="$1" attempt=1 rc=0
            while [ $attempt -le 3 ]; do
              rc=0
              "$bin" detect --source . --verbose || rc=$?
              [ $rc -eq 0 ] && return 0
              if [ $rc -eq 137 ] || [ $rc -eq 139 ]; then
                echo "::warning::gitleaks killed (exit $rc) on attempt $attempt — runner memory pressure, retrying"
                sleep $((attempt * 20))
                attempt=$((attempt + 1))
                continue
              fi
              return $rc   # a real finding, or a real error
            done
            echo "::error::gitleaks was killed on every attempt — the secrets scan did NOT run. Not treating an unrun scan as a pass."
            return 1
          }
          if command -v gitleaks &>/dev/null; then
            run_gitleaks gitleaks
          else
            _GL_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            _GL_ARCH=$(uname -m)
            case "$_GL_ARCH" in x86_64) _GL_ARCH="x64" ;; arm64|aarch64) _GL_ARCH="arm64" ;; esac
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${_GL_OS}_${_GL_ARCH}.tar.gz" | tar -xz -C /tmp/
            run_gitleaks /tmp/gitleaks
          fi

  # ── Build + Deploy (gate must pass) ───────────────────────────────────────
  build-deploy:
    needs: [gate]
    # Linux only: the Mac Mini gate runners also carry `contabo` (they run the
    # gate), but this job builds + rsyncs to the VMs and assumes a Linux host.
    runs-on: [self-hosted, runner-vm]
    concurrency:
      group: neonbee-deploy-${{ inputs.service_name }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Isolate npm cache per job
        # runner.temp is step-only (not valid in job-level env), so set the
        # per-slot cache dir here — before npm ci — to keep the isolation that
        # stops shared _cacache races on Contabo hosts.
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4.3.0
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-v2-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-v2-${{ runner.os }}-

      - name: Record build start
        id: timing
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Install dependencies and build
        run: |
          EXTRA_ENV='${{ inputs.extra_env }}'
          [ -n "$EXTRA_ENV" ] && echo "$EXTRA_ENV" > .env.local
          # NEXT_PUBLIC_* are inlined at BUILD time, so writing them into the
          # runtime .env on the VM is too late: partner-portal booted and then
          # threw "Your project's URL and Key are required to create a Supabase
          # client!" out of its middleware on every request. Bake them in here.
          # Dev has no Supabase project of its own, so it uses production's
          # (user decision, 2026-09-21) until SUPABASE_*_DEV exists.
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_DEV || secrets.SUPABASE_ANON_KEY }}"
          } >> .env.local
          sed -i '/=$/d' .env.local 2>/dev/null || true
          # --include=dev: Docker-fleet runners may set NODE_ENV=production, which
          # makes `npm ci` omit devDeps and breaks the next build (next: not found).
          # node_modules reuse: a tree keyed on sha256(package-lock + package.json +
          # node/npm major + install flags + omit/include env) is stored per caller repo
          # in a host-local store shared by every runner slot. Writes go to a temp file
          # + atomic mv, so a reader only ever sees a complete archive; a restore is
          # extracted to a staging dir, moved in only when tar exits 0, and must pass the
          # same binary check as a fresh install — otherwise it is discarded and npm ci
          # runs exactly as before. Repos with root install lifecycle scripts never use it.
          nb_nm_dir="${NB_NM_CACHE_DIR:-$HOME/.cache/neonbee-nm-cache}/${GITHUB_REPOSITORY//\//__}"
          nb_nm_bins_ok() {
            local b
            [ -f node_modules/.package-lock.json ] || return 1
            for b in $(node -e "const s=require('./package.json').scripts||{};const o=new Set();for(const k of ['test','build']){const m=String(s[k]||'').match(/\b(vitest|jest|vite|next|nest|tsc)\b/);if(m)o.add(m[1])}console.log([...o].join(' '))" 2>/dev/null); do
              [ -x "node_modules/.bin/$b" ] || return 1
              "node_modules/.bin/$b" --version >/dev/null 2>&1 || return 1
            done
            return 0
          }
          nb_nm_key() {
            [ -f package-lock.json ] || return 1
            node -e "const s=require('./package.json').scripts||{};process.exit(['preinstall','install','postinstall','prepare'].some(k=>s[k])?1:0)" 2>/dev/null || return 1
            NB_NM_FLAGS="$1" NB_NM_NPM="$(npm -v 2>/dev/null | cut -d. -f1)" node -e "const c=require('crypto'),fs=require('fs');const h=c.createHash('sha256');for(const f of ['package-lock.json','package.json','.npmrc'])if(fs.existsSync(f))h.update(f+'\0').update(fs.readFileSync(f));const env=Object.keys(process.env).filter(k=>/^(npm_config_(omit|include|production|only|legacy_peer_deps|ignore_scripts)|NODE_ENV)$/i.test(k)).sort().map(k=>k.toLowerCase()+'='+process.env[k]);h.update(['nm-v1',process.env.NB_NM_FLAGS,process.env.NB_NM_NPM,process.versions.node.split('.')[0],process.platform,process.arch,process.cwd().slice((process.env.GITHUB_WORKSPACE||'').length),...env].join('|'));console.log(h.digest('hex').slice(0,40))"
          }
          nb_nm_restore() {
            local f stage=".nb-nm-restore.$$"
            for f in "$nb_nm_dir/$1.tar.zst" "$nb_nm_dir/$1.tar.gz"; do
              [ -f "$f" ] || continue
              case "$f" in *.zst) command -v zstd >/dev/null 2>&1 || continue ;; esac
              rm -rf "$stage" node_modules && mkdir -p "$stage" || return 1
              if ( set -o pipefail; case "$f" in *.zst) zstd -dcq "$f" ;; *) gzip -dc "$f" ;; esac | tar -xf - -C "$stage" ) && [ -d "$stage/node_modules" ]; then
                mv "$stage/node_modules" node_modules && rm -rf "$stage"
                if nb_nm_bins_ok; then
                  touch "$f" 2>/dev/null || true
                  echo "node_modules restored from runner cache (${f##*/})"
                  return 0
                fi
                echo "::warning::cached node_modules failed the binary check — discarding it and running npm ci"
              else
                echo "::warning::cached node_modules archive unreadable — discarding it and running npm ci"
              fi
              rm -f "$f"; rm -rf "$stage" node_modules
            done
            return 1
          }
          nb_nm_save() {
            local ext tmp used root total old
            nb_nm_bins_ok || { echo "node_modules cache: fresh tree failed the binary check — not saving"; return 0; }
            used=$(df -P "$HOME" 2>/dev/null | awk 'NR==2{gsub("%","",$5);print $5}')
            [ "${used:-100}" -lt "${NB_NM_MAX_DISK_PCT:-85}" ] || { echo "::notice::node_modules cache: disk ${used:-?}% used — not saving"; return 0; }
            mkdir -p "$nb_nm_dir" || return 0
            if command -v zstd >/dev/null 2>&1; then ext=zst; else ext=gz; fi
            tmp="$nb_nm_dir/.$1.$$.$RANDOM.tmp"
            if ( set -o pipefail; tar -cf - node_modules | if [ "$ext" = zst ]; then zstd -q -3 -T4 -c; else gzip -1 -c; fi > "$tmp" ); then
              mv -f "$tmp" "$nb_nm_dir/$1.tar.$ext" && echo "node_modules saved to runner cache ($1.tar.$ext)"
            else
              rm -f "$tmp"; echo "::warning::node_modules cache save failed — ignored"
            fi
            # Bound the store: stale temps, >7 days, last 3 keys per repo, 10 GB total.
            find "$nb_nm_dir" -maxdepth 1 -name '.*.tmp' -mmin +120 -delete 2>/dev/null || true
            find "$nb_nm_dir" -maxdepth 1 -name '*.tar.*' -mtime +7 -delete 2>/dev/null || true
            ls -1t "$nb_nm_dir"/*.tar.* 2>/dev/null | tail -n +4 | while IFS= read -r old; do rm -f "$old"; done
            root="${nb_nm_dir%/*}"
            total=$(du -sk "$root" 2>/dev/null | cut -f1)
            while [ "${total:-0}" -gt 10485760 ]; do
              old=$(ls -1tr "$root"/*/*.tar.* 2>/dev/null | head -1)
              [ -n "$old" ] || break
              rm -f "$old"; total=$(du -sk "$root" 2>/dev/null | cut -f1)
            done
            return 0
          }
          nb_nm_install() {
            local key
            key=$(nb_nm_key "$1") || key=""
            if [ -n "$key" ] && nb_nm_restore "$key"; then return 0; fi
            npm_ci_retry || return 1
            if [ -n "$key" ]; then nb_nm_save "$key"; fi
            return 0
          }
          npm_ci_retry() {
            # The registry drops connections mid-tarball on this fleet:
            # ECONNRESET killed core integration-tests, crm contract-tests and
            # crm build-deploy on 2026-08-22 alone. NPM_CONFIG_FETCH_RETRIES
            # only covers fetches npm itself classifies as retryable, and a
            # socket reset during a tarball read is not always one of them.
            # Purge inside the loop so every attempt installs from clean —
            # warm slots keep node_modules between runs.
            local attempt rc
            for attempt in 1 2 3; do
              rm -rf node_modules
              npm ci --legacy-peer-deps --include=dev --prefer-offline --no-audit --no-fund && return 0
              rc=$?
              if [ $attempt -lt 3 ]; then
                echo "::warning::npm ci failed (exit $rc) on attempt $attempt — retrying after cache clean"
                npm cache clean --force >/dev/null 2>&1 || true
                sleep $((attempt * 15))
              fi
            done
            echo "::error::npm ci failed on every attempt — dependencies are NOT installed. Not continuing with a partial tree."
            return 1
          }
          nb_nm_install "--legacy-peer-deps --include=dev"
          # Guard against an incomplete node_modules/next (npm ci can finish
          # cleanly yet leave deep next/dist files missing on the Docker fleet).
          # Verify all known sentinels pre-build; self-heal once, then fail fast.
          NEXT_SENTINELS="require.resolve('next/dist/compiled/jest-worker/processChild.js'); require.resolve('next/dist/build/webpack-config'); require.resolve('next/dist/server/route-modules/app-page/module.compiled'); require.resolve('next/dist/build/polyfills/polyfill-nomodule')"
          if ! node -e "$NEXT_SENTINELS" 2>/dev/null; then
            echo "::warning::next package incomplete after npm ci — purging npm cache and reinstalling clean"
            npm cache clean --force
            rm -rf node_modules
            npm_ci_retry() {
            # The registry drops connections mid-tarball on this fleet:
            # ECONNRESET killed core integration-tests, crm contract-tests and
            # crm build-deploy on 2026-08-22 alone. NPM_CONFIG_FETCH_RETRIES
            # only covers fetches npm itself classifies as retryable, and a
            # socket reset during a tarball read is not always one of them.
            # Purge inside the loop so every attempt installs from clean —
            # warm slots keep node_modules between runs.
            local attempt rc
            for attempt in 1 2 3; do
              rm -rf node_modules
              npm ci --legacy-peer-deps --include=dev --prefer-offline --no-audit --no-fund && return 0
              rc=$?
              if [ $attempt -lt 3 ]; then
                echo "::warning::npm ci failed (exit $rc) on attempt $attempt — retrying after cache clean"
                npm cache clean --force >/dev/null 2>&1 || true
                sleep $((attempt * 15))
              fi
            done
            echo "::error::npm ci failed on every attempt — dependencies are NOT installed. Not continuing with a partial tree."
            return 1
          }
          npm_ci_retry
            if ! node -e "$NEXT_SENTINELS"; then
              echo "::error::next package STILL incomplete after clean reinstall — runner disk/filesystem is corrupting installs on this slot. Rerun to land on another slot."
              exit 1
            fi
          fi
          npm run build

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.CONTABO_SSH_KEY }}
            ${{ secrets.DIGITALOCEAN_SSH_KEY }}

      # ── Dev ──────────────────────────────────────────────────────────────
      - name: Deploy to Dev
        if: github.ref == 'refs/heads/develop'
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}-dev
          PORT: ${{ inputs.port_dev }}
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null
          # ── Dev database ─────────────────────────────────────────────────
          # There is no dev Supabase project: CI holds one set of credentials
          # and they are production's. Dev therefore runs against the SAME
          # database as prod (user decision, 2026-09-21) — SUPABASE_*_DEV
          # overrides it the moment those secrets exist. Say so on every deploy
          # so nobody discovers it from a support ticket.
          if [ -z "${{ secrets.SUPABASE_URL_DEV }}" ]; then
            echo "::warning title=Dev is on the PRODUCTION database::No SUPABASE_URL_DEV secret — ${{ inputs.service_name }} (dev) reads and writes production data. Anything you create while testing on dev is real."
            {
              echo "### ⚠️ Dev runs on the production database"
              echo ""
              echo "\`${{ inputs.service_name }}\` was deployed to dev against the **production**"
              echo "Supabase project, because no \`SUPABASE_URL_DEV\` secret exists."
              echo "Test data written on dev is production data."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # ── Directory isolation ──────────────────────────────────────────
          # The dev tier MUST NOT deploy into the prod tree. On the Contabo VM
          # /github/neonbee/so360-* is what the *-prod-ha PM2 apps serve from,
          # so an rsync --delete + .env rewrite there would hand production a
          # dev build (dev Supabase, SERVICE_PORT_BAND, CORS) at its next
          # restart. Remap every path into /github/neonbee-dev/ instead.
          case "$SERVICE_DIR" in
            /github/neonbee/*) SERVICE_DIR="/github/neonbee-dev/${SERVICE_DIR#/github/neonbee/}" ;;
            *)                 SERVICE_DIR="${SERVICE_DIR%/}-dev" ;;
          esac
          echo "dev deploy target: $SERVICE_DIR"

          CURRENT=$(ssh root@$SERVER_IP "cat '$SERVICE_DIR/.slot' 2>/dev/null || echo blue")
          NEW_SLOT=$([[ "$CURRENT" == "blue" ]] && echo green || echo blue)
          echo "Slot: $CURRENT → $NEW_SLOT"

          # Backup .next before overwriting (Blue/Green rollback target)
          ssh root@$SERVER_IP "
            mkdir -p '$SERVICE_DIR/.next-prev' '$SERVICE_DIR/.next'
            rsync -a --delete '$SERVICE_DIR/.next/' '$SERVICE_DIR/.next-prev/' 2>/dev/null || true
          "

          # Rsync build output only — .next/ + public/ + package files
          # node_modules and source files are NOT deployed to VM
          ssh root@$SERVER_IP "mkdir -p '$SERVICE_DIR'"
          rsync -avz --delete --exclude 'node_modules' --exclude '.git' .next/ "root@$SERVER_IP:$SERVICE_DIR/.next/"
          rsync -avz package.json package-lock.json "root@$SERVER_IP:$SERVICE_DIR/"
          rsync -avz public/ "root@$SERVER_IP:$SERVICE_DIR/public/" 2>/dev/null || true
          # Standalone apps start with `cp .env.local .next/standalone/` and
          # otherwise read the committed .env.production at runtime — which
          # points server-side calls at Prod (storefront: 127.0.0.1:8020, the
          # Prod/HA API). Ship the build's .env.local (extra_env + public keys)
          # so runtime env matches the Dev build.
          [ -f .env.local ] && rsync -avz .env.local "root@$SERVER_IP:$SERVICE_DIR/.env.local"

          ssh root@$SERVER_IP "SERVICE_DIR='$SERVICE_DIR' SERVICE_NAME='$SERVICE_NAME' PORT='$PORT' NEW_SLOT='$NEW_SLOT' bash -s" << 'DEPLOY_SCRIPT'
            set -e
            cd "$SERVICE_DIR"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22
            rm -rf node_modules
            npm install --omit=dev --legacy-peer-deps --prefer-offline --no-audit --no-fund
            pm2 delete "$SERVICE_NAME" 2>/dev/null || true
            PORT=$PORT pm2 start npm --name "$SERVICE_NAME" -- start -- -p $PORT --hostname 0.0.0.0
            pm2 save
            for i in {1..15}; do
              curl -fsS "http://127.0.0.1:$PORT" >/dev/null 2>&1 && echo "Health check passed" && break
              [ "$i" -eq 15 ] && pm2 logs "$SERVICE_NAME" --lines 50 --nostream && exit 1
              sleep 2
            done
            echo "$NEW_SLOT" > .slot
            echo "Deployed $SERVICE_NAME on port $PORT (slot: $NEW_SLOT)"
          DEPLOY_SCRIPT

          # Push deploy metric to Pushgateway on Internal Tools VM
          TOOLS=${{ secrets.INTERNAL_TOOLS_VM }}
          if [ -n "$TOOLS" ]; then
            ssh-keyscan -H $TOOLS >> ~/.ssh/known_hosts 2>/dev/null || true
            TS=$(date -u +%s)
            ssh root@$TOOLS "
              printf 'deploy_active_slot{service=\"${{ inputs.service_name }}\",slot=\"${NEW_SLOT}\",env=\"dev\",commit=\"${GITHUB_SHA:0:8}\"} 1\n' | \
                curl -s --data-binary @- http://localhost:9091/metrics/job/deploy/instance/${{ inputs.service_name }}-dev
              printf 'deploy_timestamp{service=\"${{ inputs.service_name }}\",slot=\"${NEW_SLOT}\",env=\"dev\",commit=\"${GITHUB_SHA:0:8}\"} ${TS}\n' | \
                curl -s --data-binary @- http://localhost:9091/metrics/job/deploy/instance/${{ inputs.service_name }}-dev
            " || true
          fi

      # ── Staging ──────────────────────────────────────────────────────────
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/qa'
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}-staging
          PORT: ${{ inputs.port_staging }}
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null

          # ── Directory isolation ──────────────────────────────────────────
          # The staging tier MUST NOT deploy into the prod tree. On the Contabo VM
          # /github/neonbee/so360-* is what the *-prod-ha PM2 apps serve from,
          # so an rsync --delete + .env rewrite there would hand production a
          # staging build (dev Supabase, SERVICE_PORT_BAND, CORS) at its next
          # restart. Remap every path into /github/neonbee-staging/ instead.
          case "$SERVICE_DIR" in
            /github/neonbee/*) SERVICE_DIR="/github/neonbee-staging/${SERVICE_DIR#/github/neonbee/}" ;;
            *)                 SERVICE_DIR="${SERVICE_DIR%/}-staging" ;;
          esac
          echo "staging deploy target: $SERVICE_DIR"

          CURRENT=$(ssh root@$SERVER_IP "cat '$SERVICE_DIR/.slot' 2>/dev/null || echo blue")
          NEW_SLOT=$([[ "$CURRENT" == "blue" ]] && echo green || echo blue)

          ssh root@$SERVER_IP "
            mkdir -p '$SERVICE_DIR/.next-prev' '$SERVICE_DIR/.next'
            rsync -a --delete '$SERVICE_DIR/.next/' '$SERVICE_DIR/.next-prev/' 2>/dev/null || true
          "

          ssh root@$SERVER_IP "mkdir -p '$SERVICE_DIR'"
          rsync -avz --delete --exclude 'node_modules' --exclude '.git' .next/ "root@$SERVER_IP:$SERVICE_DIR/.next/"
          rsync -avz package.json package-lock.json "root@$SERVER_IP:$SERVICE_DIR/"
          rsync -avz public/ "root@$SERVER_IP:$SERVICE_DIR/public/" 2>/dev/null || true

          ssh root@$SERVER_IP "SERVICE_DIR='$SERVICE_DIR' SERVICE_NAME='$SERVICE_NAME' PORT='$PORT' NEW_SLOT='$NEW_SLOT' bash -s" << 'DEPLOY_SCRIPT'
            set -e
            cd "$SERVICE_DIR"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22
            rm -rf node_modules
            npm install --omit=dev --legacy-peer-deps --prefer-offline --no-audit --no-fund
            pm2 delete "$SERVICE_NAME" 2>/dev/null || true
            PORT=$PORT pm2 start npm --name "$SERVICE_NAME" -- start -- -p $PORT --hostname 0.0.0.0
            pm2 save
            for i in {1..15}; do
              curl -fsS "http://127.0.0.1:$PORT" >/dev/null 2>&1 && echo "Health check passed" && break
              [ "$i" -eq 15 ] && pm2 logs "$SERVICE_NAME" --lines 50 --nostream && exit 1
              sleep 2
            done
            echo "$NEW_SLOT" > .slot
            echo "Deployed $SERVICE_NAME on port $PORT (slot: $NEW_SLOT)"
          DEPLOY_SCRIPT

          TOOLS=${{ secrets.INTERNAL_TOOLS_VM }}
          if [ -n "$TOOLS" ]; then
            ssh-keyscan -H $TOOLS >> ~/.ssh/known_hosts 2>/dev/null || true
            TS=$(date -u +%s)
            ssh root@$TOOLS "
              printf 'deploy_active_slot{service=\"${{ inputs.service_name }}\",slot=\"${NEW_SLOT}\",env=\"staging\",commit=\"${GITHUB_SHA:0:8}\"} 1\n' | \
                curl -s --data-binary @- http://localhost:9091/metrics/job/deploy/instance/${{ inputs.service_name }}-staging
              printf 'deploy_timestamp{service=\"${{ inputs.service_name }}\",slot=\"${NEW_SLOT}\",env=\"staging\",commit=\"${GITHUB_SHA:0:8}\"} ${TS}\n' | \
                curl -s --data-binary @- http://localhost:9091/metrics/job/deploy/instance/${{ inputs.service_name }}-staging
            " || true
          fi

      - name: Push build metrics
        if: always()
        continue-on-error: true
        run: |
          DURATION=$(( $(date +%s) - ${{ steps.timing.outputs.start }} ))
          STATUS="${{ job.status }}"
          TOOLS=${{ secrets.INTERNAL_TOOLS_VM }}
          ssh root@$TOOLS "
            printf 'ci_build_duration_seconds{service=\"${{ inputs.service_name }}\",env=\"${{ github.ref_name }}\",status=\"${STATUS}\"} ${DURATION}\n' | \
              curl -s --data-binary @- http://localhost:9091/metrics/job/ci/instance/${{ inputs.service_name }}
          " 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "Service: ${{ inputs.service_name }} | Branch: ${{ github.ref_name }} | Status: ${{ job.status }}"

  # ── Notify: Microsoft Teams webhook on completion ───────────────────────────
  # Additive only — does NOT change the gate → build → deploy flow (Rule 0).
  # Runs after all jobs regardless of outcome, so gate failures are reported too.
  # No-ops silently when NOTIFY_WEBHOOK_URL is unset; never fails the pipeline.
  notify:
    name: Notify Teams
    needs: [gate, build-deploy]
    if: always()
    runs-on: [self-hosted, runner-vm]
    steps:
      - name: Post pipeline result to Teams
        env:
          HOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "NOTIFY_WEBHOOK_URL not set — skipping notification"; exit 0; fi
          if ${{ contains(needs.*.result, 'failure') }}; then
            STATUS="FAILURE"; COLOR="Attention"
          elif ${{ contains(needs.*.result, 'cancelled') }}; then
            STATUS="CANCELLED"; COLOR="Warning"
          else
            STATUS="SUCCESS"; COLOR="Good"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${GITHUB_SHA:0:8}"
          curl -sf -H 'Content-Type: application/json' --data @- "$HOOK" <<JSON || echo "Teams notify failed (non-fatal)"
          {
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  { "type": "TextBlock", "size": "Large", "weight": "Bolder", "color": "${COLOR}", "text": "${{ inputs.service_name }} — pipeline ${STATUS}", "wrap": true },
                  { "type": "TextBlock", "text": "${{ github.repository }} @ ${{ github.ref_name }}", "isSubtle": true, "spacing": "None", "wrap": true },
                  { "type": "FactSet", "facts": [
                    { "title": "Status", "value": "${STATUS}" },
                    { "title": "Branch", "value": "${{ github.ref_name }}" },
                    { "title": "Commit", "value": "${SHA}" },
                    { "title": "Trigger", "value": "${{ github.event_name }}" }
                  ] }
                ],
                "actions": [{ "type": "Action.OpenUrl", "title": "View run", "url": "${RUN_URL}" }]
              }
            }]
          }
          JSON
