# =============================================================================
# Neonbee — Reusable feature-branch PREVIEW deploy
# =============================================================================
# A push to feat/** or fix/** builds the repo exactly like the dev build and
# drops it into the branch's preview at https://pr-<slug>.skyoffice360.com.
# Only the repos a branch touches are deployed; everything else in the preview
# is develop's (nginx fallback on the preview host — see preview/README.md).
#
#   check  → skip [no-preview] commits, compute the slug (and, for site/next,
#            the app's own host pr-<slug>--<name>)
#   build  → build only (tests run in the pre-push gate and the PR gate)
#   deploy → Access app, then DNS (never the other way round), rsync to the
#            preview host, `preview-ctl deploy`, PR comment with the URL
#
# Never touches the Dev VM or any prod host: the only deploy target is
# the PREVIEW_HOST secret. Backend previews use SUPABASE_*_PREVIEW when set,
# otherwise the dev/prod database (user decision, 2026-09-30 — same as dev).
#
# Caller (in the repo's deploy.yml, alongside the develop/qa deploy job):
#
#   on:
#     push:
#       branches: [develop, qa, 'feat/**', 'fix/**']
#   jobs:
#     preview:
#       if: startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/')
#       permissions: { contents: read, pull-requests: write }
#       uses: Neonbee-ai/neonbee-devops/.github/workflows/neonbee-deploy-preview.yml@main
#       with:
#         kind: fe                 # fe | shell | be | site | next
#         name: crm                # /cdn/<name>/ or /api/<name>/ path segment
#         vite_base_url: https://dev-cdn.skyoffice360.com/crm/
#         vite_env: ${{ ... same block as vite_env_dev ... }}
#       secrets: inherit
#
# Standalone apps that live on their own dev hostname:
#   kind: site  — a static SPA (sso, client portal), served on its own host
#   kind: next  — a Next.js app run under pm2, on its own host
#   dev_host: dev-sso.skyoffice360.com   # rewritten to the preview host
# A non-MFE Vite app under /cdn/<name>/ (help, public signing) is kind fe
# with is_mfe: false.
# =============================================================================

name: Deploy preview (reusable)

on:
  workflow_call:
    inputs:
      kind:
        description: 'fe (a Vite app under /cdn/<name>/), shell (the host shell), be (a NestJS backend under /api/<name>/), site (a static app on its own host), next (a Next.js app on its own host)'
        required: true
        type: string
      name:
        description: 'Path segment: the dev-cdn folder for fe, the dev-api prefix for be, "shell" for the shell'
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: '22'
      # ── fe / shell ──
      vite_base_url:
        description: 'The DEV base URL (the preview host rewrites dev hostnames at serve time)'
        required: false
        type: string
        default: ''
      vite_core_api:
        required: false
        type: string
        default: 'https://dev-api.skyoffice360.com/core'
      vite_env:
        description: 'Extra VITE_* lines — pass the same block as vite_env_dev'
        required: false
        type: string
        default: ''
      is_shell:
        required: false
        type: boolean
        default: false
      needs_shell_packages:
        required: false
        type: boolean
        default: false
      is_mfe:
        description: 'fe only — false for a standalone SPA under /cdn/<name>/ (no remoteEntry.js; deep links fall back to its index.html)'
        required: false
        type: boolean
        default: true
      # ── site / next ──
      dev_host:
        description: 'The dev hostname the app is published on (e.g. dev-sso.skyoffice360.com); rewritten to the preview host'
        required: false
        type: string
        default: ''
      # ── be / next ──
      health_path:
        description: 'Health path (default /health for be, / for next)'
        required: false
        type: string
        default: ''
      extra_env:
        description: 'Extra KEY=value lines for a preview backend .env, or a Next.js .env.local (pass the dev block)'
        required: false
        type: string
        default: ''
    secrets:
      PREVIEW_HOST:            { required: false }
      PREVIEW_SSH_KEY:         { required: false }
      CONTABO_SSH_KEY:         { required: false }
      CF_PREVIEW_API_TOKEN:    { required: false }
      PAT_TOKEN:               { required: false }
      SUPABASE_URL_DEV:        { required: false }
      SUPABASE_ANON_KEY_DEV:   { required: false }
      SUPABASE_URL:            { required: false }
      SUPABASE_ANON_KEY:       { required: false }
      # Preview host config (DEV_ORIGIN) — written to /etc/so360-preview/ci.env each run.
      PREVIEW_DEV_ORIGIN:      { required: false }
      # Backend previews: *_PREVIEW when set, else *_DEV, else the prod DB
      # (user decision 2026-09-30 — there is no separate preview database yet).
      SUPABASE_URL_PREVIEW:         { required: false }
      SUPABASE_ANON_KEY_PREVIEW:    { required: false }
      SUPABASE_SERVICE_KEY_PREVIEW: { required: false }
      SUPABASE_SERVICE_KEY_DEV:     { required: false }
      SUPABASE_SERVICE_KEY:         { required: false }
      JWT_SECRET_DEV:          { required: false }
      JWT_SECRET:              { required: false }
      ENCRYPTION_KEY:              { required: false }
      VENDOR_BANK_ENC_KEY:         { required: false }
      PAYROLL_ENCRYPTION_KEY:      { required: false }
      STOREFRONT_JWT_SECRET:       { required: false }
      INTERNAL_SERVICE_KEY:        { required: false }
      NOTIFICATION_INTERNAL_KEY:   { required: false }
      EMAIL_INTERNAL_KEY:          { required: false }
      INBOX_SERVICE_KEY:           { required: false }
      GEMINI_API_KEY:              { required: false }
      OPENAI_API_KEY:              { required: false }
      ANTHROPIC_API_KEY:           { required: false }
      STOREFRONT_INTERNAL_OPS_KEY: { required: false }
      MOBILITY_INTERNAL_KEY:       { required: false }
      CHAT_INTERNAL_KEY:           { required: false }
      DOCS_INTERNAL_SERVICE_KEY:   { required: false }
      CRM_SYNC_INTERNAL_KEY:       { required: false }
      MARKETING_INTERNAL_KEY:      { required: false }
      MARKETING_TRACKING_SECRET:   { required: false }
      MAINTENANCE_INTERNAL_KEY:       { required: false }
      INVENTORY_INTERNAL_KEY:      { required: false }
      FULFILLMENT_INTERNAL_KEY:    { required: false }
      TICKETING_INTERNAL_KEY:      { required: false }
      CHANNEL_DELEGATION_SECRET:   { required: false }
      COMPENSATION_ENCRYPTION_KEY: { required: false }
      PLATFORM_OPS_INTERNAL_KEY:   { required: false }
      PROJECTS_INTERNAL_KEY:       { required: false }
      MANUFACTURING_INTERNAL_KEY:  { required: false }
      ACCOUNTING_INTERNAL_KEY:     { required: false }
      ACCOUNTING_INTERNAL_KEY_2:   { required: false }
      PEOPLE_INTERNAL_KEY:         { required: false }
      PEOPLE_INTERNAL_KEY_2:       { required: false }
      NEURA_INTERNAL_KEY:          { required: false }
      NEURA_INTERNAL_KEY_2:        { required: false }
      SUBSCRIPTION_INTERNAL_KEY:   { required: false }
      CORE_INTERNAL_KEY:           { required: false }
      CORE_PARTNER_INTERNAL_KEY:   { required: false }
      PARTNER_RESOLVE_INTERNAL_KEY: { required: false }
      CONNECT_INTERNAL_KEY:        { required: false }
      CONNECT_INTERNAL_KEYS:       { required: false }
      BUNNY_STORAGE_HOSTNAME:      { required: false }
      BUNNY_STORAGE_ZONE:          { required: false }
      BUNNY_ACCESS_KEY:            { required: false }
      BUNNY_PULL_ZONE_URL:         { required: false }
      BUNNY_PREFIX:                { required: false }
      CF_R2_ACCOUNT_ID:            { required: false }
      CF_R2_ACCESS_KEY_ID:         { required: false }
      CF_R2_SECRET_ACCESS_KEY:     { required: false }
      CF_R2_BUCKET:                { required: false }
      CF_R2_PUBLIC_URL:            { required: false }
      CF_R2_PREFIX:                { required: false }
      # Outbound mail (SES) — forwarded to the Connect preview only.
      AWS_ACCESS_KEY_ID:           { required: false }
      AWS_SECRET_ACCESS_KEY:       { required: false }
      AWS_REGION:                  { required: false }

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '2000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '30000'
  PREVIEW_DOMAIN: skyoffice360.com

jobs:
  check:
    runs-on: [self-hosted, runner-vm]
    outputs:
      run:  ${{ steps.c.outputs.run }}
      slug: ${{ steps.c.outputs.slug }}
      host: ${{ steps.c.outputs.host }}
    steps:
      - id: c
        env:
          BRANCH: ${{ github.ref_name }}
          MSG: ${{ github.event.head_commit.message }}
          KIND: ${{ inputs.kind }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            feat/*|fix/*) ;;
            *) echo "::notice::$BRANCH is not a feat/ or fix/ branch — no preview"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if printf '%s' "$MSG" | grep -qiF '[no-preview]'; then
            echo "::notice::[no-preview] in the commit message — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$KIND" in fe|shell|be|site|next) ;; *) echo "::error::kind must be fe, shell, be, site or next"; exit 1 ;; esac
          [[ "$NAME" =~ ^[a-z0-9][a-z0-9-]{0,40}$ ]] || { echo "::error::invalid name '$NAME'"; exit 1; }

          # ── slug (keep identical to neonbee-preview-teardown.yml) ──
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ ${#slug} -gt 50 ]; then
            h=$(printf '%s' "$BRANCH" | sha1sum | cut -c1-6)
            slug="$(printf '%s' "$slug" | cut -c1-43 | sed -E 's/-+$//')-$h"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "run=true"   >> "$GITHUB_OUTPUT"
          echo "Preview: https://pr-$slug.$PREVIEW_DOMAIN"

          # site/next apps get their own host: one DNS label (max 63 chars).
          if [ "$KIND" = site ] || [ "$KIND" = next ]; then
            label="pr-$slug--$NAME"
            if [ ${#label} -gt 63 ]; then
              h=$(printf '%s' "$label" | sha1sum | cut -c1-6)
              label="$(printf '%s' "$label" | cut -c1-56 | sed -E 's/-+$//')-$h"
            fi
            echo "host=$label.$PREVIEW_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "App: https://$label.$PREVIEW_DOMAIN"
          fi

  build-deploy:
    needs: [check]
    if: needs.check.outputs.run == 'true'
    # The runner VM only: the Mac Minis are reserved for autonomous QA and the
    # Dev VM never builds (it only receives dist).
    runs-on: [self-hosted, runner-vm]
    timeout-minutes: 25
    # Latest push wins: a newer push to the same branch cancels this one.
    concurrency:
      group: neonbee-preview-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      SLUG: ${{ needs.check.outputs.slug }}
      KIND: ${{ inputs.kind }}
      NAME: ${{ inputs.name }}
      REPO: ${{ github.event.repository.name }}
      APP_HOST: ${{ needs.check.outputs.host }}
    steps:
      - name: Preconditions
        env:
          HOST: ${{ secrets.PREVIEW_HOST }}
          DBURL: ${{ secrets.SUPABASE_URL_PREVIEW || secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}
          PVURL: ${{ secrets.SUPABASE_URL_PREVIEW }}
        run: |
          [ -n "$HOST" ] || { echo "::error::PREVIEW_HOST secret is not set — previews are not provisioned yet"; exit 1; }
          if [ "$KIND" = be ]; then
            [ -n "$DBURL" ] || { echo "::error::no SUPABASE_URL secret reaches this repo — a backend preview cannot start"; exit 1; }
            if [ -z "$PVURL" ]; then
              echo "::warning title=Preview backend is on the PRODUCTION database::No SUPABASE_URL_PREVIEW secret — this preview reads and writes production data (same as dev). Schedulers, event workers and outbound mail stay off."
            fi
          fi

      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Isolate npm cache per job
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4.3.0
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-v2-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-v2-${{ runner.os }}-

      - name: Configure private package registry
        run: |
          npm config set @so360:registry https://npm.pkg.github.com --global
          npm config set //npm.pkg.github.com/:_authToken "${PAT_TOKEN}" --global
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      # Same install as the dev build, including the real @so360 packages for
      # remotes (see neonbee-deploy-vite-mfe.yml for why stubs are not enough).
      - name: Install dependencies
        run: |
          set -euo pipefail
          RUNNER_PARENT="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          STALE_PKG="$RUNNER_PARENT/so360-shell-fe"
          [ -L "$STALE_PKG" ] && rm -f "$STALE_PKG"
          if { [ "$KIND" = fe ] || [ "$KIND" = shell ] || [ "$KIND" = site ]; } && [ "${{ inputs.needs_shell_packages }}" = "true" ] && [ "${{ inputs.is_shell }}" != "true" ]; then
            rm -rf _shell-fe
            # Build against the same-named so360-shell-fe branch when it exists,
            # so a branch that changes @so360/* in the shell previews together.
            SHELL_URL="https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/Neonbee-ai/so360-shell-fe.git"
            shell_clone() {
              rm -rf _shell-fe
              git clone --depth 1 --filter=blob:none --sparse --branch "$1" "$SHELL_URL" _shell-fe
            }
            SHELL_BRANCH="${{ github.ref_name }}"
            if ! shell_clone "$SHELL_BRANCH"; then
              SHELL_BRANCH=develop
              shell_clone "$SHELL_BRANCH" || rm -rf _shell-fe
            fi
            echo "@so360/* packages from so360-shell-fe@$SHELL_BRANCH"
            if [ -d _shell-fe ]; then
              (cd _shell-fe && git sparse-checkout set packages)
              for p in shell-context design-system event-bus formatters; do
                if [ -d "_shell-fe/packages/$p" ]; then
                  if ! ( cd "_shell-fe/packages/$p" \
                         && npm install --legacy-peer-deps --include=dev --no-audit --no-fund --prefer-offline >/dev/null 2>&1 \
                         && npm run build ); then
                    echo "::warning::could not rebuild @so360/$p — restoring its committed dist"
                    ( cd _shell-fe && git checkout -- "packages/$p/dist" ) 2>/dev/null || true
                  fi
                fi
              done
            else
              rm -rf _shell-fe
              echo "::warning title=No PAT_TOKEN::could not clone so360-shell-fe — using .ci-stubs for @so360/*"
            fi
          fi
          # node_modules reuse: a tree keyed on sha256(package-lock + package.json +
          # node/npm major + install flags + omit/include env) is stored per caller repo
          # in a host-local store shared by every runner slot. Writes go to a temp file
          # + atomic mv, so a reader only ever sees a complete archive; a restore is
          # extracted to a staging dir, moved in only when tar exits 0, and must pass the
          # same binary check as a fresh install — otherwise it is discarded and npm ci
          # runs exactly as before. Repos with root install lifecycle scripts never use it.
          nb_nm_dir="${NB_NM_CACHE_DIR:-$HOME/.cache/neonbee-nm-cache}/${GITHUB_REPOSITORY//\//__}"
          nb_nm_bins_ok() {
            local b
            [ -f node_modules/.package-lock.json ] || return 1
            for b in $(node -e "const s=require('./package.json').scripts||{};const o=new Set();for(const k of ['test','build']){const m=String(s[k]||'').match(/\b(vitest|jest|vite|next|nest|tsc)\b/);if(m)o.add(m[1])}console.log([...o].join(' '))" 2>/dev/null); do
              [ -x "node_modules/.bin/$b" ] || return 1
              "node_modules/.bin/$b" --version >/dev/null 2>&1 || return 1
            done
            return 0
          }
          nb_nm_key() {
            [ -f package-lock.json ] || return 1
            node -e "const s=require('./package.json').scripts||{};process.exit(['preinstall','install','postinstall','prepare'].some(k=>s[k])?1:0)" 2>/dev/null || return 1
            NB_NM_FLAGS="$1" NB_NM_NPM="$(npm -v 2>/dev/null | cut -d. -f1)" node -e "const c=require('crypto'),fs=require('fs');const h=c.createHash('sha256');for(const f of ['package-lock.json','package.json','.npmrc'])if(fs.existsSync(f))h.update(f+'\0').update(fs.readFileSync(f));const env=Object.keys(process.env).filter(k=>/^(npm_config_(omit|include|production|only|legacy_peer_deps|ignore_scripts)|NODE_ENV)$/i.test(k)).sort().map(k=>k.toLowerCase()+'='+process.env[k]);h.update(['nm-v1',process.env.NB_NM_FLAGS,process.env.NB_NM_NPM,process.versions.node.split('.')[0],process.platform,process.arch,process.cwd().slice((process.env.GITHUB_WORKSPACE||'').length),...env].join('|'));console.log(h.digest('hex').slice(0,40))"
          }
          nb_nm_restore() {
            local f stage=".nb-nm-restore.$$"
            for f in "$nb_nm_dir/$1.tar.zst" "$nb_nm_dir/$1.tar.gz"; do
              [ -f "$f" ] || continue
              case "$f" in *.zst) command -v zstd >/dev/null 2>&1 || continue ;; esac
              rm -rf "$stage" node_modules && mkdir -p "$stage" || return 1
              if ( set -o pipefail; case "$f" in *.zst) zstd -dcq "$f" ;; *) gzip -dc "$f" ;; esac | tar -xf - -C "$stage" ) && [ -d "$stage/node_modules" ]; then
                mv "$stage/node_modules" node_modules && rm -rf "$stage"
                if nb_nm_bins_ok; then
                  touch "$f" 2>/dev/null || true
                  echo "node_modules restored from runner cache (${f##*/})"
                  return 0
                fi
                echo "::warning::cached node_modules failed the binary check — discarding it and running npm ci"
              else
                echo "::warning::cached node_modules archive unreadable — discarding it and running npm ci"
              fi
              rm -f "$f"; rm -rf "$stage" node_modules
            done
            return 1
          }
          nb_nm_save() {
            local ext tmp used root total old
            nb_nm_bins_ok || { echo "node_modules cache: fresh tree failed the binary check — not saving"; return 0; }
            used=$(df -P "$HOME" 2>/dev/null | awk 'NR==2{gsub("%","",$5);print $5}')
            [ "${used:-100}" -lt "${NB_NM_MAX_DISK_PCT:-85}" ] || { echo "::notice::node_modules cache: disk ${used:-?}% used — not saving"; return 0; }
            mkdir -p "$nb_nm_dir" || return 0
            if command -v zstd >/dev/null 2>&1; then ext=zst; else ext=gz; fi
            tmp="$nb_nm_dir/.$1.$$.$RANDOM.tmp"
            if ( set -o pipefail; tar -cf - node_modules | if [ "$ext" = zst ]; then zstd -q -3 -T4 -c; else gzip -1 -c; fi > "$tmp" ); then
              mv -f "$tmp" "$nb_nm_dir/$1.tar.$ext" && echo "node_modules saved to runner cache ($1.tar.$ext)"
            else
              rm -f "$tmp"; echo "::warning::node_modules cache save failed — ignored"
            fi
            # Bound the store: stale temps, >7 days, last 3 keys per repo, 10 GB total.
            find "$nb_nm_dir" -maxdepth 1 -name '.*.tmp' -mmin +120 -delete 2>/dev/null || true
            find "$nb_nm_dir" -maxdepth 1 -name '*.tar.*' -mtime +7 -delete 2>/dev/null || true
            ls -1t "$nb_nm_dir"/*.tar.* 2>/dev/null | tail -n +4 | while IFS= read -r old; do rm -f "$old"; done
            root="${nb_nm_dir%/*}"
            total=$(du -sk "$root" 2>/dev/null | cut -f1)
            while [ "${total:-0}" -gt 10485760 ]; do
              old=$(ls -1tr "$root"/*/*.tar.* 2>/dev/null | head -1)
              [ -n "$old" ] || break
              rm -f "$old"; total=$(du -sk "$root" 2>/dev/null | cut -f1)
            done
            return 0
          }
          nb_nm_install() {
            local key
            key=$(nb_nm_key "$1") || key=""
            if [ -n "$key" ] && nb_nm_restore "$key"; then return 0; fi
            npm_ci_retry || return 1
            if [ -n "$key" ]; then nb_nm_save "$key"; fi
            return 0
          }
          npm_ci_retry() {
            local attempt rc
            for attempt in 1 2 3; do
              rm -rf node_modules
              npm ci --legacy-peer-deps --include=dev --prefer-offline --no-audit --no-fund && return 0
              rc=$?
              if [ $attempt -lt 3 ]; then
                echo "::warning::npm ci failed (exit $rc) on attempt $attempt — retrying after cache clean"
                npm cache clean --force >/dev/null 2>&1 || true
                sleep $((attempt * 15))
              fi
            done
            echo "::error::npm ci failed on every attempt"
            return 1
          }
          nb_nm_install "--legacy-peer-deps --include=dev"
          if [ "$KIND" = fe ] || [ "$KIND" = shell ] || [ "$KIND" = site ]; then
            if [ -d _shell-fe ] && [ "${{ inputs.is_shell }}" != "true" ]; then
              mkdir -p node_modules/@so360
              for p in shell-context design-system event-bus formatters cross-link theme; do
                if [ -d "_shell-fe/packages/$p" ]; then
                  rm -rf "node_modules/@so360/$p"
                  cp -r "_shell-fe/packages/$p" "node_modules/@so360/$p"
                fi
              done
            elif [ "${{ inputs.is_shell }}" = "true" ]; then
              for p in shell-context design-system event-bus formatters; do
                if ! (cd "packages/$p" && npm run build); then
                  echo "::warning::could not build @so360/$p — restoring its committed dist"
                  git checkout -- "packages/$p/dist" 2>/dev/null || true
                fi
              done
            elif [ -d .ci-stubs/@so360 ]; then
              mkdir -p node_modules/@so360
              rm -rf node_modules/@so360/* && cp -r .ci-stubs/@so360/* node_modules/@so360/
            fi
          fi

      - name: Build
        run: |
          set -euo pipefail
          if [ "$KIND" = be ]; then
            npm run build
            exit 0
          fi
          if [ "$KIND" = next ]; then
            # Same .env.local as the dev build: NEXT_PUBLIC_* are inlined at
            # build time. The preview host strips any service key from it.
            EXTRA_ENV='${{ inputs.extra_env }}'
            : > .env.local
            [ -n "$EXTRA_ENV" ] && printf '%s\n' "$EXTRA_ENV" > .env.local
            {
              echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}"
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_DEV || secrets.SUPABASE_ANON_KEY }}"
            } >> .env.local
            sed -i.bak '/=$/d; /^$/d' .env.local && rm -f .env.local.bak
            npm run build
            exit 0
          fi
          # Identical to the dev build: dev hostnames are baked in and the
          # preview host rewrites them to pr-<slug> at serve time.
          printf '%s\n' \
            "VITE_BASE_URL=${{ inputs.vite_base_url }}" \
            "VITE_SO360_CORE_API=${{ inputs.vite_core_api }}" \
            "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}" \
            "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_DEV || secrets.SUPABASE_ANON_KEY }}" \
            "VITE_ENVIRONMENT=cloud" \
            > .env
          EXTRA_VITE='${{ inputs.vite_env }}'
          [ -n "$EXTRA_VITE" ] && printf '%s\n' "$EXTRA_VITE" >> .env
          sed -i.bak '/^$/d' .env && rm -f .env.bak
          if [ -f .env.production ]; then sed -i.bak '/neonbee\.app/d' .env.production && rm -f .env.production.bak; fi
          cp .env .env.production.local
          # Some MFEs @import the shell theme by relative path
          # (../../../so360-shell-fe/packages/theme). Link the sibling for this
          # step only, exactly as neonbee-deploy-vite-mfe.yml does.
          RUNNER_PARENT="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          STALE_PKG="$RUNNER_PARENT/so360-shell-fe"
          [ -L "$STALE_PKG" ] && rm -f "$STALE_PKG"
          if [ -d _shell-fe ] && [ "${{ inputs.is_shell }}" != "true" ]; then
            case "$GITHUB_WORKSPACE/" in
              "$STALE_PKG"/*) echo "Not relinking: $STALE_PKG contains the live checkout" ;;
              *) rm -rf "$STALE_PKG"
                 ln -s "$GITHUB_WORKSPACE/_shell-fe" "$STALE_PKG"
                 trap 'rm -f "'"$STALE_PKG"'"' EXIT ;;
            esac
          fi
          npm run build
          if [ "$KIND" = fe ] && [ "${{ inputs.is_mfe }}" = "true" ] && [ ! -f dist/assets/remoteEntry.js ]; then
            echo "::error::dist/assets/remoteEntry.js missing — not an MFE build"
            exit 1
          fi

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/preview-out"
          rm -rf "$OUT" && mkdir -p "$OUT/app"
          if [ "$KIND" = be ]; then
            cp -r dist "$OUT/app/dist"
            cp package.json package-lock.json "$OUT/app/"
            LOCKHASH=$( { cat package-lock.json; node -p 'process.versions.node.split(".")[0]'; } | sha256sum | cut -c1-16)
            echo "lockhash=$LOCKHASH" >> "$GITHUB_OUTPUT"
            {
              echo "NODE_ENV=development"
              echo "RELEASE_SHA=${{ github.sha }}"
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PREVIEW || secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}"
              echo "SUPABASE_KEY=${{ secrets.SUPABASE_ANON_KEY_PREVIEW || secrets.SUPABASE_ANON_KEY_DEV || secrets.SUPABASE_ANON_KEY }}"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_PREVIEW || secrets.SUPABASE_ANON_KEY_DEV || secrets.SUPABASE_ANON_KEY }}"
              echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY_PREVIEW || secrets.SUPABASE_SERVICE_KEY_DEV || secrets.SUPABASE_SERVICE_KEY }}"
              echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_KEY_PREVIEW || secrets.SUPABASE_SERVICE_KEY_DEV || secrets.SUPABASE_SERVICE_KEY }}"
              # Must match dev core, which issues the tokens the preview receives.
              echo "JWT_SECRET=${{ secrets.JWT_SECRET_DEV || secrets.JWT_SECRET }}"
              echo "CORS_ORIGINS=https://pr-$SLUG.$PREVIEW_DOMAIN"
              # Same service keys as the dev deploy so backends boot and can call
              # each other. Unset secrets become empty lines, stripped below.
              echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}"
              echo "VENDOR_BANK_ENC_KEY=${{ secrets.VENDOR_BANK_ENC_KEY }}"
              echo "PAYROLL_ENCRYPTION_KEY=${{ secrets.PAYROLL_ENCRYPTION_KEY }}"
              echo "STOREFRONT_JWT_SECRET=${{ secrets.STOREFRONT_JWT_SECRET }}"
              echo "INTERNAL_SERVICE_KEY=${{ secrets.INTERNAL_SERVICE_KEY }}"
              echo "NOTIFICATION_INTERNAL_KEY=${{ secrets.NOTIFICATION_INTERNAL_KEY }}"
              echo "EMAIL_INTERNAL_KEY=${{ secrets.EMAIL_INTERNAL_KEY }}"
              echo "INBOX_SERVICE_KEY=${{ secrets.INBOX_SERVICE_KEY }}"
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
              echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
              echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
              echo "STOREFRONT_INTERNAL_OPS_KEY=${{ secrets.STOREFRONT_INTERNAL_OPS_KEY }}"
              echo "MOBILITY_INTERNAL_KEY=${{ secrets.MOBILITY_INTERNAL_KEY }}"
              echo "CHAT_INTERNAL_KEY=${{ secrets.CHAT_INTERNAL_KEY }}"
              echo "DOCS_INTERNAL_SERVICE_KEY=${{ secrets.DOCS_INTERNAL_SERVICE_KEY }}"
              echo "CRM_SYNC_INTERNAL_KEY=${{ secrets.CRM_SYNC_INTERNAL_KEY }}"
              echo "MARKETING_INTERNAL_KEY=${{ secrets.MARKETING_INTERNAL_KEY }}"
              echo "MARKETING_TRACKING_SECRET=${{ secrets.MARKETING_TRACKING_SECRET }}"
              echo "MAINTENANCE_INTERNAL_KEY=${{ secrets.MAINTENANCE_INTERNAL_KEY }}"
              echo "INVENTORY_INTERNAL_KEY=${{ secrets.INVENTORY_INTERNAL_KEY }}"
              echo "FULFILLMENT_INTERNAL_KEY=${{ secrets.FULFILLMENT_INTERNAL_KEY }}"
              echo "TICKETING_INTERNAL_KEY=${{ secrets.TICKETING_INTERNAL_KEY }}"
              echo "CHANNEL_DELEGATION_SECRET=${{ secrets.CHANNEL_DELEGATION_SECRET }}"
              echo "COMPENSATION_ENCRYPTION_KEY=${{ secrets.COMPENSATION_ENCRYPTION_KEY }}"
              echo "PLATFORM_OPS_INTERNAL_KEY=${{ secrets.PLATFORM_OPS_INTERNAL_KEY }}"
              echo "PROJECTS_INTERNAL_KEY=${{ secrets.PROJECTS_INTERNAL_KEY }}"
              echo "MANUFACTURING_INTERNAL_KEY=${{ secrets.MANUFACTURING_INTERNAL_KEY }}"
              echo "ACCOUNTING_INTERNAL_KEY=${{ secrets.ACCOUNTING_INTERNAL_KEY }}"
              echo "ACCOUNTING_INTERNAL_KEY_2=${{ secrets.ACCOUNTING_INTERNAL_KEY_2 }}"
              echo "PEOPLE_INTERNAL_KEY=${{ secrets.PEOPLE_INTERNAL_KEY }}"
              echo "PEOPLE_INTERNAL_KEY_2=${{ secrets.PEOPLE_INTERNAL_KEY_2 }}"
              echo "NEURA_INTERNAL_KEY=${{ secrets.NEURA_INTERNAL_KEY }}"
              echo "NEURA_INTERNAL_KEY_2=${{ secrets.NEURA_INTERNAL_KEY_2 }}"
              echo "SUBSCRIPTION_INTERNAL_KEY=${{ secrets.SUBSCRIPTION_INTERNAL_KEY }}"
              echo "CORE_INTERNAL_KEY=${{ secrets.CORE_INTERNAL_KEY }}"
              echo "CORE_PARTNER_INTERNAL_KEY=${{ secrets.CORE_PARTNER_INTERNAL_KEY }}"
              echo "PARTNER_RESOLVE_INTERNAL_KEY=${{ secrets.PARTNER_RESOLVE_INTERNAL_KEY }}"
              echo "CONNECT_INTERNAL_KEY=${{ secrets.CONNECT_INTERNAL_KEY }}"
              echo "CONNECT_INTERNAL_KEYS=${{ secrets.CONNECT_INTERNAL_KEYS }}"
              echo "BUNNY_STORAGE_HOSTNAME=${{ secrets.BUNNY_STORAGE_HOSTNAME }}"
              echo "BUNNY_STORAGE_ZONE=${{ secrets.BUNNY_STORAGE_ZONE }}"
              echo "BUNNY_ACCESS_KEY=${{ secrets.BUNNY_ACCESS_KEY }}"
              echo "BUNNY_PULL_ZONE_URL=${{ secrets.BUNNY_PULL_ZONE_URL }}"
              echo "BUNNY_PREFIX=${{ secrets.BUNNY_PREFIX }}"
              echo "CF_R2_ACCOUNT_ID=${{ secrets.CF_R2_ACCOUNT_ID }}"
              echo "CF_R2_ACCESS_KEY_ID=${{ secrets.CF_R2_ACCESS_KEY_ID }}"
              echo "CF_R2_SECRET_ACCESS_KEY=${{ secrets.CF_R2_SECRET_ACCESS_KEY }}"
              echo "CF_R2_BUCKET=${{ secrets.CF_R2_BUCKET }}"
              echo "CF_R2_PUBLIC_URL=${{ secrets.CF_R2_PUBLIC_URL }}"
              echo "CF_R2_PREFIX=${{ secrets.CF_R2_PREFIX }}"
              # Outbound-mail (SES) keys go to the Connect preview only, and only
              # when the caller passes them (user-approved 2026-10-29). Every
              # other preview gets no mail, push or Slack keys: it shares the
              # production database, so its outbound mail fails closed.
              if [ "${{ inputs.name }}" = connect ]; then
                [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"
                [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
                [ -z "${{ secrets.AWS_REGION }}" ] || echo "AWS_REGION=${{ secrets.AWS_REGION }}"
              fi
            } > "$OUT/app/.env"
            EXTRA='${{ inputs.extra_env }}'
            [ -n "$EXTRA" ] && printf '%s\n' "$EXTRA" >> "$OUT/app/.env"
            # The dev block calls sibling services on the Dev VM's loopback
            # ports; the preview host has no listeners there for backends, so
            # point them at develop's services on dev-api (same map as
            # preview-ctl's DEV_SERVICES).
            for svc in core:6000 crm:6003 inventory:6006 accounting:6008 projects:6010 \
                       timesheet:6012 people:6015 inbox:6017 neura:6018 storefront:6020 flow:6021 \
                       insight:6023 subscription:6026 forms:6027 dailystore:6029 fulfillment:6032 \
                       support:6033 manufacturing:6034 chat:6036 documents:6037 sign:6038 \
                       mobility:6040 folio:6044 connect:6048 signal:6049 marketing:6056 maintenance:6058 \
                       platform-help:6052 contentforge:6053 lumen:6054; do
              sed -i.bak -E "s#https?://(127\.0\.0\.1|localhost):${svc##*:}([^0-9]|\$)#https://dev-api.skyoffice360.com/${svc%%:*}\2#g" "$OUT/app/.env" && rm -f "$OUT/app/.env.bak"
            done
            sed -i.bak '/=$/d' "$OUT/app/.env" && rm -f "$OUT/app/.env.bak"
          elif [ "$KIND" = next ]; then
            cp -r .next "$OUT/app/.next"
            rm -rf "$OUT/app/.next/cache"
            [ -d public ] && cp -r public "$OUT/app/public"
            cp .env.local package.json package-lock.json "$OUT/app/"
            for f in next.config.js next.config.mjs next.config.ts; do
              if [ -f "$f" ]; then cp "$f" "$OUT/app/"; fi
            done
            # A standalone build carries its own node_modules; otherwise the
            # host links shared prod deps by lockfile, as for backends.
            if [ ! -f .next/standalone/server.js ]; then
              LOCKHASH=$( { cat package-lock.json; node -p 'process.versions.node.split(".")[0]'; } | sha256sum | cut -c1-16)
              echo "lockhash=$LOCKHASH" >> "$GITHUB_OUTPUT"
            fi
          else
            cp -r dist/. "$OUT/app/"
            # @originjs/vite-plugin-federation loads a remote's stylesheet from
            # <vite base>/<file>.css — WITHOUT the assets/ segment (the remoteEntry
            # carries `new base + css file`, never assetsDir). Dev serves the CSS at
            # that root path too; a preview serves /cdn/<name>/ straight from this
            # tree, where the build keeps the CSS under assets/, so every MFE
            # rendered on a preview without its stylesheet (404 on
            # /cdn/<name>/style-*.css). Keep a copy at the root as well.
            if [ "$KIND" = fe ] && [ "${{ inputs.is_mfe }}" = "true" ]; then
              find dist/assets -maxdepth 1 -type f -name '*.css' -exec cp {} "$OUT/app/" \;
            fi
          fi
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        env:
          # Load BOTH keys. `PREVIEW_SSH_KEY || CONTABO_SSH_KEY` picked only the
          # first non-empty one, so a repo-level PREVIEW_SSH_KEY minted for the
          # old runner-hosted previews (so360-command) shadowed CONTABO_SSH_KEY
          # once PREVIEW_HOST moved to the Dev VM, which does not authorize that
          # key: every ssh exited 255 "Permission denied (publickey)". The
          # agent offers each identity in turn, so whichever key the host
          # authorizes wins.
          KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          FALLBACK_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          HOST: ${{ secrets.PREVIEW_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          for k in "$KEY" "$FALLBACK_KEY"; do
            if [ -n "$k" ]; then
              printf '%s\n' "$k" | ssh-add - || echo "::warning::an SSH key secret could not be loaded into ssh-agent"
            fi
          done
          ssh-add -l >/dev/null || { echo "::error::no usable SSH key (PREVIEW_SSH_KEY / CONTABO_SSH_KEY) reaches this repo"; exit 1; }
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Fail here, with the cause named, instead of as a bare exit 255 in
          # whichever later step first touches the host.
          ssh -o BatchMode=yes -o ConnectTimeout=20 "root@$HOST" true || {
            echo "::error title=Preview host SSH::root@PREVIEW_HOST rejected every loaded key or is unreachable (exit $?) - authorize the CI key on the preview host or fix PREVIEW_HOST"
            exit 1
          }

      - name: Sync preview host config from secrets
        env:
          HOST: ${{ secrets.PREVIEW_HOST }}
          DEVO: ${{ secrets.PREVIEW_DEV_ORIGIN }}
          SBURL: ${{ secrets.SUPABASE_URL }}
          CFT: ${{ secrets.CF_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          # ── host config from secrets (keep identical in all preview workflows) ──
          # PROD_SUPABASE_HOST is written empty: backend previews may use the
          # prod DB until a preview database exists (user decision 2026-09-30).
          if ! printf '%s\n' "$DEVO" | grep -qxE '[A-Za-z0-9.-]+'; then
            echo "::warning title=Preview host config::PREVIEW_DEV_ORIGIN secret missing/invalid - host keeps its current config"
          else
            printf 'DEV_ORIGIN=%s\nPROD_SUPABASE_HOST=\n' "$DEVO" | ssh "root@$HOST" 'install -d -m 700 /etc/so360-preview && umask 077 && cat > /etc/so360-preview/ci.env.tmp && mv /etc/so360-preview/ci.env.tmp /etc/so360-preview/ci.env'
          fi
          if [ -n "${CFT:-}" ]; then
            printf 'CF_API_TOKEN=%s\n' "$CFT" | ssh "root@$HOST" 'install -d -m 700 /etc/so360-preview && umask 077 && cat > /etc/so360-preview/cf.env.tmp && mv /etc/so360-preview/cf.env.tmp /etc/so360-preview/cf.env'
          fi
          # ── end host config ──

      # Access first, DNS second (preview-ctl cf-ensure): the hostname never
      # resolves ungated. The Cloudflare token stays on the preview host.
      - name: Ensure Cloudflare Access app + DNS
        env:
          HOST: ${{ secrets.PREVIEW_HOST }}
        run: |
          set -euo pipefail
          IP=$( { getent ahostsv4 "$HOST" 2>/dev/null || true; } | awk 'NR==1{print $1}')
          [ -n "$IP" ] || IP=$HOST
          FQDNS="--fqdn 'pr-$SLUG.$PREVIEW_DOMAIN'"
          [ -n "$APP_HOST" ] && FQDNS="$FQDNS --fqdn '$APP_HOST'"
          ssh "root@$HOST" "preview-ctl cf-ensure --slug '$SLUG' --ip '$IP' $FQDNS"

      - name: Upload + activate
        env:
          HOST: ${{ secrets.PREVIEW_HOST }}
          OUT: ${{ steps.pkg.outputs.out }}
          LOCKHASH: ${{ steps.pkg.outputs.lockhash }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          INC="/srv/previews/_incoming"
          ssh "root@$HOST" "rm -rf '$INC/$SLUG/$REPO' && mkdir -p '$INC/$SLUG/$REPO'"
          rsync -az --delete "$OUT/app/" "root@$HOST:$INC/$SLUG/$REPO/"

          EXTRA_ARGS=""
          HEALTH='${{ inputs.health_path }}'
          [ -n "$HEALTH" ] && EXTRA_ARGS="--health '$HEALTH'"
          [ "$KIND" = fe ] && [ "${{ inputs.is_mfe }}" != "true" ] && EXTRA_ARGS="$EXTRA_ARGS --spa"
          [ -n "$APP_HOST" ] && EXTRA_ARGS="$EXTRA_ARGS --host '$APP_HOST'"
          DEV_HOST='${{ inputs.dev_host }}'
          [ -n "$DEV_HOST" ] && EXTRA_ARGS="$EXTRA_ARGS --dev-host '$DEV_HOST'"
          if [ -n "$LOCKHASH" ] && { [ "$KIND" = be ] || [ "$KIND" = next ]; }; then
            EXTRA_ARGS="$EXTRA_ARGS --lockhash $LOCKHASH"
            # Shared prod deps, uploaded once per lockfile.
            if ! ssh "root@$HOST" "preview-ctl deps-present --repo '$REPO' --lockhash '$LOCKHASH'"; then
              DEPS="$RUNNER_TEMP/preview-deps"
              rm -rf "$DEPS" && mkdir -p "$DEPS"
              cp package.json package-lock.json "$DEPS/"
              (cd "$DEPS" && npm ci --omit=dev --legacy-peer-deps --prefer-offline --no-audit --no-fund)
              ssh "root@$HOST" "mkdir -p '$INC/_deps/$REPO/$LOCKHASH'"
              rsync -az --delete "$DEPS/node_modules" "root@$HOST:$INC/_deps/$REPO/$LOCKHASH/"
            fi
          fi

          ssh "root@$HOST" "preview-ctl deploy --slug '$SLUG' --branch '$BRANCH' --repo '$REPO' \
            --kind '$KIND' --name '$NAME' --sha '${{ github.sha }}' $EXTRA_ARGS" | tee "$RUNNER_TEMP/preview-ctl.log"

          URL="https://pr-$SLUG.$PREVIEW_DOMAIN"
          [ -n "$APP_HOST" ] && URL="https://$APP_HOST"
          {
            echo "### 🔍 Preview deployed"
            echo ""
            echo "**$URL** — \`$REPO\` @ \`${GITHUB_SHA:0:8}\` ($KIND \`$NAME\`)"
            [ -n "$APP_HOST" ] && echo "" && echo "Shell/modules preview: https://pr-$SLUG.$PREVIEW_DOMAIN"
            echo ""
            echo "Everything this branch does not change is served from develop."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          APP_HOST: ${{ needs.check.outputs.host }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          H=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          PR=$(curl -fsS "${H[@]}" "$API/pulls?state=open&head=${{ github.repository_owner }}:$BRANCH" | jq -r '.[0].number // empty')
          [ -n "$PR" ] || { echo "No open PR for $BRANCH yet"; exit 0; }
          # One comment per host: an app host keeps its own comment.
          MARK="<!-- so360-preview${APP_HOST:+ $APP_HOST} -->"
          URL="https://pr-$SLUG.$PREVIEW_DOMAIN"
          [ -n "$APP_HOST" ] && URL="https://$APP_HOST"
          BODY="$MARK
          🔍 **Preview:** $URL
          Latest: \`${GITHUB_SHA:0:8}\` ($KIND \`$NAME\`). Unchanged modules come from develop. Behind Cloudflare Access."
          BODY=$(printf '%s' "$BODY" | sed 's/^ *//')
          CID=$(curl -fsS "${H[@]}" "$API/issues/$PR/comments?per_page=100" | jq -r --arg m "$MARK" '[.[] | select(.body | startswith($m))][0].id // empty')
          if [ -n "$CID" ]; then
            curl -fsS -X PATCH "${H[@]}" "$API/issues/comments/$CID" -d "$(jq -n --arg b "$BODY" '{body: $b}')" >/dev/null
          else
            curl -fsS -X POST "${H[@]}" "$API/issues/$PR/comments" -d "$(jq -n --arg b "$BODY" '{body: $b}')" >/dev/null
          fi
