# =============================================================================
# Neonbee — Unified Production Deploy (single reusable workflow for ALL repos)
# =============================================================================
# Place in: neonbee-devops/.github/workflows/neonbee-deploy-prod.yml
#
# deploy_type controls what happens after the common gate + build:
#   backend  → rsync dist/ → PM2 (NestJS)
#   vite-mfe → rsync dist/ → nginx reload → CF purge
#   nextjs   → rsync .next/ → PM2 (Next.js)
# =============================================================================

name: Deploy to Production (reusable)

on:
  workflow_call:
    inputs:
      # ── Required ───────────────────────────────────────────────────────────
      service_name:
        description: 'Unique deploy name e.g. crm-prod, crm-fe, command-prod'
        required: true
        type: string
      deploy_type:
        description: 'backend | vite-mfe | nextjs'
        required: true
        type: string

      # ── Backend + Next.js ──────────────────────────────────────────────────
      service_dir:
        description: 'Absolute path on VM e.g. /github/neonbee/so360-crm-be'
        required: false
        type: string
        default: ''
      port:
        description: 'PM2 port e.g. 8003'
        required: false
        type: number
        default: 0
      health_path:
        required: false
        type: string
        default: '/api'
      publish_swagger:
        description: "Set 'true' to publish this backend's live swagger JSON to so360-neura-be (catalog auto-regen); opt-in per caller, never fails the deploy"
        required: false
        type: string
        default: ''
      pm2_instances:
        required: false
        type: number
        default: 2
      pm2_max_memory:
        required: false
        type: string
        default: '500M'

      # ── Vite MFE ──────────────────────────────────────────────────────────
      nginx_root:
        description: 'Nginx doc root e.g. /var/www/cdn.neonbee.app/html/crm'
        required: false
        type: string
        default: ''
      vite_env:
        description: 'Multiline VITE_* vars for .env'
        required: false
        type: string
        default: ''
      cf_purge_urls:
        description: 'Comma-separated URLs to purge, or "all"'
        required: false
        type: string
        default: ''
      needs_shell_packages:
        description: 'Checkout shell-fe for @so360/* packages'
        required: false
        type: boolean
        default: false
      is_shell:
        description: 'Shell-fe only — builds packages internally'
        required: false
        type: boolean
        default: false

      # ── Next.js ────────────────────────────────────────────────────────────
      standalone:
        description: 'Use .next/standalone output (mobility-pwa)'
        required: false
        type: boolean
        default: false

      # ── Shared ─────────────────────────────────────────────────────────────
      target_vm:
        description: 'prod | storefront | internal'
        required: false
        type: string
        default: 'prod'
      extra_env:
        description: 'Additional env lines (non-secret)'
        required: false
        type: string
        default: ''
      node_version:
        required: false
        type: string
        default: '22'

    secrets:
      DIGITALOCEAN_SSH_KEY:          { required: false }
      STOREFRONT_PROD_SSH_KEY:       { required: false }
      PROD_SERVER_IP:                { required: false }
      STOREFRONT_PROD_IP:            { required: false }
      INTERNAL_TOOLS_VM:             { required: false }
      SUPABASE_URL:                  { required: false }
      SUPABASE_ANON_KEY:             { required: false }
      SUPABASE_SERVICE_KEY:          { required: false }
      JWT_SECRET:                    { required: false }
      STOREFRONT_JWT_SECRET:         { required: false }
      CORS_ORIGINS_PROD:             { required: false }
      ENCRYPTION_KEY:                { required: false }
      CHANNEL_ENCRYPTION_KEY:        { required: false }
      CF_R2_ACCOUNT_ID:              { required: false }
      CF_R2_ACCESS_KEY_ID:           { required: false }
      CF_R2_SECRET_ACCESS_KEY:       { required: false }
      CF_R2_BUCKET:                  { required: false }
      CF_R2_PUBLIC_URL:              { required: false }
      CF_R2_PREFIX:                  { required: false }
      BUNNY_STORAGE_HOSTNAME:        { required: false }
      BUNNY_STORAGE_ZONE:            { required: false }
      BUNNY_ACCESS_KEY:              { required: false }
      BUNNY_PULL_ZONE_URL:           { required: false }
      BUNNY_PREFIX:                  { required: false }
      EMAIL_INTERNAL_KEY:            { required: false }
      NOTIFICATION_INTERNAL_KEY:     { required: false }
      DOCS_INTERNAL_SERVICE_KEY:     { required: false }
      NEURA_INTERNAL_KEY:            { required: false }
      NEURA_INTERNAL_KEY_2:          { required: false }
      CHAT_INTERNAL_KEY:             { required: false }
      CRM_SYNC_INTERNAL_KEY:         { required: false }
      PROJECTS_INTERNAL_KEY:         { required: false }
      FORMS_INTERNAL_KEY:            { required: false }
      MANUFACTURING_INTERNAL_KEY:    { required: false }
      ACCOUNTING_INTERNAL_KEY:       { required: false }
      ACCOUNTING_INTERNAL_KEY_2:     { required: false }
      PLATFORM_OPS_INTERNAL_KEY:     { required: false }
      SUBSCRIPTION_INTERNAL_KEY:     { required: false }
      STOREFRONT_INTERNAL_OPS_KEY:   { required: false }
      CF_SAAS_API_TOKEN:             { required: false }
      CF_SAAS_ZONE_ID:               { required: false }
      CF_SAAS_FALLBACK_HOSTNAME:     { required: false }
      VAPID_PUBLIC_KEY:              { required: false }
      VAPID_PRIVATE_KEY:             { required: false }
      VITE_VAPID_PUBLIC_KEY:         { required: false }
      FIREBASE_SERVICE_ACCOUNT:      { required: false }
      VITE_FIREBASE_API_KEY:         { required: false }
      VITE_FIREBASE_AUTH_DOMAIN:     { required: false }
      VITE_FIREBASE_PROJECT_ID:      { required: false }
      VITE_FIREBASE_STORAGE_BUCKET:  { required: false }
      VITE_FIREBASE_MESSAGING_SENDER_ID: { required: false }
      VITE_FIREBASE_APP_ID:          { required: false }
      VITE_FIREBASE_VAPID_KEY:       { required: false }
      MOBILITY_INTERNAL_KEY:         { required: false }
      PAT_TOKEN:                     { required: false }
      INTERNAL_SERVICE_KEY:          { required: false }
      # People Connect is the single source of truth for people data; its
      # internal surface is key-guarded. CORE_INTERNAL_KEY is the caller-side
      # alias for the value Core validates as INTERNAL_SERVICE_KEY.
      PEOPLE_INTERNAL_KEY:           { required: false }
      CORE_INTERNAL_KEY:             { required: false }
      CONTABO_SSH_KEY:               { required: false }
      HA_VM_IP:                      { required: false }
      # Google OAuth (Neonbee Connect — Gmail/Calendar/Sheets/Drive)
      GOOGLE_CLIENT_ID:              { required: false }
      GOOGLE_CLIENT_SECRET:          { required: false }
      # Slack OAuth (Neonbee Connect — Crew Slack channel + Slack piece)
      SLACK_CLIENT_ID:               { required: false }
      SLACK_CLIENT_SECRET:           { required: false }
      SLACK_SIGNING_SECRET:          { required: false }

# Run all node20-compiled actions under the Node.js 24 engine.
# ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION was removed as of runner ≥ 2.335.0
# (enforced June 16 2026); this replaces it.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ═════════════════════════════════════════════════════════════════════════════
# GATE — identical for all 46 repos
# ═════════════════════════════════════════════════════════════════════════════
jobs:

  gate:
    runs-on: [self-hosted, contabo]
    timeout-minutes: 20
    steps:
      # ── Remove stale workspace symlink from cross-repo builds ───────────────
      # A failed/cancelled vite-mfe build can leave a dangling symlink at
      # _work/<service> (see build-deploy). Left in place, it breaks checkout
      # and hashFiles for the next gate run on this runner. Remove it first.
      - name: Remove stale workspace symlink
        shell: bash
        run: |
          WS_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          if [ -L "$WS_PARENT" ]; then
            echo "Removing stale symlink at $WS_PARENT"
            rm -f "$WS_PARENT"
          fi
          # Removing the symlink leaves nothing behind, and the runner cannot
          # start ANY process (checkout included) without its workspace on
          # disk. Recreate it so the run recovers instead of dying with
          # "No such file or directory".
          mkdir -p "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Isolate npm cache per job
        # runner.temp is step-only (not valid in job-level env), so set the
        # per-slot cache dir here — before npm ci — to keep the isolation that
        # stops shared _cacache races on Contabo hosts.
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4.3.0
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-v2-${{ runner.os }}-

      - name: Install dependencies
        # --include=dev is mandatory: some runners in the Docker fleet have
        # NODE_ENV=production in their environment, which makes `npm ci` omit
        # devDependencies (jest, @nestjs/cli, vite, …). That produced flaky
        # "command not found" failures (e.g. `nest build` exit 127). The flag
        # overrides NODE_ENV so devDeps are always installed.
        run: |
          rm -rf node_modules
          npm ci --legacy-peer-deps --include=dev
          # Same corrupted-~/.npm-cache exposure the build job already guards
          # against: npm ci can exit 0 with only `tar TAR_ENTRY_ERROR` warnings
          # and still leave an incomplete node_modules. The build job checks for
          # the nest binary; the gate never checked for the TEST runner, so a
          # missing jest surfaced as `npm test` exit 127 — reported as "Unit
          # tests failed" with no output, on three different slots in one
          # afternoon (2026-08-02). Verify and reinstall clean when absent.
          TEST_BIN=$(node -e "const s=require('./package.json').scripts?.test||''; console.log(/vitest/.test(s)?'vitest':/jest/.test(s)?'jest':'')" 2>/dev/null || echo "")
          # Checking the binary EXISTS is not enough: on 2026-08-02 runner-03
          # produced a node_modules where node_modules/.bin/jest was present but
          # its own dependency was not — `Error: Cannot find module 'jest-util'`,
          # which exits 1, so it read as a genuine test failure. Run the thing.
          runner_ok() {
            [ -z "$TEST_BIN" ] && return 0
            [ -x "node_modules/.bin/$TEST_BIN" ] || return 1
            "node_modules/.bin/$TEST_BIN" --version >/dev/null 2>&1
          }
          if ! runner_ok; then
            echo "::warning::$TEST_BIN cannot run after npm ci — purging npm cache and reinstalling clean"
            npm cache clean --force
            rm -rf node_modules
            npm ci --legacy-peer-deps --include=dev
          fi
          if ! runner_ok; then
            echo "::error::$TEST_BIN still cannot run after a clean reinstall — this runner slot cannot run the gate"
            exit 1
          fi

      - name: Inject ci-stubs for MFE repos
        run: |
          if [ -d ".ci-stubs/@so360" ]; then
            mkdir -p node_modules/@so360
            rm -rf node_modules/@so360/* && cp -r .ci-stubs/@so360/* node_modules/@so360/
            echo "Injected @so360 ci-stubs for test phase"
          fi

      - name: Run tests and security checks
        env:
          CI: 'true'
          # GHSA-qwww-vcr4-c8h2 (React Router "RSC mode" CSRF bypass): reviewed
          # 2026-07-28, doesn't apply to any Neonbee app — none use React
          # Router's RSC/data-router-in-server-mode; only the client-side
          # browser router. npm has no first-class per-advisory ignore, so
          # audit-check.js below filters this one ID out of the pass/fail
          # decision while still failing normally on anything else at/above
          # AUDIT_LEVEL. Comma-separate further IDs here if ever needed.
          AUDIT_LEVEL: 'critical'
          AUDIT_IGNORE_IDS: 'GHSA-qwww-vcr4-c8h2'
        run: |
          cat > "$RUNNER_TEMP/audit-check.js" <<'AUDIT_CHECK_JS'
          const fs = require('fs');
          const LEVEL_RANK = { info: 0, low: 1, moderate: 2, high: 3, critical: 4 };
          const level = process.env.AUDIT_LEVEL || 'critical';
          const threshold = LEVEL_RANK[level];
          const ignoreIds = new Set((process.env.AUDIT_IGNORE_IDS || '').split(',').map((s) => s.trim()).filter(Boolean));
          const reportPath = process.argv[2];
          let report;
          // process.exitCode (not process.exit()) so buffered stdout/stderr
          // always flushes before the process actually exits — process.exit()
          // can truncate not-yet-flushed writes when stdout is piped.
          try {
            report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          } catch (err) {
            console.error(`audit-check: could not parse npm audit JSON: ${err.message}`);
            console.error('::warning::npm audit endpoint unavailable or returned malformed output — skipping, not treated as failure');
            process.exitCode = 0;
            return;
          }
          const vulnerabilities = Object.values(report.vulnerabilities || {});
          const ignored = [];
          const failing = [];
          const belowThreshold = [];
          for (const vuln of vulnerabilities) {
            const advisoryIds = (vuln.via || []).filter((v) => typeof v === 'object' && v.url).map((v) => v.url.split('/').pop());
            const matchedIgnoreId = advisoryIds.find((id) => ignoreIds.has(id));
            if (matchedIgnoreId) { ignored.push(`${vuln.name} (${vuln.severity}) — ${matchedIgnoreId}`); continue; }
            const rank = LEVEL_RANK[vuln.severity] ?? 0;
            if (rank >= threshold) failing.push(`${vuln.name} (${vuln.severity})`);
            else belowThreshold.push(`${vuln.name} (${vuln.severity})`);
          }
          if (ignored.length) console.log(`audit-check: explicitly ignored (reviewed, not applicable): ${ignored.join(', ')}`);
          if (belowThreshold.length) console.log(`audit-check: below "${level}" threshold, not blocking: ${belowThreshold.join(', ')}`);
          if (failing.length) {
            console.error(`audit-check: FAILING — at/above "${level}" and not on the ignore list: ${failing.join(', ')}`);
            process.exitCode = 1;
          } else {
            console.log(`audit-check: no unignored vulnerabilities at/above "${level}" — passing.`);
            process.exitCode = 0;
          }
          AUDIT_CHECK_JS

          AUDIT_LOG=$(mktemp)
          AUDIT_CHECK_OUT=$(mktemp)
          # `npm audit` exits non-zero on ANY vulnerability (no --audit-level
          # here — severity filtering happens in audit-check.js). This
          # subshell inherits `set -e` from the parent script, so without
          # `|| true`, npm audit's own non-zero exit would kill the subshell
          # before `node audit-check.js` ever ran — silently discarding the
          # whole ignore-list mechanism and just propagating npm's raw exit
          # code instead. Confirmed via direct repro: this was the actual
          # root cause of the deploy staying blocked after every other fix.
          (npm audit --omit=dev --json > "$AUDIT_LOG" 2>/tmp/audit.stderr || true; node "$RUNNER_TEMP/audit-check.js" "$AUDIT_LOG" > "$AUDIT_CHECK_OUT" 2>&1) &
          AUDIT_PID=$!

          (npx --yes license-checker --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0" --excludePrivatePackages) &
          LICENSE_PID=$!

          (GITLEAKS_VERSION="8.30.1"
          # gitleaks loads the full history into memory. With several repos
          # gating at once on a 3-slot Mac Mini it gets OOM-killed (SIGKILL,
          # exit 137) — three repos hit this simultaneously on 2026-08-20 after
          # the new tiers took each backend deploy from 3 jobs to 5.
          #
          # A killed scan has found nothing, so it must never read as a pass.
          # Retry with a backoff, and fail loudly if it is still being killed.
          run_gitleaks() {
            local bin="$1" attempt=1 rc=0
            while [ $attempt -le 3 ]; do
              rc=0
              "$bin" detect --source . --verbose || rc=$?
              [ $rc -eq 0 ] && return 0
              if [ $rc -eq 137 ] || [ $rc -eq 139 ]; then
                echo "::warning::gitleaks killed (exit $rc) on attempt $attempt — runner memory pressure, retrying"
                sleep $((attempt * 20))
                attempt=$((attempt + 1))
                continue
              fi
              return $rc   # a real finding, or a real error
            done
            echo "::error::gitleaks was killed on every attempt — the secrets scan did NOT run. Not treating an unrun scan as a pass."
            return 1
          }
          if command -v gitleaks &>/dev/null; then
            run_gitleaks gitleaks
          else
            _GL_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            _GL_ARCH=$(uname -m)
            case "$_GL_ARCH" in x86_64) _GL_ARCH="x64" ;; arm64|aarch64) _GL_ARCH="arm64" ;; esac
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${_GL_OS}_${_GL_ARCH}.tar.gz" | tar -xz -C /tmp/
            run_gitleaks /tmp/gitleaks
          fi) &
          GITLEAKS_PID=$!

          RC=0
          TEST_SCRIPT=$(node -e "console.log(require('./package.json').scripts?.test || '')" 2>/dev/null)
          if echo "$TEST_SCRIPT" | grep -q "vitest"; then
            EXTRA_FLAGS="--passWithNoTests"
          else
            EXTRA_FLAGS="--passWithNoTests --forceExit --ci"
          fi

          # ── Spec floor ────────────────────────────────────────────────────
          # `--passWithNoTests` above means an empty or mis-globbed suite exits
          # 0. Combined with the stderr capture below — which hides the runner
          # summary on success — a green gate could not be distinguished from a
          # gate that ran zero tests. Establish the floor BEFORE running, so
          # "0 spec files" is an explicit failure with a name attached.
          SPEC_COUNT=$( { git ls-files '*.spec.ts' '*.spec.tsx' '*.spec.js' '*.test.ts' '*.test.tsx' '*.test.js' 2>/dev/null || true; } | wc -l | tr -d ' ')
          if [ "$SPEC_COUNT" -eq 0 ]; then
            # Fall back to a filesystem sweep before declaring a repo untested —
            # a repo using an unusual layout must not be hard-failed by a glob
            # that simply did not match. Only a genuine zero fails the gate.
            SPEC_COUNT=$(find . -path ./node_modules -prune -o \( -name '*.spec.*' -o -name '*.test.*' -o -path '*__tests__*' \) -type f -print 2>/dev/null | wc -l | tr -d ' ')
          fi
          echo "Tracked spec files: $SPEC_COUNT"
          if [ "$SPEC_COUNT" -eq 0 ]; then
            echo "::error::No tracked spec files found — the unit tier is not enforced for this repo. Add tests or remove this repo from the prod gate deliberately."
            RC=1
          fi

          # stderr is captured, not discarded. jest writes its reporter there,
          # so dumping it always is noise — but `2>/dev/null` also swallowed
          # `sh: jest: not found`, which is why an incomplete node_modules
          # looked like a silent test failure.
          TEST_ERR=$(mktemp)

          # `timeout` is coreutils — present on the Contabo Linux slots, ABSENT
          # on the Mac Mini slots that now carry the `contabo` label. The bare
          # `command -v timeout` check silently dropped all hang protection
          # there. Resolve gtimeout (coreutils via brew) and fall back to perl,
          # which is on every macOS box, so the timeout applies on every runner.
          TIMEOUT_BIN=""
          if command -v timeout &>/dev/null; then TIMEOUT_BIN="timeout"
          elif command -v gtimeout &>/dev/null; then TIMEOUT_BIN="gtimeout"
          fi
          run_tests_with_timeout() {
            if [ -n "$TIMEOUT_BIN" ]; then
              "$TIMEOUT_BIN" 300 npm test -- $EXTRA_FLAGS 2>"$TEST_ERR"
            elif command -v perl &>/dev/null; then
              perl -e 'alarm shift; exec @ARGV' 300 npm test -- $EXTRA_FLAGS 2>"$TEST_ERR"
            else
              echo "::warning::No timeout mechanism available on this runner — unit tests run unbounded"
              npm test -- $EXTRA_FLAGS 2>"$TEST_ERR"
            fi
          }
          TEST_RC=0
          run_tests_with_timeout || TEST_RC=$?
          # A suite that never finishes is NOT a pass. This previously reset
          # RC=0 on timeout, so a hung run shipped straight to production with
          # nothing but a warning annotation — the gate's single largest trust
          # hole. Treat the timeout as the failure it is; a genuinely slow suite
          # is a reason to raise the ceiling, not to ignore the result.
          # 124 = GNU timeout, 142 = perl SIGALRM (128+14).
          if [ $TEST_RC -eq 124 ] || [ $TEST_RC -eq 142 ]; then
            echo "::error::Unit tests exceeded the 300s ceiling — failing the gate (hung suites are not passes)"
          fi
          [ $TEST_RC -ne 0 ] && RC=$TEST_RC

          # Show the runner summary on SUCCESS too. jest/vitest write it to
          # stderr, so capturing stderr made a passing gate print no evidence at
          # all — 2,661 tests and 0 tests looked identical. Always surface the
          # tail so a green run proves what it ran.
          if [ $TEST_RC -eq 0 ]; then
            echo "── test summary ─────────────────────────────────────────────"
            grep -aE "Tests:|Test Suites:|Test Files|passed|failed" "$TEST_ERR" | tail -10 || tail -10 "$TEST_ERR" || true
            echo "─────────────────────────────────────────────────────────────"
          fi
          TEST_EXIT=$RC

          # `wait $PID; VAR=$?` as a bare `;`-sequence is NOT exempt from
          # `set -e` (only `&&`/`||` list members before the final one are) —
          # a non-zero exit from any one of these silently killed the whole
          # step, before its own exit code could even be captured or
          # reported, whenever gitleaks/license-checker/audit found
          # something. The `VAR=0; wait $PID || VAR=$?` form is set-e-safe.
          AUDIT_EXIT=0; wait $AUDIT_PID || AUDIT_EXIT=$?
          # audit-check.js's own stdout/stderr is captured to a file rather
          # than relying on it reaching the job log directly from a
          # backgrounded subshell — cat it here, in the foreground, so it's
          # guaranteed visible regardless of any background-output quirk.
          cat "$AUDIT_CHECK_OUT" 2>/dev/null || true
          LICENSE_EXIT=0; wait $LICENSE_PID || LICENSE_EXIT=$?
          GITLEAKS_EXIT=0; wait $GITLEAKS_PID || GITLEAKS_EXIT=$?

          [ $AUDIT_EXIT -ne 0 ] && echo "::error::Security audit failed"
          [ $LICENSE_EXIT -ne 0 ] && echo "::error::License check failed"
          [ $GITLEAKS_EXIT -ne 0 ] && echo "::error::Secrets scan failed"
          # 127 is "command not found", not a failing assertion — calling that
          # "Unit tests failed" sent people looking for a broken test that did
          # not exist. Name the real cause and show the captured stderr.
          if [ $TEST_EXIT -eq 127 ]; then
            echo "::error::Test runner not found (exit 127) — node_modules is incomplete on this runner, NOT a test failure"
            tail -50 "$TEST_ERR" || true
          elif [ $TEST_EXIT -ne 0 ]; then
            echo "::error::Unit tests failed"
            tail -50 "$TEST_ERR" || true
          fi

          exit $(( TEST_EXIT | AUDIT_EXIT | LICENSE_EXIT | GITLEAKS_EXIT ))

# ═════════════════════════════════════════════════════════════════════════════
# API CONTRACT + INTEGRATION — backend only, parallel, both gate the deploy
# ─────────────────────────────────────────────────────────────────────────────
# These two tiers existed only in neonbee-deploy-backend.yml (the develop path).
# Because the estate pushes `main`, which routes here, they never ran on any
# deploy that actually reached production: the specs were written, maintained,
# and never enforced. They gate the build now.
#
# A repo with no script or no specs WARNS instead of failing — introducing a new
# gate must not brick deploys for repos that have not backfilled yet. The
# warning names the repo and tier so the gap is visible rather than silent.
# ═════════════════════════════════════════════════════════════════════════════

  contract-tests:
    name: API Contract Tests
    if: inputs.deploy_type == 'backend'
    needs: [gate]
    runs-on: [self-hosted, contabo]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Isolate npm cache per job
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm ci --legacy-peer-deps --include=dev
      - name: Run contract tests
        env:
          NODE_ENV: test
        run: |
          if ! node -e "process.exit(require('./package.json').scripts?.['test:contract'] ? 0 : 1)" 2>/dev/null; then
            echo "::warning::No test:contract script — the API contract tier is NOT enforced for ${{ inputs.service_name }}. Backfill required."
            exit 0
          fi
          COUNT=$( { git ls-files '*.contract.spec.ts' 2>/dev/null || true; } | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::test:contract is defined but 0 *.contract.spec.ts files exist — the API contract tier is NOT enforced for ${{ inputs.service_name }}."
            exit 0
          fi
          echo "Running $COUNT contract spec file(s)"
          npm run test:contract

  integration-tests:
    name: Integration Tests
    if: inputs.deploy_type == 'backend'
    needs: [gate]
    runs-on: [self-hosted, contabo]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Isolate npm cache per job
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm ci --legacy-peer-deps --include=dev
      - name: Run integration tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
          SO360_AUTH_BYPASS: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_TENANT_ID: '3cf1c619-c8f6-49ac-9207-447418d5beee'
          TEST_ORG_ID: '8317fe18-6ac4-4ac4-b71d-dc13122a905d'
          TEST_USER_ID: '4a1832f4-f7bb-44bf-ad01-9431d8b14efc'
          # Boot-time required secrets. Several backends throw in
          # onModuleInit when an internal service key is absent — so360-core's
          # MediaService is one — so an integration run without them fails at
          # bootstrap rather than on any assertion. These are already declared
          # by this workflow; they just were not reaching the job.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DOCS_INTERNAL_SERVICE_KEY: ${{ secrets.DOCS_INTERNAL_SERVICE_KEY }}
          INTERNAL_SERVICE_KEY: ${{ secrets.INTERNAL_SERVICE_KEY }}
          EMAIL_INTERNAL_KEY: ${{ secrets.EMAIL_INTERNAL_KEY }}
          NOTIFICATION_INTERNAL_KEY: ${{ secrets.NOTIFICATION_INTERNAL_KEY }}
          CHAT_INTERNAL_KEY: ${{ secrets.CHAT_INTERNAL_KEY }}
          CRM_SYNC_INTERNAL_KEY: ${{ secrets.CRM_SYNC_INTERNAL_KEY }}
          PLATFORM_OPS_INTERNAL_KEY: ${{ secrets.PLATFORM_OPS_INTERNAL_KEY }}
          PROJECTS_INTERNAL_KEY: ${{ secrets.PROJECTS_INTERNAL_KEY }}
          MANUFACTURING_INTERNAL_KEY: ${{ secrets.MANUFACTURING_INTERNAL_KEY }}
          ACCOUNTING_INTERNAL_KEY: ${{ secrets.ACCOUNTING_INTERNAL_KEY }}
          SUBSCRIPTION_INTERNAL_KEY: ${{ secrets.SUBSCRIPTION_INTERNAL_KEY }}
          STOREFRONT_INTERNAL_OPS_KEY: ${{ secrets.STOREFRONT_INTERNAL_OPS_KEY }}
          MOBILITY_INTERNAL_KEY: ${{ secrets.MOBILITY_INTERNAL_KEY }}
        run: |
          if ! node -e "process.exit(require('./package.json').scripts?.['test:integration'] ? 0 : 1)" 2>/dev/null; then
            echo "::warning::No test:integration script — the integration tier is NOT enforced for ${{ inputs.service_name }}. Backfill required."
            exit 0
          fi
          COUNT=$( { git ls-files '*.integration.spec.ts' 2>/dev/null || true; } | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::test:integration is defined but 0 *.integration.spec.ts files exist — the integration tier is NOT enforced for ${{ inputs.service_name }}."
            exit 0
          fi
          echo "Running $COUNT integration spec file(s)"
          npm run test:integration

# ═════════════════════════════════════════════════════════════════════════════
# BUILD + DEPLOY — common setup, then branches by deploy_type
# ═════════════════════════════════════════════════════════════════════════════

  build-deploy:
    needs: [gate, contract-tests, integration-tests]
    # contract/integration are skipped for vite-mfe and nextjs deploys. A
    # skipped `needs` would normally skip this job too, so the result is
    # matched explicitly: proceed on success or skipped, never on failure.
    if: >-
      !cancelled()
      && needs.gate.result == 'success'
      && needs.contract-tests.result != 'failure'
      && needs.integration-tests.result != 'failure'
    runs-on: [self-hosted, contabo]
    timeout-minutes: 20
    concurrency:
      group: neonbee-prod-${{ inputs.service_name }}
      cancel-in-progress: false
    steps:

      # ── Remove stale workspace symlink from cross-repo builds ───────────────
      # The "Build (vite-mfe)" step for MFE repos creates a symlink at
      # _work/so360-shell-fe so file: deps resolve. If a prior job left that
      # symlink on this runner, actions/checkout for so360-shell-fe itself
      # fails with "already exists". Remove it before every checkout.
      - name: Remove stale workspace symlink
        shell: bash
        run: |
          WS_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          if [ -L "$WS_PARENT" ]; then
            echo "Removing stale symlink at $WS_PARENT"
            rm -f "$WS_PARENT"
          fi
          # Removing the symlink leaves nothing behind, and the runner cannot
          # start ANY process (checkout included) without its workspace on
          # disk. Recreate it so the run recovers instead of dying with
          # "No such file or directory".
          mkdir -p "$GITHUB_WORKSPACE"

      # ── Common setup ───────────────────────────────────────────────────────
      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-node@v4.4.0
        continue-on-error: true
        with:
          node-version: ${{ inputs.node_version }}

      # NVM fallback: if actions/setup-node fails on a Docker fleet container
      # that lacks a cached Node.js binary, resolve via NVM instead so the
      # build step is never blocked by a transient runner provisioning issue.
      - name: Ensure Node.js via NVM (fallback)
        if: always()
        run: |
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm use ${{ inputs.node_version }} 2>/dev/null || nvm install ${{ inputs.node_version }}
            echo "$NVM_DIR/versions/node/$(nvm version)/bin" >> $GITHUB_PATH
          fi
          node --version

      - name: Isolate npm cache per job
        # runner.temp is step-only (not valid in job-level env), so set the
        # per-slot cache dir here — before npm ci — to keep the isolation that
        # stops shared _cacache races on Contabo hosts.
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4.3.0
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-v2-${{ runner.os }}-

      - name: Record build start
        id: timing
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      # ── Build: Backend ─────────────────────────────────────────────────────
      # rm -rf dist so a failed build can never leave a STALE artifact behind for
      # the deploy/HA steps to ship. --include=dev installs @nestjs/cli even on
      # runners that default NODE_ENV=production (fixes flaky `nest build` 127).
      - name: Build (backend)
        id: build_backend
        if: inputs.deploy_type == 'backend'
        run: |
          rm -rf node_modules dist
          npm ci --legacy-peer-deps --include=dev
          # Guard against a corrupted ~/.npm cache (restored by actions/cache):
          # npm ci can finish with only `tar TAR_ENTRY_ERROR` *warnings* yet leave
          # an incomplete node_modules (missing @nestjs/cli → `nest build` exit 127,
          # flaky ~50% by runner). If the nest binary is absent, purge the npm
          # cache and reinstall from clean so the build is deterministic.
          if [ ! -x node_modules/.bin/nest ]; then
            echo "::warning::nest CLI missing after npm ci — purging npm cache and reinstalling clean"
            npm cache clean --force
            rm -rf node_modules
            npm ci --legacy-peer-deps --include=dev
          fi
          npm run build

      # ── Build: Next.js ─────────────────────────────────────────────────────
      - name: Build (nextjs)
        if: inputs.deploy_type == 'nextjs'
        run: |
          rm -rf node_modules
          # --include=dev: Docker-fleet runners may set NODE_ENV=production, which
          # makes `npm ci` omit devDeps and breaks the next build (next: not found).
          npm ci --legacy-peer-deps --include=dev
          # Guard against an incomplete node_modules/next: npm ci can finish
          # cleanly yet leave deep next/dist files missing (observed on the
          # Docker fleet: jest-worker/processChild.js, polyfills/
          # polyfill-nomodule, app-page/module.compiled — each crashes the
          # build with MODULE_NOT_FOUND, some only at trace collection after
          # minutes of building). Verify all known sentinels pre-build; on
          # failure purge the npm cache and reinstall once, then hard-fail
          # with a clear message rather than burning a doomed build.
          NEXT_SENTINELS="require.resolve('next/dist/compiled/jest-worker/processChild.js'); require.resolve('next/dist/build/webpack-config'); require.resolve('next/dist/server/route-modules/app-page/module.compiled'); require.resolve('next/dist/build/polyfills/polyfill-nomodule')"
          if ! node -e "$NEXT_SENTINELS" 2>/dev/null; then
            echo "::warning::next package incomplete after npm ci — purging npm cache and reinstalling clean"
            npm cache clean --force
            rm -rf node_modules
            npm ci --legacy-peer-deps --include=dev
            if ! node -e "$NEXT_SENTINELS"; then
              echo "::error::next package STILL incomplete after clean reinstall — runner disk/filesystem is corrupting installs on this slot. Rerun to land on another slot."
              exit 1
            fi
          fi
          if [ -d ".ci-stubs/@so360" ]; then
            mkdir -p node_modules/@so360
            rm -rf node_modules/@so360/* && cp -r .ci-stubs/@so360/* node_modules/@so360/ 2>/dev/null || true
          fi
          if [ -f ".ci-stubs/@so360/theme/src/theme.css" ]; then
            RUNNER_PARENT="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
            WORKSPACE_PARENT="$(dirname "$GITHUB_WORKSPACE")"
            mkdir -p "$RUNNER_PARENT/so360-shell-fe/packages/theme/src"
            cp .ci-stubs/@so360/theme/src/theme.css "$RUNNER_PARENT/so360-shell-fe/packages/theme/src/" 2>/dev/null || true
            mkdir -p "$WORKSPACE_PARENT/so360-shell-fe/packages/theme/src"
            cp .ci-stubs/@so360/theme/src/theme.css "$WORKSPACE_PARENT/so360-shell-fe/packages/theme/src/" 2>/dev/null || true
          fi
          EXTRA_ENV='${{ inputs.extra_env }}'
          [ -n "$EXTRA_ENV" ] && echo "$EXTRA_ENV" > .env.local
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "NEXT_PUBLIC_VAPID_KEY=${{ secrets.VAPID_PUBLIC_KEY }}"
            echo "PROD_IP=${{ secrets.PROD_SERVER_IP }}"
          } >> .env.local
          sed '/=$/d' .env.local > .env.local.tmp && mv .env.local.tmp .env.local
          npm run build

      # ── Build: Vite MFE (shell-fe) ─────────────────────────────────────────
      - name: Build (shell-fe)
        if: inputs.deploy_type == 'vite-mfe' && inputs.is_shell
        run: |
          rm -rf node_modules
          # --include=dev: Docker-fleet runners may set NODE_ENV=production, which
          # makes `npm ci` omit devDeps and breaks the vite build (vite: not found).
          npm ci --legacy-peer-deps --include=dev
          cd packages/shell-context && npm run build && cd ../..
          cd packages/design-system && npm run build && cd ../..
          cd packages/event-bus && npm run build && cd ../..
          cd packages/formatters && npm run build && cd ../..
          cat <<'VITE_EOF' > .env
          ${{ inputs.vite_env }}
          VITE_EOF
          sed 's/^[[:space:]]*//' .env > .env.tmp && mv .env.tmp .env
          {
            echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}"
            echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}"
            echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
            echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
            echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}"
            echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}"
          } >> .env
          sed '/=$/d' .env > .env.tmp && mv .env.tmp .env
          npm run build

      # ── Build: Vite MFE (standard — checkout shell-fe for packages) ────────
      # Use raw git clone (git smart-HTTP protocol) instead of actions/checkout
      # to avoid hitting the GitHub REST API rate limit (5 000 req/hr per PAT).
      # Multiple FE repos building concurrently exhaust the limit via checkout@v4's
      # preliminary REST calls; plain git clone bypasses the REST API entirely.
      - name: Checkout shell-fe packages
        if: inputs.deploy_type == 'vite-mfe' && !inputs.is_shell && inputs.needs_shell_packages
        run: |
          rm -rf _shell-fe
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/Neonbee-ai/so360-shell-fe.git" \
            _shell-fe
          cd _shell-fe && git sparse-checkout set packages

      - name: Build (vite-mfe)
        if: inputs.deploy_type == 'vite-mfe' && !inputs.is_shell
        run: |
          if [ -d "_shell-fe" ]; then
            RUNNER_PARENT="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
            rm -rf "$RUNNER_PARENT/so360-shell-fe"
            ln -s "$GITHUB_WORKSPACE/_shell-fe" "$RUNNER_PARENT/so360-shell-fe"
            (cd "$GITHUB_WORKSPACE/_shell-fe" && npm install --legacy-peer-deps 2>/dev/null || true)
          fi

          rm -rf node_modules
          # --include=dev: Docker-fleet runners may set NODE_ENV=production, which
          # makes `npm ci` omit devDeps and breaks the vite build (vite: not found).
          npm ci --legacy-peer-deps --include=dev

          if [ -d ".ci-stubs/@so360" ] && [ ! -d "_shell-fe" ]; then
            mkdir -p node_modules/@so360
            rm -rf node_modules/@so360/* && cp -r .ci-stubs/@so360/* node_modules/@so360/ 2>/dev/null || true
          fi

          if [ -d "_shell-fe" ]; then
            for pkg in shell-context design-system event-bus formatters theme; do
              # Re-ensure @so360 dir before every copy — a previous package's
              # inner `npm install` can hoist/reorganise deps and silently remove
              # the parent scoped directory, causing the next cp to fail with
              # "cannot create directory … No such file or directory".
              mkdir -p node_modules/@so360
              rm -rf "node_modules/@so360/$pkg"
              cp -r "$GITHUB_WORKSPACE/_shell-fe/packages/$pkg" "node_modules/@so360/$pkg"
              (cd "node_modules/@so360/$pkg" && npm install --legacy-peer-deps 2>/dev/null || true)
            done
          fi

          # Create so360-shell-fe theme CSS path for @import compatibility
          if [ ! -d "_shell-fe" ] && [ -f ".ci-stubs/@so360/theme/src/theme.css" ]; then
            RUNNER_PARENT="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
            WORKSPACE_PARENT="$(dirname "$GITHUB_WORKSPACE")"
            mkdir -p "$RUNNER_PARENT/so360-shell-fe/packages/theme/src"
            cp .ci-stubs/@so360/theme/src/theme.css "$RUNNER_PARENT/so360-shell-fe/packages/theme/src/" 2>/dev/null || true
            mkdir -p "$WORKSPACE_PARENT/so360-shell-fe/packages/theme/src"
            cp .ci-stubs/@so360/theme/src/theme.css "$WORKSPACE_PARENT/so360-shell-fe/packages/theme/src/" 2>/dev/null || true
          fi

          cat <<'VITE_EOF' > .env
          ${{ inputs.vite_env }}
          VITE_EOF
          sed 's/^[[:space:]]*//' .env > .env.tmp && mv .env.tmp .env
          {
            echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}"
            echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}"
            echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
            echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
            echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}"
            echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}"
          } >> .env
          sed '/=$/d' .env > .env.tmp && mv .env.tmp .env
          npm run build

      # ── Drop the cross-repo shell-fe symlink ────────────────────────────────
      # This cleanup used to live at the end of the build script above, so a
      # failed or cancelled `npm run build` exited first (set -e) and left the
      # symlink dangling at _work/so360-shell-fe — which is exactly where the
      # runner keeps so360-shell-fe's OWN workspace. The next shell-fe run on
      # that slot then found a symlink instead of its checkout directory and
      # every step died with "No such file or directory".
      # As its own always() step it runs whatever the build did.
      - name: Remove cross-repo shell-fe symlink
        if: always() && inputs.deploy_type == 'vite-mfe' && !inputs.is_shell
        shell: bash
        run: |
          RUNNER_PARENT="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          LINK="$RUNNER_PARENT/so360-shell-fe"
          # Only ever remove a symlink — never a real checkout.
          if [ -L "$LINK" ]; then
            echo "Removing cross-repo shell-fe symlink at $LINK"
            rm -f "$LINK"
          fi

      # ── SSH + VM resolution (shared) ────────────────────────────────────────
      - name: Resolve target VM
        id: vm
        run: |
          case "${{ inputs.target_vm }}" in
            storefront) echo "ip=${{ secrets.STOREFRONT_PROD_IP }}" >> $GITHUB_OUTPUT ;;
            internal)   echo "ip=${{ secrets.INTERNAL_TOOLS_VM }}" >> $GITHUB_OUTPUT ;;
            *)          echo "ip=${{ secrets.PROD_SERVER_IP }}" >> $GITHUB_OUTPUT ;;
          esac

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.DIGITALOCEAN_SSH_KEY }}
            ${{ secrets.CONTABO_SSH_KEY }}
            ${{ inputs.target_vm == 'storefront' && secrets.STOREFRONT_PROD_SSH_KEY || '' }}

      # ═══════════════════════════════════════════════════════════════════════
      # DEPLOY: Backend — primary + HA in parallel
      # ═══════════════════════════════════════════════════════════════════════
      # Both VMs are always attempted simultaneously via background processes.
      # always() bypasses GitHub's implicit success() so a transient runner
      # issue (e.g. setup-node hiccup) never silently skips the deploy.
      # The step passes if ≥1 VM received the build.
      #
      # NOTE: The remote deploy script is stored in _REMOTE_DEPLOY (env block)
      # rather than a bash heredoc because a heredoc end-marker at column 0
      # inside a YAML `run: |` block scalar terminates the block prematurely,
      # causing a YAML parse error ("workflow file issue" in 0 s).
      - name: Deploy backend
        id: deploy_backend
        if: always() && inputs.deploy_type == 'backend' && steps.build_backend.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.vm.outputs.ip }}
          HA_IP: ${{ secrets.HA_VM_IP }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}
          PORT: ${{ inputs.port }}
          TARGET_VM: ${{ inputs.target_vm }}
          # Remote deploy script — ${{ }} expressions are expanded here by
          # GitHub Actions before the runner writes them to disk, so secrets
          # and inputs are baked in as literal values in the script file.
          _REMOTE_DEPLOY: |
            #!/bin/bash
            set -e
            PM2_NAME="$1"
            # Identity guard: this script is generated for ONE service. Refuse to
            # run under any other name — a stale or foreign script (shared runner
            # /tmp collisions) once deployed core's script as neura-prod with
            # core's PORT, silently taking the service down (2026-07-16); the
            # same class of bug previously ran inventory code as crm-prod.
            EXPECTED_SERVICE="${{ inputs.service_name }}"
            case "$PM2_NAME" in
              "$EXPECTED_SERVICE"|"$EXPECTED_SERVICE-ha") : ;;
              *)
                echo "FATAL: deploy-script identity mismatch — built for '$EXPECTED_SERVICE', invoked as '$PM2_NAME'. Refusing to run."
                exit 90
                ;;
            esac
            SERVICE_DIR="${{ inputs.service_dir }}"
            PORT="${{ inputs.port }}"
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
              nvm use 22
            fi
            cd "$SERVICE_DIR"
            npm install --omit=dev --legacy-peer-deps
            {
              echo "NODE_ENV=production"
              echo "RELEASE_SHA=${{ github.sha }}"
              echo "SERVICE_PORT_BAND=8000"
              echo "PORT=$PORT"
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
              echo "SUPABASE_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
              echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}"
              echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
              echo "CORS_ORIGINS=${{ secrets.CORS_ORIGINS_PROD }}"
              echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}"
              echo "CHANNEL_ENCRYPTION_KEY=${{ secrets.CHANNEL_ENCRYPTION_KEY }}"
              echo "CF_R2_ACCOUNT_ID=${{ secrets.CF_R2_ACCOUNT_ID }}"
              echo "CF_R2_ACCESS_KEY_ID=${{ secrets.CF_R2_ACCESS_KEY_ID }}"
              echo "CF_R2_SECRET_ACCESS_KEY=${{ secrets.CF_R2_SECRET_ACCESS_KEY }}"
              echo "CF_R2_BUCKET=${{ secrets.CF_R2_BUCKET }}"
              echo "CF_R2_PUBLIC_URL=${{ secrets.CF_R2_PUBLIC_URL }}"
              echo "CF_R2_PREFIX=${{ secrets.CF_R2_PREFIX }}"
              echo "BUNNY_STORAGE_HOSTNAME=${{ secrets.BUNNY_STORAGE_HOSTNAME }}"
              echo "BUNNY_STORAGE_ZONE=${{ secrets.BUNNY_STORAGE_ZONE }}"
              echo "BUNNY_ACCESS_KEY=${{ secrets.BUNNY_ACCESS_KEY }}"
              echo "BUNNY_PULL_ZONE_URL=${{ secrets.BUNNY_PULL_ZONE_URL }}"
              echo "BUNNY_PREFIX=${{ secrets.BUNNY_PREFIX }}"
              echo "EMAIL_INTERNAL_KEY=${{ secrets.EMAIL_INTERNAL_KEY }}"
              echo "STOREFRONT_INTERNAL_OPS_KEY=${{ secrets.STOREFRONT_INTERNAL_OPS_KEY }}"
              echo "CF_SAAS_API_TOKEN=${{ secrets.CF_SAAS_API_TOKEN }}"
              echo "CF_SAAS_ZONE_ID=${{ secrets.CF_SAAS_ZONE_ID }}"
              echo "CF_SAAS_FALLBACK_HOSTNAME=${{ secrets.CF_SAAS_FALLBACK_HOSTNAME }}"
            } > .env.ci
            # Firebase service account (multi-line JSON) → base64 for safe .env transport; Core decodes FIREBASE_SERVICE_ACCOUNT_B64.
            cat > /tmp/nb_fb_sa.json <<'NB_FB_EOF'
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            NB_FB_EOF
            if grep -q service_account /tmp/nb_fb_sa.json 2>/dev/null; then
              echo "FIREBASE_SERVICE_ACCOUNT_B64=$(base64 -w0 /tmp/nb_fb_sa.json)" >> .env.ci
            fi
            rm -f /tmp/nb_fb_sa.json
            [ -n "${{ secrets.VAPID_PUBLIC_KEY }}" ]          && echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}"               >> .env.ci
            [ -n "${{ secrets.VAPID_PRIVATE_KEY }}" ]         && echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}"             >> .env.ci
            [ -n "${{ secrets.MOBILITY_INTERNAL_KEY }}" ]     && echo "MOBILITY_INTERNAL_KEY=${{ secrets.MOBILITY_INTERNAL_KEY }}"     >> .env.ci
            [ -n "${{ secrets.INTERNAL_SERVICE_KEY }}" ]      && echo "INTERNAL_SERVICE_KEY=${{ secrets.INTERNAL_SERVICE_KEY }}"       >> .env.ci
            [ -n "${{ secrets.DOCS_INTERNAL_SERVICE_KEY }}" ] && echo "DOCS_INTERNAL_SERVICE_KEY=${{ secrets.DOCS_INTERNAL_SERVICE_KEY }}" >> .env.ci
            [ -n "${{ secrets.SUBSCRIPTION_INTERNAL_KEY }}" ] && echo "SUBSCRIPTION_INTERNAL_KEY=${{ secrets.SUBSCRIPTION_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.NEURA_INTERNAL_KEY }}" ]        && echo "NEURA_INTERNAL_KEY=${{ secrets.NEURA_INTERNAL_KEY }}"           >> .env.ci
            # Second accepted key: lets a new caller be onboarded (or a key
            # rotated) without every existing caller redeploying in lockstep.
            [ -n "${{ secrets.NEURA_INTERNAL_KEY_2 }}" ]      && echo "NEURA_INTERNAL_KEY_2=${{ secrets.NEURA_INTERNAL_KEY_2 }}"       >> .env.ci
            [ -n "${{ secrets.CHAT_INTERNAL_KEY }}" ]         && echo "CHAT_INTERNAL_KEY=${{ secrets.CHAT_INTERNAL_KEY }}"             >> .env.ci
            [ -n "${{ secrets.PROJECTS_INTERNAL_KEY }}" ]     && echo "PROJECTS_INTERNAL_KEY=${{ secrets.PROJECTS_INTERNAL_KEY }}"     >> .env.ci
            [ -n "${{ secrets.FORMS_INTERNAL_KEY }}" ]        && echo "FORMS_INTERNAL_KEY=${{ secrets.FORMS_INTERNAL_KEY }}"           >> .env.ci
            [ -n "${{ secrets.MANUFACTURING_INTERNAL_KEY }}" ] && echo "MANUFACTURING_INTERNAL_KEY=${{ secrets.MANUFACTURING_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.INBOX_SERVICE_KEY }}" ]         && echo "INBOX_SERVICE_KEY=${{ secrets.INBOX_SERVICE_KEY }}"             >> .env.ci
            [ -n "${{ secrets.NOTIFICATION_INTERNAL_KEY }}" ] && echo "NOTIFICATION_INTERNAL_KEY=${{ secrets.NOTIFICATION_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.STOREFRONT_JWT_SECRET }}" ]     && echo "STOREFRONT_JWT_SECRET=${{ secrets.STOREFRONT_JWT_SECRET }}"   >> .env.ci
            [ -n "${{ secrets.GEMINI_API_KEY }}" ]            && echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"                 >> .env.ci
            [ -n "${{ secrets.OPENAI_API_KEY }}" ]            && echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"                 >> .env.ci
            [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]         && echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"           >> .env.ci
            [ -n "${{ secrets.CONNECT_ENCRYPTION_KEY }}" ]    && echo "CONNECT_ENCRYPTION_KEY=${{ secrets.CONNECT_ENCRYPTION_KEY }}" >> .env.ci
            [ -n "${{ secrets.CONNECT_INTERNAL_KEY }}" ]      && echo "CONNECT_INTERNAL_KEY=${{ secrets.CONNECT_INTERNAL_KEY }}"     >> .env.ci
            [ -n "${{ secrets.CRM_SYNC_INTERNAL_KEY }}" ]     && echo "CRM_SYNC_INTERNAL_KEY=${{ secrets.CRM_SYNC_INTERNAL_KEY }}"   >> .env.ci
            [ -n "${{ secrets.SUPPORT_INTERNAL_KEY }}" ]      && echo "SUPPORT_INTERNAL_KEY=${{ secrets.SUPPORT_INTERNAL_KEY }}"     >> .env.ci
            [ -n "${{ secrets.ACCOUNTING_INTERNAL_KEY }}" ]   && echo "ACCOUNTING_INTERNAL_KEY=${{ secrets.ACCOUNTING_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.ACCOUNTING_INTERNAL_KEY_2 }}" ] && echo "ACCOUNTING_INTERNAL_KEY_2=${{ secrets.ACCOUNTING_INTERNAL_KEY_2 }}" >> .env.ci
            [ -n "${{ secrets.INVENTORY_INTERNAL_KEY }}" ]    && echo "INVENTORY_INTERNAL_KEY=${{ secrets.INVENTORY_INTERNAL_KEY }}"   >> .env.ci
            [ -n "${{ secrets.PEOPLE_INTERNAL_KEY }}" ]       && echo "PEOPLE_INTERNAL_KEY=${{ secrets.PEOPLE_INTERNAL_KEY }}"         >> .env.ci
            [ -n "${{ secrets.CORE_INTERNAL_KEY }}" ]         && echo "CORE_INTERNAL_KEY=${{ secrets.CORE_INTERNAL_KEY }}"             >> .env.ci
            [ -n "${{ secrets.FULFILLMENT_INTERNAL_KEY }}" ]  && echo "FULFILLMENT_INTERNAL_KEY=${{ secrets.FULFILLMENT_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.PLATFORM_OPS_INTERNAL_KEY }}" ]  && echo "PLATFORM_OPS_INTERNAL_KEY=${{ secrets.PLATFORM_OPS_INTERNAL_KEY }}" >> .env.ci
            [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]          && echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"             >> .env.ci
            [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]      && echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"     >> .env.ci
            [ -n "${{ secrets.SLACK_CLIENT_ID }}" ] && echo "SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}" >> .env.ci
            [ -n "${{ secrets.SLACK_CLIENT_SECRET }}" ] && echo "SLACK_CLIENT_SECRET=${{ secrets.SLACK_CLIENT_SECRET }}" >> .env.ci
            [ -n "${{ secrets.SLACK_SIGNING_SECRET }}" ] && echo "SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}" >> .env.ci
            EXTRA_ENV='${{ inputs.extra_env }}'
            [ -n "$EXTRA_ENV" ] && printf '%s\n' "$EXTRA_ENV" >> .env.ci
            sed -i -E '/^[A-Za-z_][A-Za-z0-9_]*=$/d' .env.ci
            if [ -f .env ]; then
              CI_KEYS=$(sed 's/=.*//' .env.ci | tr '\n' '|' | sed 's/|$//')
              [ -n "$CI_KEYS" ] && grep -vE "^(${CI_KEYS})=" .env >> .env.ci 2>/dev/null || true
            fi
            mv .env.ci .env
            pm2 delete "$PM2_NAME" 2>/dev/null || true
            MAIN_JS=$(find dist -name main.js | head -1)
            pm2 start "$MAIN_JS" --name "$PM2_NAME" --instances ${{ inputs.pm2_instances }} --max-memory-restart ${{ inputs.pm2_max_memory }} --update-env
            pm2 save
            for i in $(seq 1 15); do
              curl -fsS "http://127.0.0.1:$PORT${{ inputs.health_path }}" >/dev/null 2>&1 && echo "Health check passed on port $PORT" && break
              [ "$i" -eq 15 ] && pm2 logs "$PM2_NAME" --lines 50 --nostream && exit 1
              sleep 2
            done
            echo "Deployed $PM2_NAME on port $PORT"
        run: |
          set +e
          # Per-job workspace — NEVER a fixed shared path. All runner slots on a
          # host share /tmp, so a fixed /tmp/neonbee-deploy/deploy.sh let one
          # service's script (and logs) be picked up by another service's deploy
          # (2026-07-16: core's script, PORT=8000, executed as neura-prod → 502).
          DEPLOY_TMP="${RUNNER_TEMP:-/tmp}/neonbee-deploy-${GITHUB_RUN_ID}-${SERVICE_NAME}"
          mkdir -p "$DEPLOY_TMP" || { echo "FATAL: cannot create $DEPLOY_TMP"; exit 1; }

          # Write the remote deploy script to disk (no heredoc — see comment above).
          # set +e is active: check the write explicitly, never ship a stale file.
          printf '%s\n' "$_REMOTE_DEPLOY" > "$DEPLOY_TMP/deploy.sh" || { echo "FATAL: cannot write deploy script"; exit 1; }
          chmod +x "$DEPLOY_TMP/deploy.sh"
          grep -q "EXPECTED_SERVICE=\"$SERVICE_NAME\"" "$DEPLOY_TMP/deploy.sh" || { echo "FATAL: deploy script on disk is not for $SERVICE_NAME"; exit 1; }

          # ── shared deploy function ─────────────────────────────────────────
          deploy_vm() {
            local IP="$1" PM2_NAME="$2"
            local REMOTE_SCRIPT="/tmp/neonbee-deploy-${PM2_NAME}-${GITHUB_RUN_ID}.sh"
            ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null

            ssh root@"$IP" "
              mkdir -p '$SERVICE_DIR/dist-prev' '$SERVICE_DIR/dist'
              rsync -a --delete '$SERVICE_DIR/dist/' '$SERVICE_DIR/dist-prev/' 2>/dev/null || true
            " || return 1

            ssh root@"$IP" "mkdir -p '$SERVICE_DIR'" || return 1
            rsync -avz --delete dist/ "root@$IP:$SERVICE_DIR/dist/" || return 1
            rsync -avz package.json package-lock.json "root@$IP:$SERVICE_DIR/" || return 1
            rsync "$DEPLOY_TMP/deploy.sh" "root@$IP:$REMOTE_SCRIPT" || return 1
            ssh root@"$IP" "bash '$REMOTE_SCRIPT' '$PM2_NAME'; RC=\$?; rm -f '$REMOTE_SCRIPT'; exit \$RC" || return 1
          }

          # ── fan out: both VMs start simultaneously ─────────────────────────
          deploy_vm "$SERVER_IP" "$SERVICE_NAME" > "$DEPLOY_TMP/primary.log" 2>&1 &
          PRIMARY_PID=$!

          HA_PID=""
          if [ -n "$HA_IP" ] && { [ "$TARGET_VM" = "prod" ] || [ "$TARGET_VM" = "storefront" ] || [ "$TARGET_VM" = "internal" ]; }; then
            deploy_vm "$HA_IP" "${SERVICE_NAME}-ha" > "$DEPLOY_TMP/ha.log" 2>&1 &
            HA_PID=$!
          fi

          # ── wait and collect ───────────────────────────────────────────────
          wait $PRIMARY_PID; P=$?
          H=99  # sentinel: HA not configured / not applicable
          [ -n "$HA_PID" ] && { wait $HA_PID; H=$?; }

          echo "=== Primary VM log ==="
          cat "$DEPLOY_TMP/primary.log"
          if [ -n "$HA_PID" ]; then
            echo "=== HA VM log ==="
            cat "$DEPLOY_TMP/ha.log"
          fi

          [ $P -eq 0 ] && echo "Primary VM: success" || echo "Primary VM: failed (exit $P)"
          if [ $H -eq 99 ]; then
            echo "HA VM: not targeted (HA_VM_IP not set or target_vm=$TARGET_VM)"
          elif [ $H -eq 0 ]; then
            echo "HA VM: success"
          else
            echo "HA VM: failed (exit $H)"
          fi

          # ── gate: pass if ≥1 VM received the build ─────────────────────────
          if [ $P -eq 0 ]; then exit 0; fi
          if [ $H -eq 0 ]; then echo "Primary unavailable — HA standby is live"; exit 0; fi
          if [ $H -eq 99 ]; then exit $P; fi  # non-prod: primary must succeed
          echo "Both primary and HA deploys failed"
          exit 1

      # ── Catalog auto-regen (opt-in): publish the LIVE service's swagger ────
      # Runs after a successful backend deploy; every failure mode is soft — a
      # snapshot problem must never fail a deploy. Snapshots land on the
      # catalog-snapshots branch of so360-neura-be via the contents API
      # (repository_dispatch payloads cap at 64KB; swaggers are bigger), where
      # neura's own CI regenerates the catalog and opens a PR on drift.
      - name: Publish swagger snapshot to Neura catalog repo
        if: ${{ inputs.deploy_type == 'backend' && inputs.publish_swagger == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          IP="${{ steps.vm.outputs.ip }}"
          PORT="${{ inputs.port }}"
          [ -n "$IP" ] && [ "$PORT" != "0" ] || { echo "no ip/port — skipping"; exit 0; }
          for P in "/api-json" "/api-docs-json" "/docs-json"; do
            ssh -o StrictHostKeyChecking=no root@"$IP" "curl -sf http://127.0.0.1:$PORT$P" > /tmp/swagger.json 2>/dev/null && break
          done
          [ -s /tmp/swagger.json ] && head -c 1 /tmp/swagger.json | grep -q '{' || { echo "no swagger JSON served — skipping"; exit 0; }
          # Pure curl — fleet slots may lack gh (the copy-secret/golden-gate trap).
          NAME="${{ inputs.service_name }}"
          DEST="swagger-snapshots/${NAME}.json"
          API="https://api.github.com/repos/Neonbee-ai/so360-neura-be/contents/${DEST}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          SHA=$(curl -sf -H "$AUTH" "${API}?ref=catalog-snapshots" | sed -n 's/.*"sha": *"\([^"]*\)".*/\1/p' | head -1 || true)
          B64=$(base64 < /tmp/swagger.json | tr -d '\n')
          {
            printf '{"branch":"catalog-snapshots","message":"chore(catalog): %s swagger snapshot from prod deploy","content":"%s"' "$NAME" "$B64"
            [ -n "$SHA" ] && printf ',"sha":"%s"' "$SHA"
            printf '}'
          } > /tmp/snapshot-payload.json
          curl -sf -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/snapshot-payload.json "$API" >/dev/null \
            && echo "snapshot published: ${DEST}" || echo "snapshot publish failed (soft)"

      # ═══════════════════════════════════════════════════════════════════════
      # DEPLOY: Vite MFE (rsync dist/ → nginx → CF purge)
      # ═══════════════════════════════════════════════════════════════════════
      - name: Deploy vite-mfe
        id: deploy_vitemfe_primary
        if: always() && inputs.deploy_type == 'vite-mfe'
        continue-on-error: true
        env:
          SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
          NGINX_ROOT: ${{ inputs.nginx_root }}
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh root@$SERVER_IP "
            mkdir -p '$NGINX_ROOT-prev' '$NGINX_ROOT'
            rsync -a --delete '$NGINX_ROOT/' '$NGINX_ROOT-prev/' 2>/dev/null || true
          "

          ssh root@$SERVER_IP "mkdir -p '$NGINX_ROOT'"
          rsync -avz --delete dist/ "root@$SERVER_IP:$NGINX_ROOT/"
          ssh root@$SERVER_IP "nginx -t && nginx -s reload"
          echo "Deployed ${{ inputs.service_name }} to $NGINX_ROOT"

      - name: Purge Cloudflare cache
        if: inputs.deploy_type == 'vite-mfe' && inputs.cf_purge_urls != ''
        continue-on-error: true
        run: |
          CF_ZONE="${{ secrets.CF_SAAS_ZONE_ID }}"
          CF_TOKEN="${{ secrets.CF_SAAS_API_TOKEN }}"
          [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ] && echo "No CF credentials, skipping" && exit 0

          PURGE_URLS="${{ inputs.cf_purge_urls }}"
          if [ "$PURGE_URLS" = "all" ]; then
            BODY='{"purge_everything":true}'
          else
            FILES=$(echo "$PURGE_URLS" | tr ',' '\n' | sed 's/^/"/;s/$/"/' | paste -sd, -)
            BODY="{\"files\":[$FILES]}"
          fi

          RESP=$(curl -sX POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "$RESP" | grep -q '"success":true' && echo "Cloudflare cache purged" || echo "CF purge failed (deploy still succeeded)"

      # ── HA Standby: vite-mfe ──────────────────────────────────────────────
      - name: Deploy vite-mfe to HA standby
        id: deploy_vitemfe_ha
        if: always() && inputs.deploy_type == 'vite-mfe' && inputs.target_vm == 'prod'
        continue-on-error: true
        env:
          HA_IP: ${{ secrets.HA_VM_IP }}
          NGINX_ROOT: ${{ inputs.nginx_root }}
        run: |
          [ -z "$HA_IP" ] && echo "HA_VM_IP not configured, skipping HA deploy" && exit 0
          ssh-keyscan -H $HA_IP >> ~/.ssh/known_hosts 2>/dev/null
          ssh root@$HA_IP "
            mkdir -p '$NGINX_ROOT-prev' '$NGINX_ROOT'
            rsync -a --delete '$NGINX_ROOT/' '$NGINX_ROOT-prev/' 2>/dev/null || true
          "
          ssh root@$HA_IP "mkdir -p '$NGINX_ROOT'"
          rsync -avz --delete dist/ "root@$HA_IP:$NGINX_ROOT/"
          ssh root@$HA_IP "nginx -t && nginx -s reload"
          echo "HA standby: ${{ inputs.service_name }} deployed to $NGINX_ROOT"

      # ── Failover gate: vite-mfe ───────────────────────────────────────────
      - name: Verify vite-mfe deploy reached a target
        if: always() && inputs.deploy_type == 'vite-mfe'
        env:
          PRIMARY: ${{ steps.deploy_vitemfe_primary.outcome }}
          HA: ${{ steps.deploy_vitemfe_ha.outcome }}
          TARGET_VM: ${{ inputs.target_vm }}
        run: |
          echo "Primary VM deploy : $PRIMARY"
          echo "HA standby deploy : $HA (target_vm=$TARGET_VM)"
          if [ "$PRIMARY" = "success" ]; then echo "✅ Deployed to primary VM."; exit 0; fi
          if [ "$TARGET_VM" = "prod" ] && [ "$HA" = "success" ]; then
            echo "⚠️  Primary unavailable — HA standby is live"; exit 0
          fi
          echo "❌ Deploy reached no healthy target (primary=$PRIMARY, ha=$HA)."
          exit 1

      # ═══════════════════════════════════════════════════════════════════════
      # DEPLOY: Next.js (rsync .next/ → PM2)
      # ═══════════════════════════════════════════════════════════════════════
      - name: Deploy nextjs (standard)
        id: deploy_nextjs_primary
        if: always() && inputs.deploy_type == 'nextjs' && !inputs.standalone
        continue-on-error: true
        env:
          SERVER_IP: ${{ steps.vm.outputs.ip }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}
          PORT: ${{ inputs.port }}
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh root@$SERVER_IP "
            mkdir -p '$SERVICE_DIR/.next-prev' '$SERVICE_DIR/.next'
            rsync -a --delete '$SERVICE_DIR/.next/' '$SERVICE_DIR/.next-prev/' 2>/dev/null || true
          "

          ssh root@$SERVER_IP "mkdir -p '$SERVICE_DIR/.next/static' '$SERVICE_DIR/public'"
          rsync -avz --delete --exclude='.env' .next/ "root@$SERVER_IP:$SERVICE_DIR/.next/"
          rsync -avz package.json package-lock.json next.config.ts "root@$SERVER_IP:$SERVICE_DIR/" 2>/dev/null || \
          rsync -avz package.json package-lock.json next.config.mjs "root@$SERVER_IP:$SERVICE_DIR/" 2>/dev/null || \
          rsync -avz package.json package-lock.json "root@$SERVER_IP:$SERVICE_DIR/"
          rsync -avz public/ "root@$SERVER_IP:$SERVICE_DIR/public/" 2>/dev/null || true

          ssh root@$SERVER_IP "SERVICE_DIR='$SERVICE_DIR' SERVICE_NAME='$SERVICE_NAME' PORT='$PORT' bash -s" << 'DEPLOY_SCRIPT'
            set -e
            cd "$SERVICE_DIR"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$NVM_DIR/versions/node/$(ls $NVM_DIR/versions/node/ 2>/dev/null | sort -V | tail -1)/bin:$PATH"
            npm install --omit=dev --legacy-peer-deps
            pm2 delete "$SERVICE_NAME" 2>/dev/null || true
            PORT=$PORT pm2 start npm --name "$SERVICE_NAME" -- start -- -p $PORT
            pm2 save
            for i in {1..15}; do
              curl -fsS "http://127.0.0.1:$PORT" >/dev/null 2>&1 && echo "Health check passed" && break
              [ "$i" -eq 15 ] && pm2 logs "$SERVICE_NAME" --lines 50 --nostream && exit 1
              sleep 2
            done
            echo "Deployed $SERVICE_NAME on port $PORT"
          DEPLOY_SCRIPT

      # ── HA Standby: nextjs (standard) ─────────────────────────────────────
      - name: Deploy nextjs to HA standby
        id: deploy_nextjs_ha
        if: always() && inputs.deploy_type == 'nextjs' && !inputs.standalone && (inputs.target_vm == 'prod' || inputs.target_vm == 'storefront' || inputs.target_vm == 'internal')
        continue-on-error: true
        env:
          HA_IP: ${{ secrets.HA_VM_IP }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}-ha
          PORT: ${{ inputs.port }}
        run: |
          [ -z "$HA_IP" ] && echo "HA_VM_IP not configured, skipping HA deploy" && exit 0
          ssh-keyscan -H $HA_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh root@$HA_IP "
            mkdir -p '$SERVICE_DIR/.next-prev' '$SERVICE_DIR/.next'
            rsync -a --delete '$SERVICE_DIR/.next/' '$SERVICE_DIR/.next-prev/' 2>/dev/null || true
          "
          ssh root@$HA_IP "mkdir -p '$SERVICE_DIR/.next/static' '$SERVICE_DIR/public'"
          rsync -avz --delete --exclude='.env' .next/ "root@$HA_IP:$SERVICE_DIR/.next/"
          rsync -avz package.json package-lock.json "root@$HA_IP:$SERVICE_DIR/" 2>/dev/null || true
          rsync -avz public/ "root@$HA_IP:$SERVICE_DIR/public/" 2>/dev/null || true

          ssh root@$HA_IP "SERVICE_DIR='$SERVICE_DIR' SERVICE_NAME='$SERVICE_NAME' PORT='$PORT' bash -s" << 'DEPLOY_HA_NJS'
            set -e
            cd "$SERVICE_DIR"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$NVM_DIR/versions/node/$(ls $NVM_DIR/versions/node/ 2>/dev/null | sort -V | tail -1)/bin:$PATH"
            npm install --omit=dev --legacy-peer-deps
            pm2 delete "$SERVICE_NAME" 2>/dev/null || true
            PORT=$PORT pm2 start npm --name "$SERVICE_NAME" -- start -- -p $PORT
            pm2 save
            for i in {1..15}; do
              curl -fsS "http://127.0.0.1:$PORT" >/dev/null 2>&1 && echo "HA health check passed" && break
              [ "$i" -eq 15 ] && pm2 logs "$SERVICE_NAME" --lines 30 --nostream && exit 1
              sleep 2
            done
            echo "HA standby: $SERVICE_NAME on port $PORT ready"
          DEPLOY_HA_NJS

      # ── Failover gate: nextjs (standard) ──────────────────────────────────
      - name: Verify nextjs deploy reached a target
        if: always() && inputs.deploy_type == 'nextjs' && !inputs.standalone
        env:
          PRIMARY: ${{ steps.deploy_nextjs_primary.outcome }}
          HA: ${{ steps.deploy_nextjs_ha.outcome }}
          TARGET_VM: ${{ inputs.target_vm }}
        run: |
          echo "Primary VM deploy : $PRIMARY"
          echo "HA standby deploy : $HA (target_vm=$TARGET_VM)"
          if [ "$PRIMARY" = "success" ]; then echo "✅ Deployed to primary VM."; exit 0; fi
          if { [ "$TARGET_VM" = "prod" ] || [ "$TARGET_VM" = "storefront" ] || [ "$TARGET_VM" = "internal" ]; } && [ "$HA" = "success" ]; then
            echo "⚠️  Primary unavailable — HA standby is live"; exit 0
          fi
          echo "❌ Deploy reached no healthy target (primary=$PRIMARY, ha=$HA)."
          exit 1

      - name: Deploy nextjs (standalone)
        id: deploy_nextjs_standalone_primary
        if: always() && inputs.deploy_type == 'nextjs' && inputs.standalone
        continue-on-error: true
        env:
          SERVER_IP: ${{ steps.vm.outputs.ip }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}
          PORT: ${{ inputs.port }}
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh root@$SERVER_IP "mkdir -p '$SERVICE_DIR/.next/static' '$SERVICE_DIR/public'"
          rsync -avz --delete .next/standalone/ "root@$SERVER_IP:$SERVICE_DIR/"
          rsync -avz --delete .next/static/ "root@$SERVER_IP:$SERVICE_DIR/.next/static/"
          rsync -avz public/ "root@$SERVER_IP:$SERVICE_DIR/public/" 2>/dev/null || true

          ssh root@$SERVER_IP "SERVICE_DIR='$SERVICE_DIR' SERVICE_NAME='$SERVICE_NAME' PORT='$PORT' bash -s" << 'DEPLOY_SCRIPT'
            set -e
            cd "$SERVICE_DIR"
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
              nvm use 22
            fi
            pm2 delete "$SERVICE_NAME" 2>/dev/null || true
            PORT=$PORT HOSTNAME=0.0.0.0 pm2 start server.js --name "$SERVICE_NAME" --instances ${{ inputs.pm2_instances }} --max-memory-restart 500M
            pm2 save
            for i in {1..15}; do
              curl -fsS "http://127.0.0.1:$PORT" >/dev/null 2>&1 && echo "Health check passed" && break
              [ "$i" -eq 15 ] && pm2 logs "$SERVICE_NAME" --lines 50 --nostream && exit 1
              sleep 2
            done
            echo "Deployed $SERVICE_NAME (standalone) on port $PORT"
          DEPLOY_SCRIPT

      # ── HA Standby: nextjs (standalone) ───────────────────────────────────
      - name: Deploy nextjs standalone to HA standby
        id: deploy_nextjs_standalone_ha
        if: always() && inputs.deploy_type == 'nextjs' && inputs.standalone && inputs.target_vm == 'prod'
        continue-on-error: true
        env:
          HA_IP: ${{ secrets.HA_VM_IP }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}-ha
          PORT: ${{ inputs.port }}
        run: |
          [ -z "$HA_IP" ] && echo "HA_VM_IP not configured, skipping HA deploy" && exit 0
          ssh-keyscan -H $HA_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh root@$HA_IP "mkdir -p '$SERVICE_DIR/.next/static' '$SERVICE_DIR/public'"
          rsync -avz --delete .next/standalone/ "root@$HA_IP:$SERVICE_DIR/"
          rsync -avz --delete .next/static/ "root@$HA_IP:$SERVICE_DIR/.next/static/"
          rsync -avz public/ "root@$HA_IP:$SERVICE_DIR/public/" 2>/dev/null || true

          ssh root@$HA_IP "SERVICE_DIR='$SERVICE_DIR' SERVICE_NAME='$SERVICE_NAME' PORT='$PORT' bash -s" << 'DEPLOY_HA_SA'
            set -e
            cd "$SERVICE_DIR"
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
              nvm use 22
            fi
            pm2 delete "$SERVICE_NAME" 2>/dev/null || true
            PORT=$PORT HOSTNAME=0.0.0.0 pm2 start server.js --name "$SERVICE_NAME" --instances ${{ inputs.pm2_instances }} --max-memory-restart 500M
            pm2 save
            for i in {1..15}; do
              curl -fsS "http://127.0.0.1:$PORT" >/dev/null 2>&1 && echo "HA health check passed" && break
              [ "$i" -eq 15 ] && pm2 logs "$SERVICE_NAME" --lines 30 --nostream && exit 1
              sleep 2
            done
            echo "HA standby: $SERVICE_NAME (standalone) on port $PORT ready"
          DEPLOY_HA_SA

      # ── Failover gate: nextjs (standalone) ────────────────────────────────
      - name: Verify nextjs standalone deploy reached a target
        if: always() && inputs.deploy_type == 'nextjs' && inputs.standalone
        env:
          PRIMARY: ${{ steps.deploy_nextjs_standalone_primary.outcome }}
          HA: ${{ steps.deploy_nextjs_standalone_ha.outcome }}
          TARGET_VM: ${{ inputs.target_vm }}
        run: |
          echo "Primary VM deploy : $PRIMARY"
          echo "HA standby deploy : $HA (target_vm=$TARGET_VM)"
          if [ "$PRIMARY" = "success" ]; then echo "✅ Deployed to primary VM."; exit 0; fi
          if [ "$TARGET_VM" = "prod" ] && [ "$HA" = "success" ]; then
            echo "⚠️  Primary unavailable — HA standby is live"; exit 0
          fi
          echo "❌ Deploy reached no healthy target (primary=$PRIMARY, ha=$HA)."
          exit 1

      # ═══════════════════════════════════════════════════════════════════════
      # METRICS (shared — all deploy types)
      # ═══════════════════════════════════════════════════════════════════════
      - name: Push build metrics
        if: always()
        continue-on-error: true
        run: |
          DURATION=$(( $(date +%s) - ${{ steps.timing.outputs.start }} ))
          STATUS="${{ job.status }}"
          TOOLS="${{ secrets.INTERNAL_TOOLS_VM }}"
          [ -z "$TOOLS" ] && exit 0
          ssh-keyscan -H $TOOLS >> ~/.ssh/known_hosts 2>/dev/null
          TS=$(date -u +%s)
          ssh root@$TOOLS "
            printf 'ci_build_duration_seconds{service=\"${{ inputs.service_name }}\",env=\"prod\",status=\"${STATUS}\"} ${DURATION}\n' | \
              curl -s --data-binary @- http://localhost:9091/metrics/job/ci/instance/${{ inputs.service_name }}
            printf 'deploy_timestamp{service=\"${{ inputs.service_name }}\",env=\"prod\",commit=\"${GITHUB_SHA:0:8}\"} ${TS}\n' | \
              curl -s --data-binary @- http://localhost:9091/metrics/job/deploy/instance/${{ inputs.service_name }}
          " 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "Service: ${{ inputs.service_name }} | Type: ${{ inputs.deploy_type }} | VM: ${{ inputs.target_vm }} | Status: ${{ job.status }}"

  # ── Notify: Microsoft Teams webhook on completion ───────────────────────────
  # Additive only — does NOT change the gate → build → deploy flow (Rule 0).
  # Runs after all jobs regardless of outcome, so gate failures are reported too.
  # No-ops silently when NOTIFY_WEBHOOK_URL is unset; never fails the pipeline.
  notify:
    name: Notify Teams
    needs: [gate, build-deploy]
    if: always()
    runs-on: [self-hosted, contabo]
    steps:
      - name: Post pipeline result to Teams
        env:
          HOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "NOTIFY_WEBHOOK_URL not set — skipping notification"; exit 0; fi
          if ${{ contains(needs.*.result, 'failure') }}; then
            STATUS="FAILURE"; COLOR="Attention"
          elif ${{ contains(needs.*.result, 'cancelled') }}; then
            STATUS="CANCELLED"; COLOR="Warning"
          else
            STATUS="SUCCESS"; COLOR="Good"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${GITHUB_SHA:0:8}"
          curl -sf -H 'Content-Type: application/json' --data @- "$HOOK" <<JSON || echo "Teams notify failed (non-fatal)"
          {
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  { "type": "TextBlock", "size": "Large", "weight": "Bolder", "color": "${COLOR}", "text": "${{ inputs.service_name }} — pipeline ${STATUS}", "wrap": true },
                  { "type": "TextBlock", "text": "${{ github.repository }} @ ${{ github.ref_name }} (prod)", "isSubtle": true, "spacing": "None", "wrap": true },
                  { "type": "FactSet", "facts": [
                    { "title": "Status", "value": "${STATUS}" },
                    { "title": "Branch", "value": "${{ github.ref_name }}" },
                    { "title": "Commit", "value": "${SHA}" },
                    { "title": "Trigger", "value": "${{ github.event_name }}" }
                  ] }
                ],
                "actions": [{ "type": "Action.OpenUrl", "title": "View run", "url": "${RUN_URL}" }]
              }
            }]
          }
          JSON
