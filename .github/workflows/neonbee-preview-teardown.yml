# =============================================================================
# Neonbee — Reusable feature-branch PREVIEW teardown
# =============================================================================
# Called from a repo's `on: delete` trigger. Removes that repo's component from
# the branch preview; when it was the last component the whole preview goes,
# and so do its Cloudflare DNS record and Access app (preview-ctl cf-remove on
# the preview host: DNS first, then Access — the reverse of creation, so the
# hostname never resolves ungated). A site/next
# component's own host (REMOVED_HOST) is cleaned up the same way, even while
# the rest of the preview stays.
#
# Caller:
#   on:
#     delete:
#   jobs:
#     preview-teardown:
#       if: github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'feat/') || startsWith(github.event.ref, 'fix/'))
#       uses: Neonbee-ai/neonbee-devops/.github/workflows/neonbee-preview-teardown.yml@main
#       secrets: inherit
#
# The nightly preview-reconcile.yml catches anything a missed delete leaves.
# =============================================================================

name: Preview teardown (reusable)

on:
  workflow_call:
    inputs:
      branch:
        description: 'Deleted branch (defaults to github.event.ref)'
        required: false
        type: string
        default: ''
    secrets:
      PREVIEW_HOST:         { required: false }
      PREVIEW_SSH_KEY:      { required: false }
      CF_PREVIEW_API_TOKEN: { required: false }
      PREVIEW_DEV_ORIGIN:   { required: false }
      SUPABASE_URL:         { required: false }

env:
  PREVIEW_DOMAIN: skyoffice360.com

jobs:
  teardown:
    runs-on: [self-hosted, contabo, Linux]
    timeout-minutes: 10
    steps:
      - name: Slug
        id: s
        env:
          BRANCH: ${{ inputs.branch || github.event.ref }}
        run: |
          set -euo pipefail
          case "$BRANCH" in feat/*|fix/*) ;; *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          # ── slug (keep identical to neonbee-deploy-preview.yml) ──
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ ${#slug} -gt 50 ]; then
            h=$(printf '%s' "$BRANCH" | sha1sum | cut -c1-6)
            slug="$(printf '%s' "$slug" | cut -c1-43 | sed -E 's/-+$//')-$h"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Remove from preview host
        id: rm
        if: steps.s.outputs.run == 'true'
        env:
          KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          HOST: ${{ secrets.PREVIEW_HOST }}
          SLUG: ${{ steps.s.outputs.slug }}
          REPO: ${{ github.event.repository.name }}
          DEVO: ${{ secrets.PREVIEW_DEV_ORIGIN }}
          SBURL: ${{ secrets.SUPABASE_URL }}
          CFT: ${{ secrets.CF_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$HOST" ] || { echo "::notice::PREVIEW_HOST not set — nothing to tear down"; echo "removed=0" >> "$GITHUB_OUTPUT"; exit 0; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          echo "$KEY" | ssh-add -
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # ── host config from secrets (keep identical in all preview workflows) ──
          # PROD_SUPABASE_HOST is written empty: backend previews may use the
          # prod DB until a preview database exists (user decision 2026-09-30).
          if ! printf '%s\n' "$DEVO" | grep -qxE '[A-Za-z0-9.-]+'; then
            echo "::warning title=Preview host config::PREVIEW_DEV_ORIGIN secret missing/invalid - host keeps its current config"
          else
            printf 'DEV_ORIGIN=%s\nPROD_SUPABASE_HOST=\n' "$DEVO" | ssh "root@$HOST" 'install -d -m 700 /etc/so360-preview && umask 077 && cat > /etc/so360-preview/ci.env.tmp && mv /etc/so360-preview/ci.env.tmp /etc/so360-preview/ci.env'
          fi
          if [ -n "${CFT:-}" ]; then
            printf 'CF_API_TOKEN=%s\n' "$CFT" | ssh "root@$HOST" 'install -d -m 700 /etc/so360-preview && umask 077 && cat > /etc/so360-preview/cf.env.tmp && mv /etc/so360-preview/cf.env.tmp /etc/so360-preview/cf.env'
          fi
          # ── end host config ──
          OUT=$(ssh "root@$HOST" "preview-ctl remove --slug '$SLUG' --repo '$REPO'")
          echo "$OUT"
          # DNS + Access for every host that went away (preview-ctl cf-remove:
          # DNS first, then Access). The Cloudflare token stays on the host.
          FQDNS=$(sed -n 's/^REMOVED_HOST=\(pr-[a-z0-9-]*\.skyoffice360\.com\)$/--fqdn \1/p' <<<"$OUT" | tr '\n' ' ')
          if grep -qx 'REMOVED_PREVIEW=1' <<<"$OUT"; then FQDNS="--fqdn pr-$SLUG.$PREVIEW_DOMAIN $FQDNS"; fi
          if [ -n "${FQDNS// /}" ]; then ssh "root@$HOST" "preview-ctl cf-remove $FQDNS"; fi
          ssh-agent -k >/dev/null
