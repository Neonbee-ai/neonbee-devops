name: Neonbee — Sync prod env to AWS Secrets Manager (opt-in)

# ════════════════════════════════════════════════════════════════════════════
# Reusable workflow (Stage 3.1). Opt-in and manual: NOT called by any deploy.
# A caller runs it from its own workflow_dispatch job with `secrets: inherit`:
#
#   sync-aws-env:
#     permissions: { id-token: write, contents: read }
#     uses: Neonbee-ai/neonbee-devops/.github/workflows/neonbee-sync-secrets-aws.yml@main
#     with: { service_name: crm-prod }
#     secrets: inherit
#
# It assembles the SAME runtime env the prod backend deploy writes to the VM
# .env (neonbee-deploy-prod.yml "Deploy backend" .env.ci block: same keys, same
# secret sources, same Supabase/CORS renames, FIREBASE_SERVICE_ACCOUNT -> _B64,
# extra_env lines, empty values dropped) and writes it as ONE JSON object to
# Secrets Manager `<secret_prefix><service_name>` (create-or-update). The VM
# agent (nb-render-env) renders `_shared` then this secret into .env.
#
# Values: only EMPTY values are dropped. A value ending in "=" (padded base64)
# is kept verbatim — JSON carries it, and nb-render-env writes it @json-quoted,
# so the "deploy drops env values ending in '='" trap cannot happen here.
# Nothing is echoed: values never reach argv or logs (GitHub masks secrets; the
# derived FIREBASE_SERVICE_ACCOUNT_B64 is masked explicitly); only key NAMES are
# printed. Not replicated: keys that exist only in a VM's hand-edited .env
# (deploy-prod keeps those) — list them via extra_env or the _shared secret.
#
# Parity: MAP below = `TARGET:SOURCE` pairs from deploy-prod's backend .env.ci
# block. Regenerate after adding a secret there:
#   awk '/echo "NODE_ENV=production"/,/sed -i -E .\/\^\[A-Za-z_\]/' neonbee-deploy-prod.yml \
#     | grep -oE 'echo "[A-Z0-9_]+=\$\{\{ secrets\.[A-Z0-9_]+ \}\}' \
#     | sed -E 's/echo "([A-Z0-9_]+)=\$\{\{ secrets\.([A-Z0-9_]+) \}\}/\1:\2/' | awk '!s[$0]++'
# ════════════════════════════════════════════════════════════════════════════

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Catalog / prod deploy service name, e.g. crm-prod'
        required: true
        type: string
      extra_env:
        description: 'Extra non-secret KEY=value lines (pass the same value as the prod deploy extra_env)'
        required: false
        type: string
        default: ''
      include_keys:
        description: 'Optional space-separated allowlist of target keys (empty = full backend env). Use for Next apps.'
        required: false
        type: string
        default: ''
      secret_prefix:
        required: false
        type: string
        default: 'neonbee/prod/env/'
      aws_region:
        description: 'AWS region (falls back to repo var NB_AWS_REGION, then ap-south-1)'
        required: false
        type: string
        default: ''
      aws_role_arn:
        description: 'IAM role for GitHub OIDC (falls back to repo var NB_AWS_ROLE_ARN)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Assemble and list key names only; no AWS calls'
        required: false
        type: boolean
        default: false
      runs_on:
        description: 'JSON runner label list (self-hosted only)'
        required: false
        type: string
        default: '["self-hosted","runner-vm"]'

jobs:
  sync:
    name: Sync env → ${{ inputs.secret_prefix }}${{ inputs.service_name }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    concurrency:
      group: nb-sync-secrets-${{ inputs.service_name }}
      cancel-in-progress: false
    env:
      SERVICE: ${{ inputs.service_name }}
      SECRET_ID: ${{ inputs.secret_prefix }}${{ inputs.service_name }}
      AWS_REGION: ${{ inputs.aws_region || vars.NB_AWS_REGION || 'ap-south-1' }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region || vars.NB_AWS_REGION || 'ap-south-1' }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ runner.environment }}" != "github-hosted" ] || { echo "::error::self-hosted runners only (runs_on)"; exit 1; }
          [[ "$SERVICE" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]] || { echo "::error::service_name must be lowercase letters, digits, dash"; exit 1; }
          [[ "$SECRET_ID" =~ ^[A-Za-z0-9/_+=.@-]{1,255}$ ]] || { echo "::error::invalid secret id"; exit 1; }
          [ "${{ inputs.dry_run }}" = true ] || [ -n "${{ inputs.aws_role_arn || vars.NB_AWS_ROLE_ARN }}" ] \
            || { echo "::error::aws_role_arn input or NB_AWS_ROLE_ARN var is required (OIDC only)"; exit 1; }
          echo "service=$SERVICE secret=$SECRET_ID region=$AWS_REGION"

      - name: Assemble env JSON (values never printed)
        id: env
        shell: bash
        env:
          NB_SECRETS: ${{ toJSON(secrets) }}
          EXTRA_ENV: ${{ inputs.extra_env }}
          INCLUDE_KEYS: ${{ inputs.include_keys }}
          MAP: >-
            SUPABASE_URL:SUPABASE_URL SUPABASE_KEY:SUPABASE_ANON_KEY SUPABASE_ANON_KEY:SUPABASE_ANON_KEY
            SUPABASE_SERVICE_KEY:SUPABASE_SERVICE_KEY SUPABASE_SERVICE_ROLE_KEY:SUPABASE_SERVICE_KEY JWT_SECRET:JWT_SECRET
            CORS_ORIGINS:CORS_ORIGINS_PROD ENCRYPTION_KEY:ENCRYPTION_KEY CHANNEL_ENCRYPTION_KEY:CHANNEL_ENCRYPTION_KEY
            PAYROLL_ENCRYPTION_KEY:PAYROLL_ENCRYPTION_KEY CF_R2_ACCOUNT_ID:CF_R2_ACCOUNT_ID CF_R2_ACCESS_KEY_ID:CF_R2_ACCESS_KEY_ID
            CF_R2_SECRET_ACCESS_KEY:CF_R2_SECRET_ACCESS_KEY CF_R2_BUCKET:CF_R2_BUCKET CF_R2_PUBLIC_URL:CF_R2_PUBLIC_URL
            CF_R2_PREFIX:CF_R2_PREFIX BUNNY_STORAGE_HOSTNAME:BUNNY_STORAGE_HOSTNAME BUNNY_STORAGE_ZONE:BUNNY_STORAGE_ZONE
            BUNNY_ACCESS_KEY:BUNNY_ACCESS_KEY BUNNY_PULL_ZONE_URL:BUNNY_PULL_ZONE_URL BUNNY_PREFIX:BUNNY_PREFIX
            EMAIL_INTERNAL_KEY:EMAIL_INTERNAL_KEY STOREFRONT_INTERNAL_OPS_KEY:STOREFRONT_INTERNAL_OPS_KEY
            CF_SAAS_API_TOKEN:CF_SAAS_API_TOKEN CF_SAAS_ZONE_ID:CF_SAAS_ZONE_ID CF_SAAS_FALLBACK_HOSTNAME:CF_SAAS_FALLBACK_HOSTNAME
            VAPID_PUBLIC_KEY:VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY:VAPID_PRIVATE_KEY MOBILITY_INTERNAL_KEY:MOBILITY_INTERNAL_KEY
            MCP_OAUTH_ENC_KEY:MCP_OAUTH_ENC_KEY MCP_CONFIRM_TOKEN_SECRET:MCP_CONFIRM_TOKEN_SECRET
            INTERNAL_SERVICE_KEY:INTERNAL_SERVICE_KEY INVENTORY_INTERNAL_KEY:INVENTORY_INTERNAL_KEY
            DAILYSTORE_PUBLIC_URL:DAILYSTORE_PUBLIC_URL DAILYSTORE_INTERNAL_KEY:DAILYSTORE_INTERNAL_KEY
            PEOPLE_INTERNAL_KEY:PEOPLE_INTERNAL_KEY PEOPLE_INTERNAL_KEY_2:PEOPLE_INTERNAL_KEY_2 FLOW_INTERNAL_KEY:FLOW_INTERNAL_KEY
            CORE_INTERNAL_KEY:CORE_INTERNAL_KEY DOCS_INTERNAL_SERVICE_KEY:DOCS_INTERNAL_SERVICE_KEY
            SUBSCRIPTION_INTERNAL_KEY:SUBSCRIPTION_INTERNAL_KEY NEURA_INTERNAL_KEY:NEURA_INTERNAL_KEY
            NEURA_INTERNAL_KEY_2:NEURA_INTERNAL_KEY_2 CHAT_INTERNAL_KEY:CHAT_INTERNAL_KEY PROJECTS_INTERNAL_KEY:PROJECTS_INTERNAL_KEY
            FORMS_INTERNAL_KEY:FORMS_INTERNAL_KEY MANUFACTURING_INTERNAL_KEY:MANUFACTURING_INTERNAL_KEY
            INBOX_SERVICE_KEY:INBOX_SERVICE_KEY NOTIFICATION_INTERNAL_KEY:NOTIFICATION_INTERNAL_KEY
            STOREFRONT_JWT_SECRET:STOREFRONT_JWT_SECRET GEMINI_API_KEY:GEMINI_API_KEY OPENAI_API_KEY:OPENAI_API_KEY
            ANTHROPIC_API_KEY:ANTHROPIC_API_KEY CONNECT_ENCRYPTION_KEY:CONNECT_ENCRYPTION_KEY
            FAILURE_TICKETS_GH_TOKEN:FAILURE_TICKETS_GH_TOKEN FAILURE_TICKETS_PULSE_KEY:FAILURE_TICKETS_PULSE_KEY
            CONNECT_INTERNAL_KEY:CONNECT_INTERNAL_KEY CONNECT_INTERNAL_KEYS:CONNECT_INTERNAL_KEYS
            CONTENTFORGE_INTEGRATION_KEY:CONTENTFORGE_INTEGRATION_KEY LUMEN_INTEGRATION_KEY:LUMEN_INTEGRATION_KEY
            INNGEST_EVENT_KEY:INNGEST_EVENT_KEY INNGEST_SIGNING_KEY:INNGEST_SIGNING_KEY DATAFORSEO_LOGIN:DATAFORSEO_LOGIN
            DATAFORSEO_PASSWORD:DATAFORSEO_PASSWORD TAVILY_API_KEY:TAVILY_API_KEY FIRECRAWL_API_KEY:FIRECRAWL_API_KEY
            EXA_API_KEY:EXA_API_KEY GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET:GOOGLE_OAUTH_CLIENT_SECRET
            SENTRY_DSN:SENTRY_DSN POSTHOG_API_KEY:POSTHOG_API_KEY LUMEN_SITE_RENDER_KEY:LUMEN_SITE_RENDER_KEY
            REVALIDATE_SECRET:REVALIDATE_SECRET WEB_SEARCH_PROVIDER:WEB_SEARCH_PROVIDER WEB_SEARCH_API_KEY:WEB_SEARCH_API_KEY
            CAMPAIGN_WEBHOOK_SECRET:CAMPAIGN_WEBHOOK_SECRET BACK_IN_STOCK_TOKEN_SECRET:BACK_IN_STOCK_TOKEN_SECRET
            SNS_ALLOWED_TOPIC_ARNS:SNS_ALLOWED_TOPIC_ARNS REDIS_URL:REDIS_URL STRIPE_WEBHOOK_SECRET:STRIPE_WEBHOOK_SECRET
            PAYPAL_WEBHOOK_ID:PAYPAL_WEBHOOK_ID RAZORPAY_KEY_ID:RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET:RAZORPAY_KEY_SECRET
            BILLING_SELLER_NAME:BILLING_SELLER_NAME BILLING_SELLER_ADDRESS:BILLING_SELLER_ADDRESS
            BILLING_SELLER_TAX_ID:BILLING_SELLER_TAX_ID MARKETING_INTERNAL_KEY:MARKETING_INTERNAL_KEY
            MARKETING_TRACKING_SECRET:MARKETING_TRACKING_SECRET CRM_SYNC_INTERNAL_KEY:CRM_SYNC_INTERNAL_KEY
            SUPPORT_INTERNAL_KEY:SUPPORT_INTERNAL_KEY CHANNEL_DELEGATION_SECRET:CHANNEL_DELEGATION_SECRET
            COMPENSATION_ENCRYPTION_KEY:COMPENSATION_ENCRYPTION_KEY VENDOR_BANK_ENC_KEY:VENDOR_BANK_ENC_KEY
            AWS_ACCESS_KEY_ID:AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY:AWS_SECRET_ACCESS_KEY AWS_REGION:AWS_REGION
            INBOX_EMAIL_S3_BUCKET:INBOX_EMAIL_S3_BUCKET ACCOUNTING_INTERNAL_KEY:ACCOUNTING_INTERNAL_KEY
            ACCOUNTING_INTERNAL_KEY_2:ACCOUNTING_INTERNAL_KEY_2 CORE_PARTNER_INTERNAL_KEY:CORE_PARTNER_INTERNAL_KEY
            PARTNER_RESOLVE_INTERNAL_KEY:PARTNER_RESOLVE_INTERNAL_KEY FULFILLMENT_INTERNAL_KEY:FULFILLMENT_INTERNAL_KEY
            PLATFORM_OPS_INTERNAL_KEY:PLATFORM_OPS_INTERNAL_KEY GOOGLE_CLIENT_ID:GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET:GOOGLE_CLIENT_SECRET SLACK_CLIENT_ID:SLACK_CLIENT_ID SLACK_CLIENT_SECRET:SLACK_CLIENT_SECRET
            SLACK_SIGNING_SECRET:SLACK_SIGNING_SECRET
        run: |
          set -euo pipefail
          umask 077
          OUT="$RUNNER_TEMP/nb-env-${GITHUB_RUN_ID}-${SERVICE}.json"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          # Mask the only derived value before it exists anywhere a log could see it.
          FB_B64=$(python3 -I -c 'import json,os,base64; s=json.loads(os.environ["NB_SECRETS"]).get("FIREBASE_SERVICE_ACCOUNT","") or ""; print(base64.b64encode(s.encode()).decode() if "service_account" in s else "")')
          [ -n "$FB_B64" ] && echo "::add-mask::$FB_B64"
          FB_B64="$FB_B64" OUT="$OUT" python3 -I - <<'PY'
          import json, os, re
          sec = json.loads(os.environ["NB_SECRETS"])
          env = {"SERVICE_PORT_BAND": "8000"}
          for pair in os.environ["MAP"].split():
              tgt, src = pair.split(":", 1)
              v = sec.get(src)
              if isinstance(v, str) and v != "":      # drop EMPTY only; trailing '=' kept
                  env[tgt] = v
          if os.environ.get("FB_B64"):
              env["FIREBASE_SERVICE_ACCOUNT_B64"] = os.environ["FB_B64"]
          # extra_env: KEY=value lines; split on the FIRST '=' so padded values survive.
          for line in os.environ.get("EXTRA_ENV", "").splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              m = re.match(r"^([A-Za-z_][A-Za-z0-9_]*)=(.*)$", line)
              if not m:
                  raise SystemExit("::error::extra_env line is not KEY=value")
              if m.group(2) != "":
                  env[m.group(1)] = m.group(2)
          inc = os.environ.get("INCLUDE_KEYS", "").split()
          if inc:
              env = {k: v for k, v in env.items() if k in inc}
          with open(os.environ["OUT"], "w") as f:
              json.dump(env, f, separators=(",", ":"))
          print(f"{len(env)} keys: " + " ".join(sorted(env)))
          PY

      - name: Ensure AWS CLI
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1; then aws --version; exit 0; fi
          python3 -m venv "$RUNNER_TEMP/awscli-venv"
          "$RUNNER_TEMP/awscli-venv/bin/pip" install -q awscli
          echo "$RUNNER_TEMP/awscli-venv/bin" >> "$GITHUB_PATH"

      - name: AWS credentials (OIDC role)
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn || vars.NB_AWS_ROLE_ARN }}
          role-session-name: nb-sync-secrets-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region || vars.NB_AWS_REGION || 'ap-south-1' }}

      - name: Create or update secret
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          FILE: ${{ steps.env.outputs.file }}
        run: |
          set -euo pipefail
          # Value goes via file:// only — never argv, never stdout.
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value --secret-id "$SECRET_ID" \
              --secret-string "file://$FILE" --query VersionId --output text
            echo "updated $SECRET_ID"
          else
            aws secretsmanager create-secret --name "$SECRET_ID" \
              --description "Neonbee prod runtime env for $SERVICE (synced from GitHub secrets)" \
              --tags "Key=nb:service,Value=$SERVICE" "Key=nb:managed-by,Value=neonbee-sync-secrets-aws" \
              --secret-string "file://$FILE" --query VersionId --output text
            echo "created $SECRET_ID"
          fi

      - name: Remove env file
        if: always()
        shell: bash
        run: rm -f "${{ steps.env.outputs.file }}"
