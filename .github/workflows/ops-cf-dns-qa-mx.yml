# One-off: MX qa.neonbee.app -> SES inbound (ap-south-1) for the AutoQA test mailbox. Idempotent.
name: ops-cf-dns-qa-mx
on:
  push:
    branches: [ops/cf-dns-qa-mx]
permissions: {}
jobs:
  dns:
    runs-on: [self-hosted, runner-vm]
    steps:
      - name: Upsert MX record
        env:
          T1: ${{ secrets.CF_SAAS_API_TOKEN }}
          T2: ${{ secrets.CF_PREVIEW_API_TOKEN }}
          ZONE_NAME: neonbee.app
          REC: qa.neonbee.app
          MX: inbound-smtp.ap-south-1.amazonaws.com
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          for T in "$T1" "$T2"; do
            [ -n "$T" ] || continue
            Z=$(curl -s -H "Authorization: Bearer $T" "$API/zones?name=$ZONE_NAME" | jq -r '.result[0].id // empty')
            [ -n "$Z" ] || { echo "token cannot see $ZONE_NAME, trying next"; continue; }
            ID=$(curl -s -H "Authorization: Bearer $T" "$API/zones/$Z/dns_records?type=MX&name=$REC" | jq -r '.result[0].id // empty')
            BODY=$(jq -nc --arg n "$REC" --arg c "$MX" '{type:"MX",name:$n,content:$c,priority:10,ttl:300,comment:"AutoQA test mailbox (SES inbound -> Inbox)"}')
            if [ -n "$ID" ]; then R=$(curl -s -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$API/zones/$Z/dns_records/$ID" -d "$BODY")
            else R=$(curl -s -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$API/zones/$Z/dns_records" -d "$BODY"); fi
            echo "$R" | jq -c '{success, errors, rec: (.result | {name, content, priority})}'
            [ "$(echo "$R" | jq -r .success)" = true ] && exit 0
          done
          echo "no token could write $ZONE_NAME"; exit 1
