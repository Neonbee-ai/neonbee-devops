# nbci controller DNS: the controller commits its (ephemeral) IP to nbci-ip.txt on this branch at boot when
# nbci.moonhive.in does not resolve to it; this job (on the controller's own nb-ctl runner) upserts the DNS-only
# A record. The Cloudflare token never leaves GitHub. Never touches LB pools (castle-rock is off-limits).
name: ops-nbci-dns
on:
  push:
    branches: [ops/nbci-dns]
    paths: [nbci-ip.txt]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: nbci-dns, cancel-in-progress: false }
jobs:
  dns:
    runs-on: [self-hosted, nb-ctl]
    timeout-minutes: 5
    steps:
      - name: Upsert A record nbci.moonhive.in
        env:
          T1: ${{ secrets.CF_PREVIEW_API_TOKEN }}
          T2: ${{ secrets.CF_SAAS_API_TOKEN }}
          ZONE_NAME: moonhive.in
          REC: nbci.moonhive.in
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          IP=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw' \
            "https://api.github.com/repos/$REPO/contents/nbci-ip.txt?ref=$REF" | tr -d '[:space:]')
          [[ "$IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "bad ip in nbci-ip.txt"; exit 1; }
          API=https://api.cloudflare.com/client/v4
          for T in "$T1" "$T2"; do
            [ -n "$T" ] || continue
            Z=$(curl -s -H "Authorization: Bearer $T" "$API/zones?name=$ZONE_NAME" | jq -r '.result[0].id // empty')
            [ -n "$Z" ] || { echo "token cannot see $ZONE_NAME, trying next"; continue; }
            ID=$(curl -s -H "Authorization: Bearer $T" "$API/zones/$Z/dns_records?type=A&name=$REC" | jq -r '.result[0].id // empty')
            BODY=$(jq -nc --arg n "$REC" --arg c "$IP" '{type:"A",name:$n,content:$c,ttl:60,proxied:false,comment:"nbci controller (GCE ephemeral IP, set at boot)"}')
            if [ -n "$ID" ]; then R=$(curl -s -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$API/zones/$Z/dns_records/$ID" -d "$BODY")
            else R=$(curl -s -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$API/zones/$Z/dns_records" -d "$BODY"); fi
            echo "$R" | jq -c '{success, errors, rec: (.result | {name, content, proxied, ttl})}'
            [ "$(echo "$R" | jq -r .success)" = true ] && exit 0
          done
          echo "no token could write $ZONE_NAME"; exit 1
