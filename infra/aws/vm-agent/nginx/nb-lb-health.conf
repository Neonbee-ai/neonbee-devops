# Include inside EVERY nginx server block that Cloudflare can reach on :80/:443
# (at least the one the CF monitor's Host header hits, api.neonbee.app):
#     include /etc/nginx/snippets/nb-lb-health.conf;
# 200 "ok" only while nb-health.sh says the critical set is healthy, else 503.
location = /__lb_health {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    root /var/lib/nb-agent/www;
    try_files /__lb_health =503;
}
