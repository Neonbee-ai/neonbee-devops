# =============================================================================
# dev.api.skyoffice360.com.conf — Dev API gateway (dev-api.skyoffice360.com)
# Live at /etc/nginx/sites-available/dev.api.skyoffice360.com on Dev VM
# 84.247.131.148. Snapshot of the hand-maintained VM file; no workflow applies
# it. Each backend module needs an upstream + `location /<module>` block here,
# otherwise requests get 404 "no such module on the dev gateway".
# =============================================================================
# SO360 V.2 API Gateway - DEV Environment
# Generated: Wed Mar 25 08:38:07 UTC 2026

# CORS origin mapping — allows any skyoffice360.com origin or localhost.
# Variable renamed so360_cors_origin to avoid conflicts with other nginx configs.
# Regex keys in nginx map must NOT be quoted — ~* prefix only works unquoted.
map $http_origin $so360_cors_origin {
    default "";
    ~*neonbee.app $http_origin;
    ~*chrome-extension:// $http_origin;
    ~*skyoffice360\.com $http_origin;
    ~*localhost $http_origin;
}

# Upstream backend definitions — dev port = prod port - 2000 (SERVICE_PORT_BAND 6000)
upstream core_backend_dev {
    server 127.0.0.1:6000;
}

upstream crm_backend_dev {
    server 127.0.0.1:6003;
}

upstream inventory_backend_dev {
    server 127.0.0.1:6006;
}

upstream accounting_backend_dev {
    server 127.0.0.1:6008;
}

upstream projects_backend_dev {
    server 127.0.0.1:6010;
}

upstream timesheet_backend_dev {
    server 127.0.0.1:6012;
}

upstream people_backend_dev {
    server 127.0.0.1:6015;
}

upstream inbox_backend_dev {
    server 127.0.0.1:6017;
}

upstream neura_backend_dev {
    server 127.0.0.1:6018;
}

upstream storefront_backend_dev {
    server 127.0.0.1:6020;
}

upstream flow_backend_dev {
    server 127.0.0.1:6021;
}

upstream insight_backend_dev {
    server 127.0.0.1:6023;
}

upstream subscription_backend_dev {
    server 127.0.0.1:6026;
}

upstream forms_backend_dev {
    server 127.0.0.1:6027;
}

upstream dailystore_backend_dev {
    server 127.0.0.1:6029;
}

upstream fulfillment_backend_dev {
    server 127.0.0.1:6032;
}

upstream support_backend_dev {
    server 127.0.0.1:6033;
}

upstream manufacturing_backend_dev {
    server 127.0.0.1:6034;
}

upstream chat_backend_dev {
    server 127.0.0.1:6036;
}

upstream documents_backend_dev {
    server 127.0.0.1:6037;
}

upstream sign_backend_dev {
    server 127.0.0.1:6038;
}

upstream mobility_backend_dev {
    server 127.0.0.1:6040;
}

upstream folio_backend_dev {
    server 127.0.0.1:6044;
}

upstream connect_backend_dev {
    server 127.0.0.1:6048;
}

upstream signal_backend_dev {
    server 127.0.0.1:6049;
}

upstream marketing_backend_dev {
    server 127.0.0.1:6056;
}

# HTTP server (redirect to HTTPS)
server {
    if ($host = dev-api.skyoffice360.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name dev-api.skyoffice360.com;
    return 301 https://$server_name$request_uri;


}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name dev-api.skyoffice360.com;

    # SSL Configuration (will be managed by Certbot)
    # Certbot will add SSL certificate paths here

    # Logging
    access_log /var/log/nginx/api-dev-access.log;
    error_log /var/log/nginx/api-dev-error.log;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS — belt-and-suspenders at gateway level (backends also set CORS)
    add_header Access-Control-Allow-Origin $so360_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant-Id, X-Org-Id, X-User-Id, X-User-Name, access-token, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # Strip upstream CORS headers — prevents duplicate headers since nginx adds its own below.
    # Both nginx and NestJS set these; proxy_hide_header removes the upstream copy first.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    location /core {
        rewrite ^/core/(.*) /$1 break;
        proxy_pass http://core_backend_dev;
    }

    location /crm {
        rewrite ^/crm/(.*) /$1 break;
        proxy_pass http://crm_backend_dev;
    }

    location /inventory {
        rewrite ^/inventory/(.*) /$1 break;
        proxy_pass http://inventory_backend_dev;
    }

    location /accounting {
        rewrite ^/accounting/(.*) /$1 break;
        proxy_pass http://accounting_backend_dev;
    }

    location /projects {
        rewrite ^/projects/(.*) /$1 break;
        proxy_pass http://projects_backend_dev;
    }

    location /timesheet {
        rewrite ^/timesheet/(.*) /$1 break;
        proxy_pass http://timesheet_backend_dev;
    }

    location /people {
        rewrite ^/people/(.*) /$1 break;
        proxy_pass http://people_backend_dev;
    }

    location /inbox {
        rewrite ^/inbox/(.*) /$1 break;
        proxy_pass http://inbox_backend_dev;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location /neura {
        rewrite ^/neura/(.*) /$1 break;
        proxy_pass http://neura_backend_dev;
    }

    location /storefront {
        rewrite ^/storefront/(.*) /$1 break;
        proxy_pass http://storefront_backend_dev;
    }

    location /flow {
        rewrite ^/flow/(.*) /$1 break;
        proxy_pass http://flow_backend_dev;
    }

    location /insight {
        rewrite ^/insight/(.*) /$1 break;
        proxy_pass http://insight_backend_dev;
    }

    location /subscription {
        rewrite ^/subscription/(.*) /$1 break;
        proxy_pass http://subscription_backend_dev;
    }

    location /forms {
        rewrite ^/forms/(.*) /$1 break;
        proxy_pass http://forms_backend_dev;
    }

    location /dailystore {
        rewrite ^/dailystore/(.*) /$1 break;
        proxy_pass http://dailystore_backend_dev;
    }

    location /fulfillment {
        rewrite ^/fulfillment/(.*) /$1 break;
        proxy_pass http://fulfillment_backend_dev;
    }

    location /support {
        rewrite ^/support/(.*) /$1 break;
        proxy_pass http://support_backend_dev;
        # Ticket presence (Socket.IO /presence namespace)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location /manufacturing {
        rewrite ^/manufacturing/(.*) /$1 break;
        proxy_pass http://manufacturing_backend_dev;
    }

    location /chat {
        rewrite ^/chat/(.*) /$1 break;
        proxy_pass http://chat_backend_dev;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location /documents {
        rewrite ^/documents/(.*) /$1 break;
        proxy_pass http://documents_backend_dev;
    }

    location /sign {
        rewrite ^/sign/(.*) /$1 break;
        proxy_pass http://sign_backend_dev;
    }

    location /mobility {
        rewrite ^/mobility/(.*) /$1 break;
        proxy_pass http://mobility_backend_dev;
    }

    location /folio {
        rewrite ^/folio/(.*) /$1 break;
        proxy_pass http://folio_backend_dev;
    }

    location /connect {
        rewrite ^/connect/(.*) /$1 break;
        proxy_pass http://connect_backend_dev;
    }

    location /signal {
        rewrite ^/signal/(.*) /$1 break;
        proxy_pass http://signal_backend_dev;
    }

    location /marketing {
        rewrite ^/marketing/(.*) /$1 break;
        proxy_pass http://marketing_backend_dev;
    }

    # Health check endpoint
    location /health {
        return 200 "API Gateway OK (dev)\n";
        add_header Content-Type text/plain;
    }

    # Gateway index — exact path only
    location = / {
        return 200 '{"message":"SO360 V.2 API Gateway","environment":"dev","modules":25}';
        add_header Content-Type application/json;
    }

    # Anything else is an unrouted module: fail loudly instead of returning a
    # 200 gateway blurb that makes dead modules look healthy.
    location / {
        return 404 '{"error":"no such module on the dev gateway","path":"$uri"}';
        add_header Content-Type application/json;
    }

    ssl_certificate /etc/letsencrypt/live/dev.api.skyoffice360.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev.api.skyoffice360.com/privkey.pem; # managed by Certbot
}
