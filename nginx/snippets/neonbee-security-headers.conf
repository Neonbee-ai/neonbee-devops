# neonbee-security-headers.conf  (AutoQA X1 security-headers)
# Install on the VM as /etc/nginx/snippets/neonbee-security-headers.conf, then:
#   include /etc/nginx/snippets/neonbee-security-headers.conf;
# nginx add_header is NOT inherited into a block that declares its own
# add_header, so this include must be repeated in every location that sets one.
#
# CSP is built for the Module Federation shell: remotes load from the cdn host
# (script-src), the shell calls the API / SSO / Supabase hosts (connect-src),
# Vite emits an inline theme script (script-src 'unsafe-inline'), Google Fonts,
# Razorpay checkout, Bunny CDN images and blob: workers. No 'unsafe-eval'.
# R2 presigned PUT/GET (vault uploads, PDF previews) need connect-src + frame-src;
# the storefront preview modal frames *.neonbee.store.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://*.neonbee.app https://*.skyoffice360.com; script-src 'self' 'unsafe-inline' https://cdn.neonbee.app https://*.neonbee.app https://*.skyoffice360.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.neonbee.app https://*.skyoffice360.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.neonbee.app https://*.skyoffice360.com; img-src 'self' https: data: blob:; media-src 'self' https: blob:; worker-src 'self' blob: https://cdn.neonbee.app https://*.skyoffice360.com; connect-src 'self' https://*.neonbee.app wss://*.neonbee.app https://*.neonbee.store https://*.neonbee.ai https://*.skyoffice360.com wss://*.skyoffice360.com https://*.supabase.co wss://*.supabase.co https://*.b-cdn.net https://api.razorpay.com https://lumberjack.razorpay.com https://*.r2.cloudflarestorage.com https://*.r2.dev; frame-src 'self' blob: data: https://*.neonbee.app https://*.neonbee.store https://*.neonbee.ai https://*.skyoffice360.com https://*.supabase.co https://*.r2.cloudflarestorage.com https://*.r2.dev https://api.razorpay.com https://checkout.razorpay.com https://*.b-cdn.net" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
