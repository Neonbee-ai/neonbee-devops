# =============================================================================
# tools.neonbee.app.conf — Neonbee Free Tools (so360-shell-fe, tools flavor)
# Serves /var/www/tools.neonbee.app/html on BOTH the Prod VM and the HA VM.
# Installed by neonbee-tools-provision.yml; populated by so360-shell-fe
# deploy-prod.yml (deploy-tools job) on every main push.
# =============================================================================

server {
    listen 80; listen [::]:80;
    server_name tools.neonbee.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name tools.neonbee.app;

    # Cloudflare origin cert (same cert the dashboard/HA vhosts use)
    ssl_certificate /etc/ssl/cloudflare/neonbee.app.crt;
    ssl_certificate_key /etc/ssl/cloudflare/neonbee.app.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/tools.neonbee.app-access.log;
    error_log  /var/log/nginx/tools.neonbee.app-error.log;

    root /var/www/tools.neonbee.app/html;
    index index.html;

    # index.html — never cache so browsers always fetch latest chunk hashes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets — long cache. No `always`: a deploy-window 404 must
    # never be cached as immutable (see tests/test_nginx_cache_contract.py).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
