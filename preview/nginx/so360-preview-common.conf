# /etc/nginx/snippets/so360-preview-common.conf
# Included in every pr-<slug>.skyoffice360.com server block (preview-ctl).
#
# The overlay: develop's builds hard-code dev-* hostnames (VITE_* are baked at
# build time). Rewriting them to this preview's own host means an UNCHANGED
# develop shell fetches /cdn/<mfe>/ and /api/<svc>/ from the preview, and nginx
# then serves the preview's copy if the branch has one, else develop's.
# Preview builds are ordinary dev builds, so the same rewrite applies to them.

add_header X-Robots-Tag "noindex, nofollow" always;
client_max_body_size 50M;

# Precompressed files would bypass sub_filter.
gzip_static off;
gzip on;
gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

sub_filter_once off;
sub_filter_last_modified on;
sub_filter_types application/javascript text/javascript text/css application/json;
sub_filter 'https://dev-cdn.skyoffice360.com'       'https://$host/cdn';
sub_filter 'https://dev-api.skyoffice360.com'       'https://$host/api';
sub_filter 'https://dev-dashboard.skyoffice360.com' 'https://$host';

location = /__preview {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"preview":"$pv_slug"}';
}

# MFEs the preview does not contain → develop's copy on dev-cdn.
location ^~ /cdn/ {
    set $pv_upstream_host dev-cdn.skyoffice360.com;
    rewrite ^/cdn/(.*)$ /$1 break;
    include /etc/nginx/snippets/so360-preview-fallback.conf;
}

# Services the preview does not contain → develop's on dev-api. The header
# lets dev-api route service-to-service calls back to a preview (phase 2).
location ^~ /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass https://so360_dev_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name dev-api.skyoffice360.com;
    proxy_set_header Host dev-api.skyoffice360.com;
    proxy_set_header X-SO360-Preview $pv_slug;
    include /etc/nginx/snippets/so360-preview-api.conf;
}

location @asleep {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"preview_backend_unavailable","detail":"This preview backend is asleep or failed its health check. Push to the branch (or run the preview reconcile workflow with wake) to start it."}';
}
