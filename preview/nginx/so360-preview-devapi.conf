# /etc/nginx/snippets/so360-preview-devapi.conf
# Proxy an (already rewritten) API request to develop's services on dev-api,
# straight to the Dev VM origin. The header lets dev-api route
# service-to-service calls back to a preview (phase 2).
proxy_pass https://so360_dev_origin;
proxy_ssl_server_name on;
proxy_ssl_name dev-api.skyoffice360.com;
proxy_set_header Host dev-api.skyoffice360.com;
proxy_set_header X-SO360-Preview $pv_slug;
include /etc/nginx/snippets/so360-preview-api.conf;
