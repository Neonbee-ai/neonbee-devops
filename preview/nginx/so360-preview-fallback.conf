# /etc/nginx/snippets/so360-preview-fallback.conf
# Proxy a static request to the Dev VM origin, bypassing Cloudflare (so the
# Access gate on dev-dashboard is not hit twice). $pv_upstream_host picks the
# vhost. Upstream compression is disabled so sub_filter can rewrite the body.
proxy_pass https://so360_dev_origin;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_ssl_server_name on;
proxy_ssl_name $pv_upstream_host;
proxy_set_header Host $pv_upstream_host;
proxy_set_header Accept-Encoding "";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;

# Cache hashed assets only ($pv_nocache, set in the generated config).
# index.html and remoteEntry.js always come fresh. A 404 is never stored.
proxy_cache so360pv;
proxy_cache_key "$pv_upstream_host$uri";
proxy_cache_valid 200 1h;
proxy_no_cache $pv_nocache;
proxy_cache_bypass $pv_nocache;
proxy_cache_use_stale error timeout updating;
# add_header here drops the server-level ones, so repeat noindex.
add_header X-Preview-Source develop always;
add_header X-Robots-Tag "noindex, nofollow" always;
