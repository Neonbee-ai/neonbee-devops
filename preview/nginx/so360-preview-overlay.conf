# /etc/nginx/snippets/so360-preview-overlay.conf
# The develop fallbacks for /cdn/ and /api/, included by the main preview host
# and by static site hosts (not by Next hosts, which own their /api routes).

# MFEs the preview does not contain → develop's copy on dev-cdn.
location ^~ /cdn/ {
    set $pv_upstream_host dev-cdn.skyoffice360.com;
    rewrite ^/cdn/(.*)$ /$1 break;
    include /etc/nginx/snippets/so360-preview-fallback.conf;
}

# Services the preview does not contain → develop's on dev-api.
location ^~ /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    include /etc/nginx/snippets/so360-preview-devapi.conf;
}
