# /etc/nginx/snippets/so360-preview-static.conf
# Files a preview built itself. They change on every push under stable names
# (remoteEntry.js, index.html), so never let a browser pin them.
add_header Cache-Control "no-cache" always;
add_header Access-Control-Allow-Origin "*" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Preview-Source "$pv_slug" always;
